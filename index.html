<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6e7ff">
<title>Lotl Quest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🦎</text></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1b1030;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;}
  #game{display:block;width:100%;height:100%;touch-action:none;}
  #rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;
    background:#f6e7ff;color:#4a2d6b;font:700 24px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;z-index:9}
  @media (orientation:portrait) and (max-width:900px){ #rotate{display:grid} }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">🔄<br>Turn your tablet sideways<br>to play Lotl Quest!</div>
<script>
"use strict";
/* ============================================================
   LOTL QUEST  —  first draft
   Art direction + characters by the 8-year-old boss.
   Single file, no dependencies. Runs from file:// or any host.
   ============================================================ */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha: false });

/* ---------- world / viewport ---------- */
const H = 720;                 // logical height, always
let W = 1280;                  // logical width, from aspect
let scale = 1, offX = 0, offY = 0;

function resize() {
  const cw = window.innerWidth, ch = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(880, Math.min(1700, Math.round(H * (cw / ch))));
  cvs.width = Math.round(cw * dpr);
  cvs.height = Math.round(ch * dpr);
  cvs.style.width = cw + 'px';
  cvs.style.height = ch + 'px';
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2;
  offY = (ch - H * scale) / 2;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

const toWorld = (cx, cy) => ({ x: (cx - offX) / scale, y: (cy - offY) / scale });

/* ---------- tiny helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const TAU = Math.PI * 2;

/* ---------- save data ---------- */
const SAVE_KEY = 'lotlquest.save.v1';
let save = { best: 0, orbsAll: 0, plays: 0, mute: false, bestStage: 1, seen: [], checkpoint: 0, champion: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

/* ---------- sound (tiny WebAudio blips) ---------- */
const Snd = {
  ac: null,
  boot() { if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
           if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  blip(freq, dur, type, vol) {
    if (save.mute || !this.ac) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol == null ? 0.16 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  slide(f1, f2, dur, type, vol) {
    if (save.mute || !this.ac) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(vol == null ? 0.18 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  orb(combo) {
    // pitch climbs with the chain — the whole point of chaining
    const step = Math.min(combo || 0, 24);
    this.blip(560 * Math.pow(1.055, step), 0.09, 'sine', 0.10);
  },
  combo(n) { this.blip(300 + n * 12, 0.16, 'triangle', 0.12); },
  shoot() { this.blip(rnd(300, 340), 0.06, 'square', 0.04); },
  pop()   { this.slide(360, 90, 0.16, 'sawtooth', 0.10); },
  hurt()  { this.slide(220, 60, 0.35, 'sawtooth', 0.18); },
  power() { this.slide(200, 1200, 0.45, 'triangle', 0.20); },
  heal()  { this.slide(500, 1000, 0.30, 'sine', 0.16); },
  boss()  { this.slide(120, 55, 0.9, 'sawtooth', 0.22); },
  win()   { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.blip(f, 0.22, 'triangle', 0.16), i * 110)); },
  ui()    { this.blip(700, 0.07, 'triangle', 0.10); }
};

/* ============================================================
   CHARACTERS — straight off the drawn cards
   ============================================================ */
const LOTLS = [
  { id: 'mochi', name: 'Mochi', body: '#fff3f5', fin: '#ff4d4d', gill: '#ff2d55', trail: '#ffb3c1',
    blurb: 'Squishy + kind. Heals the team.',
    powerName: 'MOCHI BOUNCE', powerIcon: '💗',
    tip: "Restores everyone's health and blasts nearby danger away." },
  { id: 'coal', name: 'Coal', body: '#5f5f6d', fin: '#141419', gill: '#26262e',
    eye: '#f6f4ff', shot: '#b98cff',
    trail: '#c9a6ff', blurb: 'Cool and clever. Bubble machine.',
    powerName: 'BUBBLE STORM', powerIcon: '🫧',
    tip: 'Fires bubbles in every direction at once.' },
  { id: 'matcha', name: 'Matcha', body: '#c8f08a', fin: '#3faa3f', gill: '#1f7a1f', trail: '#9be36b',
    blurb: 'Fast and brave. Vine puncher.',
    powerName: 'VINE BEAM', powerIcon: '🌿',
    tip: 'A giant green beam in the direction you face.',
    unlock: { kind: 'orbs', n: 75, label: 'Collect 75 orbs' } },
  { id: 'storm', name: 'Storm', body: '#2a2a3a', fin: '#5b5bff', gill: '#9b7bff', trail: '#8f8fff',
    blurb: 'Mysterious. Made of thunder.',
    powerName: 'THUNDER', powerIcon: '⚡',
    tip: 'Lightning zaps every nearby enemy.',
    unlock: { kind: 'stage', n: 2, label: 'Reach level 2' } },
  // the last four are earned by playing — a ladder that alternates orbs and stages
  { id: 'blaze', name: 'Blaze', body: '#ffe14d', fin: '#ff8a1f', gill: '#ff5e00', trail: '#ffc46b',
    blurb: 'Loud, hot, always first into the fight.',
    powerName: 'FIRE BLAST', powerIcon: '🔥',
    tip: 'A huge spray of fireballs in the direction you face.',
    unlock: { kind: 'orbs', n: 300, label: 'Collect 300 orbs' } },
  { id: 'splash', name: 'Splash', body: '#8fd4ff', fin: '#ffe14d', gill: '#2f8fd6', trail: '#bfe9ff',
    blurb: 'Makes the whole sea come to you.',
    powerName: 'WHIRLPOOL', powerIcon: '🌀',
    tip: 'Sucks every nearby orb right into you.',
    unlock: { kind: 'stage', n: 4, label: 'Reach level 4' } }
];

// bullets and bursts use `shot` when the fin is too dark to see in the water
const shotColor = l => l.shot || l.fin;

const isUnlocked = l => !l.unlock ||
  (l.unlock.kind === 'orbs' ? save.orbsAll >= l.unlock.n : save.bestStage >= l.unlock.n);
const unlockProgress = l => l.unlock
  ? clamp((l.unlock.kind === 'orbs' ? save.orbsAll : save.bestStage) / l.unlock.n, 0, 1) : 1;
const unlockNow = l => l.unlock
  ? (l.unlock.kind === 'orbs' ? save.orbsAll : save.bestStage) : 0;

/* ============================================================
   GAME STATE
   ============================================================ */
const G = {
  screen: 'title',     // title | select | levels | play | paused | over | help
  t: 0,                // frames
  players: [],         // supports N — multiplayer-ready
  bullets: [], ebullets: [], orbs: [], foes: [], fx: [], pickups: [],
  hazards: [],         // telegraphed boss attacks: a warning stripe, then the hit
  boss: null,
  stage: 1,
  stageTimer: 0,
  score: 0, orbCount: 0,
  combo: 0, comboTimer: 0, bestCombo: 0,
  freeze: 0, rushT: 0,
  tick: 0,
  shake: 0,
  coop: false,
  training: false,     // practice run: lessons on screen, nobody can be beaten
  coach: null,         // {step, t, base, swum, hits, powers} while training
  bgBubbles: [],
  banner: null,        // {text, sub, t}
  selIndex: 0,
  selP2: 1,
  levelSel: 1
};

const STAGE_LEN = 60 * 42;   // ~42s of swimming, then a boss
const PLAYER_MAX_HEALTH = 100;
const HIT_DAMAGE = 34;
const HEAL_AMOUNT = 30;
const AUTO_AIM_TIME = 60 * 7;
const TRAINING_FLOOR = 25;    // in training you can be hurt, never beaten
const TRAINING_REGEN = 0.10;  // HP per frame, so the bar visibly climbs back

// Training lessons. Each one watches a single number and waits for it to climb
// by `need`; `auto` moves things along for the ones you can pass by doing nothing.
const TRAINING_STEPS = [
  { title: 'SWIM WITH ME',
    text: 'Put a finger anywhere and drag — your lotl follows it. Arrow keys work too.',
    need: 1500, got: (p, c) => c.swum },
  { title: 'GRAB THE PURPLE ORBS',
    text: 'Orbs are your points. Swim through them! Grab a few in a row to start a chain.',
    need: 8, got: p => p.orbs },
  { title: 'YOUR TRIDENT FIRES ITSELF',
    text: 'It always shoots forward, to the right. Line the enemies up on your right side.',
    need: 4, got: p => p.kills },
  { title: 'WATCH YOUR HEALTH',
    text: 'Enemies hurt, and the bar up top shows it. In training you always heal back up — try dodging!',
    need: 1, got: (p, c) => c.hits, auto: 60 * 12 },
  { title: 'YOUR BIG POWER',
    text: 'The round button is full. Tap it — or press SPACE — to let your power go!',
    need: 1, got: (p, c) => c.powers, setup: p => { p.power = p.powerMax; } },
  { title: "YOU'RE READY!",
    text: 'Practise as long as you like. In the real game every level ends with a boss — 8 worlds, 8 bosses. Beat one and a new world begins.',
    need: Infinity, got: () => 0 }
];

/* ---------- player ---------- */
function makePlayer(lotlIndex, slot) {
  const l = LOTLS[lotlIndex];
  return {
    lotl: l, lotlIndex, slot,
    x: 190 + slot * 90, y: H / 2 + slot * 90,
    tx: 190 + slot * 90, ty: H / 2 + slot * 90,
    vx: 0, vy: 0,
    r: 30, health: PLAYER_MAX_HEALTH, maxHealth: PLAYER_MAX_HEALTH,
    inv: 90, cool: 0, power: 0, powerMax: 100,
    alive: true, downTimer: 0,
    pointerId: null, tail: 0, bob: rnd(0, TAU),
    facing: 1,           // lotls always face — and fire — right
    aimTimer: 0, aimTarget: null,
    kills: 0, orbs: 0
  };
}

// startStage > 1 is a "continue": same run, it just begins further along.
function startRun(coop, training, startStage) {
  G.coop = !!coop;
  G.training = !!training;
  G.coach = training ? { step: 0, t: 0, base: 0, swum: 0, hits: 0, powers: 0 } : null;
  G.players = [makePlayer(G.selIndex, 0)];
  if (coop) G.players.push(makePlayer(G.selP2, 1));
  G.bullets.length = 0; G.ebullets.length = 0; G.orbs.length = 0;
  G.foes.length = 0; G.fx.length = 0; G.pickups.length = 0; G.hazards.length = 0;
  G.boss = null; G.stage = training ? 1 : Math.max(1, startStage || 1); G.stageTimer = 0;
  G.startStage = G.stage;
  G.score = 0; G.orbCount = 0; G.shake = 0; G.t = 0; G.tick = 0;
  G.combo = 0; G.comboTimer = 0; G.bestCombo = 0; G.freeze = 0; G.newUnlocks = [];
  G.screen = 'play';
  if (training) {
    banner('TRAINING', "Nothing can beat you here — take your time!");
    return;                                  // practice runs stay out of the save file
  }
  banner('LEVEL ' + G.stage + ': ' + stageTheme().name,
    G.stage === 1 ? 'Swim! Grab the purple orbs!' : 'Boss at the end: ' + bossFor(G.stage).name + '!');
  save.plays++; persist();
}

// Where "continue" drops you: the level the last real run ended on.
const checkpoint = () => (save.checkpoint > 1 ? save.checkpoint : 0);
function leaveRun() {
  if (!G.training && G.players.length && G.stage > 1) { save.checkpoint = G.stage; persist(); }
  G.screen = 'title'; G.coop = false; G.training = false; G.coach = null;
}

function coachStep() { return G.coach ? TRAINING_STEPS[G.coach.step] : null; }

// Advance the lesson as soon as its number has moved far enough.
function updateCoach(dt) {
  const c = G.coach, p = G.players[0];
  if (!c || !p) return;
  c.t += dt;
  c.swum += Math.hypot(p.vx, p.vy) * dt;
  if (c.step >= TRAINING_STEPS.length - 1) return;   // the last card is the finish line
  if (c.t < 130) return;                             // leave every card up long enough to read
  const step = TRAINING_STEPS[c.step];
  if (step.got(p, c) - c.base < step.need && !(step.auto && c.t > step.auto)) return;

  c.step++; c.t = 0;
  const next = TRAINING_STEPS[c.step];
  c.base = next.got(p, c);
  if (next.setup) for (const pl of G.players) next.setup(pl);
  Snd.win();
  floatText(p.x, p.y - 80, 'Nice!', '#ffd166');
  ring(p.x, p.y, '#ffd166', 170);
}

const banner = (text, sub) => { G.banner = { text, sub: sub || '', t: 0 }; };

/* ============================================================
   INPUT — pointers drive players (slot 0, then slot 1 in co-op)
   ============================================================ */
const buttons = [];   // rebuilt every frame by the UI drawing code, so never compare
const heldIds = new Set();   // button objects across frames — compare their ids
const pointers = new Map();

function hitButton(wx, wy) {
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (b.shape === 'circle') { if (dist2(wx, wy, b.x, b.y) <= b.r * b.r) return b; }
    else if (wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h) return b;
  }
  return null;
}

function claimPlayer(pid, wx, wy) {
  if (G.screen !== 'play') return null;
  // already-claimed check
  for (const p of G.players) if (p.pointerId === pid) return p;
  // co-op: nearest free player wins the finger; solo: player 0 always
  let best = null, bd = Infinity;
  for (const p of G.players) {
    if (p.pointerId !== null) continue;
    const d = dist2(wx, wy, p.x, p.y);
    if (d < bd) { bd = d; best = p; }
  }
  if (best) { best.pointerId = pid; best.tx = wx; best.ty = wy; best.kbIdle = true; }
  return best;
}

function onDown(pid, cx, cy) {
  Snd.boot();
  const w = toWorld(cx, cy);
  const b = hitButton(w.x, w.y);
  if (b) { pointers.set(pid, { btnId: b.id }); heldIds.add(b.id); return; }
  const p = claimPlayer(pid, w.x, w.y);
  pointers.set(pid, { player: p || null, x: w.x, y: w.y });
}

function onMove(pid, cx, cy) {
  const rec = pointers.get(pid);
  if (!rec) return;
  const w = toWorld(cx, cy);
  if (rec.btnId) return;
  if (rec.player) { rec.player.tx = w.x; rec.player.ty = w.y; }
  rec.x = w.x; rec.y = w.y;
}

function onUp(pid, cx, cy) {
  const rec = pointers.get(pid);
  pointers.delete(pid);
  if (!rec) return;
  if (rec.btnId) {
    heldIds.delete(rec.btnId);
    const w = toWorld(cx, cy);
    const b = hitButton(w.x, w.y);
    // same id => the finger came up on the button it went down on
    if (b && b.id === rec.btnId && b.onTap) { Snd.ui(); b.onTap(); }
    return;
  }
  if (rec.player) rec.player.pointerId = null;
}

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cvs.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety, not a requirement */ }
  onDown(e.pointerId, e.clientX, e.clientY);
});
cvs.addEventListener('pointermove', e => { e.preventDefault(); onMove(e.pointerId, e.clientX, e.clientY); });
cvs.addEventListener('pointerup', e => { e.preventDefault(); onUp(e.pointerId, e.clientX, e.clientY); });
cvs.addEventListener('pointercancel', e => {
  const rec = pointers.get(e.pointerId);
  if (rec && rec.btnId) heldIds.delete(rec.btnId);
  onUp(e.pointerId, -9999, -9999);       // cancelled: release, never fire the tap
});
cvs.addEventListener('contextmenu', e => e.preventDefault());

/* keyboard, for grown-ups testing on a laptop */
const keys = new Set();
// move the highlight along the roster, skipping the ones still locked
function navSelect(dir) {
  const n = LOTLS.length;
  const cur = (G.coop && G.pickingP2) ? G.selP2 : G.selIndex;
  for (let step = 1; step <= n; step++) {
    const i = (cur + dir * step + n * step) % n;
    if (!isUnlocked(LOTLS[i])) continue;
    if (G.coop && G.pickingP2) G.selP2 = i; else G.selIndex = i;
    Snd.ui();
    return;
  }
}

window.addEventListener('keydown', e => {
  Snd.boot();
  const k = e.key.toLowerCase();
  keys.add(k);
  const enter = (k === 'enter' || k === ' ');
  const left = (k === 'arrowleft' || k === 'a');
  const right = (k === 'arrowright' || k === 'd');

  if (G.screen === 'title') {
    if (enter) { G.screen = 'select'; Snd.ui(); e.preventDefault(); }
    else if (k === 'h' || k === '?' || k === '/') { G.helpFrom = 'title'; G.screen = 'help'; Snd.ui(); }
    else if (k === 'm') { save.mute = !save.mute; persist(); }
  } else if (G.screen === 'select') {
    if (left) { navSelect(-1); e.preventDefault(); }
    else if (right) { navSelect(1); e.preventDefault(); }
    else if (k === '2') {                       // toggle two-player mode
      G.coop = !G.coop; G.pickingP2 = G.coop;
      if (G.coop && (G.selP2 === G.selIndex || !isUnlocked(LOTLS[G.selP2]))) {
        const other = LOTLS.findIndex((l, i) => i !== G.selIndex && isUnlocked(l));
        G.selP2 = other < 0 ? G.selIndex : other;
      }
      Snd.ui();
    }
    else if (k === '1') { G.coop = false; G.pickingP2 = false; Snd.ui(); }
    else if (enter) { G.pickingP2 = false; startRun(G.coop); e.preventDefault(); }
    else if (k === 't') { G.pickingP2 = false; startRun(G.coop, true); }
    else if (k === 'l') openLevels();
    else if (k === 'h' || k === '?' || k === '/') { G.helpFrom = 'select'; G.screen = 'help'; }
    else if (k === 'escape') { G.coop = false; G.pickingP2 = false; G.screen = 'title'; }
  } else if (G.screen === 'play') {
    if (enter) { firePower(G.players[0]); e.preventDefault(); }
    else if (k === 'q' || k === 'shift' || k === 'tab') {   // player 2's power, near WASD
      if (G.players[1]) firePower(G.players[1]);
      e.preventDefault();
    }
    else if (k === 'escape' || k === 'p') G.screen = 'paused';
    else if (k === 'h' || k === '?' || k === '/') { G.helpFrom = 'play'; G.screen = 'help'; }
  } else if (G.screen === 'paused') {
    if (enter || k === 'escape' || k === 'p') { G.screen = 'play'; e.preventDefault(); }
    else if (k === 'h' || k === '?' || k === '/') { G.helpFrom = 'paused'; G.screen = 'help'; }
    else if (k === 'm') { save.mute = !save.mute; persist(); }
  } else if (G.screen === 'levels') {
    const open = levelsOpen();
    if (left || k === 'arrowup') { G.levelSel = Math.max(1, G.levelSel - (k === 'arrowup' ? 4 : 1)); Snd.ui(); e.preventDefault(); }
    else if (right || k === 'arrowdown') { G.levelSel = Math.min(open, G.levelSel + (k === 'arrowdown' ? 4 : 1)); Snd.ui(); e.preventDefault(); }
    else if (enter) { startRun(G.coop, false, G.levelSel); e.preventDefault(); }
    else if (k === 'c' && checkpoint()) startRun(G.coop, false, checkpoint());
    else if (k === 'escape') G.screen = 'select';
  } else if (G.screen === 'over') {
    if (enter) { startRun(G.coop, false, G.stage); e.preventDefault(); }
    else if (k === 'r') startRun(G.coop);
    else if (k === 'escape') leaveRun();
  } else if (G.screen === 'help') {
    if (enter || k === 'escape' || k === 'h' || k === '?' || k === '/') {
      G.screen = G.helpFrom || 'title';
      e.preventDefault();
    }
  }
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

const KB_SPEED = 6.2;   // world px per frame (~370/sec) — steady, not a slingshot

function keyboardDrive(p, dt) {
  // solo: both key sets drive you. two players on one keyboard: P1 = arrows, P2 = WASD.
  const shared = G.players.length < 2;
  const arrows = shared || p.slot === 0;
  const wasd   = shared || p.slot === 1;
  let dx = 0, dy = 0;
  if (arrows) {
    if (keys.has('arrowleft')) dx -= 1;
    if (keys.has('arrowright')) dx += 1;
    if (keys.has('arrowup')) dy -= 1;
    if (keys.has('arrowdown')) dy += 1;
  }
  if (wasd) {
    if (keys.has('a')) dx -= 1;
    if (keys.has('d')) dx += 1;
    if (keys.has('w')) dy -= 1;
    if (keys.has('s')) dy += 1;
  }
  if (!dx && !dy) return;
  // walk the target point along at a fixed rate instead of throwing it far ahead,
  // so holding a key glides rather than launching
  const m = Math.hypot(dx, dy) || 1;
  if (p.kbIdle !== false) { p.tx = p.x; p.ty = p.y; p.kbIdle = false; }
  p.tx = clamp(p.tx + (dx / m) * KB_SPEED * dt, 40, W - 40);
  p.ty = clamp(p.ty + (dy / m) * KB_SPEED * dt, 46, H - 120);
}

/* ============================================================
   SPAWNING
   ============================================================ */
const FOE_KINDS = {
  blob:   { hp: 2, r: 30, speed: 2.2, score: 20, color: '#ff5a36', dark: '#c1290b' },
  spiker: { hp: 3, r: 28, speed: 3.4, score: 35, color: '#7b3fd6', dark: '#3d1a70' },
  puffer: { hp: 4, r: 36, speed: 1.5, score: 45, color: '#4a4a5c', dark: '#22222e' },
  jelly:  { hp: 1, r: 26, speed: 1.7, score: 15, color: '#ff8fcf', dark: '#b0307a' }   // the Jelly Queen's babies
};

function spawnFoe(kind, y) {
  const k = FOE_KINDS[kind];
  const lvl = 1 + (G.stage - 1) * 0.16;
  G.foes.push({
    kind, x: W + 60, y: y == null ? rnd(90, H - 190) : y,
    r: k.r, hp: Math.round(k.hp * lvl), maxHp: Math.round(k.hp * lvl),
    speed: k.speed * (1 + (G.stage - 1) * 0.05),
    phase: rnd(0, TAU), amp: rnd(20, 70), t: 0, fireAt: rnd(60, 140), flash: 0, baseY: 0
  });
}

function spawnOrb(x, y, vx, vy) {
  G.orbs.push({ x, y, vx: vx == null ? -2.2 : vx, vy: vy || 0, r: 15, phase: rnd(0, TAU), t: 0 });
}

function spawnPickup(x, y, type) {
  G.pickups.push({ x, y, type, r: 20, phase: rnd(0, TAU), t: 0 });
}

function director() {
  const s = G.stage;
  const t = G.tick;
  if (G.boss) {
    // boss fights run long, so a heart still floats by now and then
    if (t % 720 === 360) spawnPickup(W + 30, rnd(120, H - 220), 'heart');
    return;
  }
  // training introduces one thing at a time — nothing arrives before its lesson
  const lesson = G.coach ? G.coach.step : 99;

  // orb ribbons — the main "yum" of the game
  if (lesson >= 1 && t % 44 === 0) {
    const y0 = rnd(120, H - 220);
    const n = 5 + ((Math.random() * 4) | 0);
    const wave = rnd(-1, 1) * 40;
    for (let i = 0; i < n; i++) {
      setTimeout(() => { if (G.screen === 'play') spawnOrb(W + 30, clamp(y0 + Math.sin(i * 0.7) * wave, 80, H - 190)); }, i * 90);
    }
  }
  // foes
  const rate = Math.max(34, 96 - s * 7);
  if (lesson >= 2 && t > 90 && t % rate === 0) {
    const roll = Math.random();
    if (s >= 3 && roll > 0.82) spawnFoe('puffer');
    else if (s >= 2 && roll > 0.55) spawnFoe('spiker');
    else spawnFoe('blob');
  }
  // occasional health refill and temporary auto-aim power-up
  if (lesson >= 3 && t % 900 === 400) spawnPickup(W + 30, rnd(120, H - 220), 'heart');
  if (lesson >= 3 && t > 180 && t % 1250 === 700) spawnPickup(W + 30, rnd(120, H - 220), 'target');

  // ORB RUSH — a big shimmering river of orbs to chain through
  if (lesson >= 5 && t > 300 && t % 1150 === 0) {
    banner('ORB RUSH!', 'Chain them all!');
    Snd.win();
    const y0 = rnd(200, H - 260), amp = rnd(70, 140);
    for (let i = 0; i < 42; i++) {
      setTimeout(() => {
        if (G.screen === 'play') spawnOrb(W + 30, clamp(y0 + Math.sin(i * 0.42) * amp, 80, H - 180), -3.0);
      }, i * 55);
    }
  }
}

/* ============================================================
   BOSSES — one per world, eight worlds, then round 2 (tougher)
   A boss is a plain object: how it moves and attacks (update) and
   how it looks (draw). They all share the enter / hurt / die
   plumbing in updateBoss(). Kid rules for every attack:
   - anything big gets a flashing warning stripe first (HAZARDS)
   - bullets stay near the Magma Lotl's pace: ~2/sec calm, ~3.4 angry
   - there is always somewhere safe to swim
   ============================================================ */

// someone to aim at — any living player, so co-op doesn't pick on P1
function bossTarget() {
  const L = livingPlayers();
  return L.length ? L[(Math.random() * L.length) | 0] : null;
}
function shootE(x, y, ang, speed, r, kind, extra) {
  const b = { x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, r, kind, t: 0 };
  G.ebullets.push(extra ? Object.assign(b, extra) : b);
}
// The angle that leans off straight-left (PI) toward a target by k (0..1).
// atan2 returns near -PI above the shooter and near +PI below it, so the raw
// difference is a whole turn out on one side — wrap it, or half the volleys
// fly backwards.
function leanAt(fx, fy, tgt, k) {
  let lead = tgt ? Math.atan2(tgt.y - fy, tgt.x - fx) - Math.PI : 0;
  lead = Math.atan2(Math.sin(lead), Math.cos(lead));
  return Math.PI + lead * (k == null ? 1 : k);
}
// A wall of bullets marching left with one gap big enough to swim through.
function gapWall(x, kind, speed, gapH) {
  const top = 70, bottom = H - 140, step = 50;
  const gy = rnd(top + gapH / 2, bottom - gapH / 2);
  for (let y = top; y <= bottom; y += step) {
    if (Math.abs(y - gy) < gapH / 2) continue;
    shootE(x, y, Math.PI, speed, 17, kind);
  }
}
// x positions for column attacks: the first one on top of you, the rest
// spread out so two stripes never merge into one you can't escape.
function spreadXs(firstX, extra, lo, hi) {
  const xs = [clamp(firstX, lo, hi)];
  for (let k = 0; k < extra; k++) {
    let x, tries = 0;
    do { x = rnd(lo, hi); } while (tries++ < 30 && xs.some(o => Math.abs(o - x) < 170));
    xs.push(x);
  }
  return xs;
}

/* ---------- hazards: a warning stripe first, then the hit ---------- */
// {x, y, w, h, warn, active, style, onFire}. While t < warn it only flashes;
// for the next `active` frames anyone inside it gets hurt. onFire runs once
// when the warning ends (the icicle uses it to drop the real icicle).
function addHazard(o) {
  const hz = Object.assign({ t: 0, warn: 60, active: 30, style: 'zap' }, o);
  G.hazards.push(hz);
  return hz;
}
function circleHitsRect(cx, cy, r, x, y, w, h) {
  const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
  return dist2(cx, cy, nx, ny) < r * r;
}
function updateHazards(dt) {
  for (let i = G.hazards.length - 1; i >= 0; i--) {
    const hz = G.hazards[i];
    const before = hz.t;
    hz.t += dt;
    if (before < hz.warn && hz.t >= hz.warn) {
      if (hz.onFire) hz.onFire(hz);
      if (hz.active > 0) {
        G.shake = Math.max(G.shake, 7);
        if (hz.style === 'zap') Snd.slide(1400, 120, 0.3, 'sawtooth', 0.12);
        else Snd.slide(260, 80, 0.25, 'square', 0.10);
      }
    }
    if (hz.t >= hz.warn && hz.t < hz.warn + hz.active) {
      // a little forgiveness at the edges: only a real overlap counts
      for (const p of G.players) {
        if (p.alive && circleHitsRect(p.x, p.y, p.r - 10, hz.x, hz.y, hz.w, hz.h)) hurtPlayer(p);
      }
    }
    if (hz.t >= hz.warn + hz.active) G.hazards.splice(i, 1);
  }
}
