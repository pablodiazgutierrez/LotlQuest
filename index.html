function drawLevels() {
  bigTitle('PICK A LEVEL', 58, 44, '#ffd166');
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = '800 19px system-ui,sans-serif'; ctx.fillStyle = '#6b4a8f';
  ctx.fillText((G.coop ? '👥 2 players  ·  ' : '') + 'Beat a boss to open the next level', W / 2, 98);

  const open = levelsOpen(), cp = checkpoint();
  const gap = 18, tw = Math.min(250, (W - 120 - gap * 3) / 4), th = 196;
  const x0 = (W - (tw * 4 + gap * 3)) / 2, y0 = 120;
  for (let i = 0; i < BOSSES.length; i++) {
    const lvl = i + 1, def = BOSSES[i], theme = STAGE_THEMES[i % STAGE_THEMES.length];
    const x = x0 + (i % 4) * (tw + gap), y = y0 + Math.floor(i / 4) * (th + gap);
    const isOpen = lvl <= open, sel = lvl === G.levelSel, isCp = lvl === cp;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; roundRect(x + 4, y + 7, tw, th, 20); ctx.fill();
    roundRect(x, y, tw, th, 20); ctx.save(); ctx.clip();
    const g = ctx.createLinearGradient(0, y, 0, y + th);
    g.addColorStop(0, theme.top); g.addColorStop(0.55, theme.mid); g.addColorStop(1, theme.bottom);
    ctx.fillStyle = g; ctx.fillRect(x, y, tw, th);
    if (isOpen) {
      // the boss itself, small, doing its idle wiggle
      const fake = { def, x: 0, y: 0, r: def.r, t: G.t + i * 50, flash: 0, angry: false, alpha: 1,
                     s: { phase: 'idle', t: 0, clawsOut: 0 }, mode: 'fight' };
      ctx.save(); ctx.translate(x + tw / 2, y + 86); ctx.scale(0.42, 0.42);
      def.draw(fake);
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(30,16,48,0.55)'; ctx.fillRect(x, y, tw, th);
      ctx.font = '900 54px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', x + tw / 2, y + 82);
    }
    // name strip along the bottom
    ctx.fillStyle = 'rgba(30,16,48,0.72)'; ctx.fillRect(x, y + th - 58, tw, 58);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#ffd166';
    fitOne(isOpen ? def.icon + ' ' + def.name : '🔒 LOCKED', x + tw / 2, y + th - 34, tw - 20, 19, '900');
    ctx.fillStyle = '#efe6ff';
    fitOne(isOpen ? theme.name : 'Beat level ' + (lvl - 1) + ' first', x + tw / 2, y + th - 12, tw - 20, 14, '700');
    ctx.restore();
    // level number badge
    ctx.fillStyle = '#fffdf7'; roundRect(x + 10, y + 10, 46, 30, 12); ctx.fill();
    ctx.fillStyle = '#4a2d6b'; ctx.font = '900 18px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(lvl, x + 33, y + 26);
    if (isCp) {
      ctx.fillStyle = '#ffd166'; roundRect(x + tw - 112, y + 10, 102, 30, 12); ctx.fill();
      ctx.fillStyle = '#4a2d6b'; ctx.font = '900 14px system-ui,sans-serif';
      ctx.fillText('⏩ CONTINUE', x + tw - 61, y + 26);
    }
    ctx.strokeStyle = sel ? '#3aa0ff' : isCp ? '#ffd166' : 'rgba(32,20,31,0.6)';
    ctx.lineWidth = sel ? 8 : isCp ? 6 : 4;
    roundRect(x, y, tw, th, 20); ctx.stroke();
    ctx.restore();

    buttons.push({ id: 'lvl' + lvl, x, y, w: tw, h: th, shape: 'rect', label: '',
      onTap: () => {
        if (!isOpen) { Snd.blip(180, 0.12, 'square', 0.08); return; }
        startRun(G.coop, false, lvl);
      } });
  }

  // continue sits up front, and it's the only way back to round-2 levels
  const by = H - 96;
  if (cp) {
    btn({ id: 'continue', x: W / 2 - 230, y: by, w: 460, h: 74,
          label: '⏩ CONTINUE: LEVEL ' + cp + ' · ' + bossFor(cp).name, bg: '#8e44e8',
          font: '800 ' + (cp > 9 ? 23 : 25) + 'px system-ui,sans-serif',
          onTap: () => startRun(G.coop, false, cp) });
  } else {
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = '700 19px system-ui,sans-serif'; ctx.fillStyle = '#6b4a8f';
    ctx.fillText('Tap a level to play it. Wherever you lose, you can continue from there.', W / 2, by + 44);
  }
  btn({ id: 'lvlback', shape: 'circle', x: 52, y: 52, r: 30, label: '↩', bg: 'rgba(255,255,255,0.85)', fg: '#4a2d6b',
        font: '28px system-ui,sans-serif', onTap: () => { G.screen = 'select'; } });
}

function drawPaused() {
  ctx.fillStyle = 'rgba(30,16,48,0.55)'; ctx.fillRect(0, 0, W, H);
  bigTitle('PAUSED', H * 0.32, 72, '#ffd166');
  btn({ x: W / 2 - 150, y: H * 0.48, w: 300, h: 78, label: '▶  KEEP GOING', bg: '#8e44e8',
        onTap: () => { G.screen = 'play'; } });
  btn({ id: 'pausehelp', x: W / 2 - 150, y: H * 0.48 + 96, w: 300, h: 64, label: '?  HOW TO PLAY', bg: '#ffd166',
        fg: '#4a2d6b', font: '800 26px system-ui,sans-serif',
        onTap: () => { G.helpFrom = 'paused'; G.screen = 'help'; } });
  btn({ id: 'pausemenu', x: W / 2 - 150, y: H * 0.48 + 168, w: 300, h: 60, label: '🏠 MENU', bg: '#6b5b8f',
        font: '800 26px system-ui,sans-serif',
        onTap: leaveRun });
  // sound sits beside the column, not on top of it — MENU owns that row
  btn({ id: 'mute2', shape: 'circle', x: W / 2 + 194, y: H * 0.48 + 198, r: 34, label: save.mute ? '🔇' : '🔊',
        bg: 'rgba(255,255,255,0.85)', fg: '#4a2d6b', font: '28px system-ui,sans-serif',
        onTap: () => { save.mute = !save.mute; persist(); } });
}

function drawOver() {
  ctx.fillStyle = 'rgba(30,16,48,0.6)'; ctx.fillRect(0, 0, W, H);
  const isBest = G.score >= save.best && G.score > 0;
  bigTitle(isBest ? 'NEW BEST!' : 'GOOD SWIM!', H * 0.24, 68, isBest ? '#ffd166' : '#fff');
  ctx.textAlign = 'center';
  ctx.font = '900 62px system-ui,sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(G.score.toLocaleString(), W / 2, H * 0.24 + 92);
  ctx.font = '700 24px system-ui,sans-serif'; ctx.fillStyle = '#e0cfff';
  ctx.fillText('🟣 ' + G.orbCount + ' orbs   ·   🌊 level ' + G.stage + ' ' + stageTheme().name + '   ·   ⭐ best ' + save.best.toLocaleString(),
    W / 2, H * 0.24 + 140);

  // best chain of the run
  if (G.bestCombo >= 3) {
    ctx.font = '800 22px system-ui,sans-serif'; ctx.fillStyle = '#ffd166';
    ctx.fillText('🔗 best chain: ' + G.bestCombo, W / 2, H * 0.24 + 174);
  }

  // stars for the run — the unlock card takes this space when there is one
  const hasUnlock = G.newUnlocks && G.newUnlocks.length;
  if (!hasUnlock) {
    const stars = clamp(Math.floor(G.score / 900), 0, 5);
    ctx.font = '40px system-ui,sans-serif';
    let s = '';
    for (let i = 0; i < 5; i++) s += i < stars ? '⭐' : '☆';
    ctx.fillText(s, W / 2, H * 0.24 + 218);
  }

  // a new lotl joined the team
  if (hasUnlock) {
    const l = G.newUnlocks[0];
    const cx = W / 2, cy = H * 0.565;
    ctx.save();
    ctx.globalAlpha = 0.95;
    // sunburst
    ctx.translate(cx, cy);
    ctx.rotate(G.t * 0.006);
    ctx.fillStyle = 'rgba(255,209,102,0.30)';
    for (let i = 0; i < 12; i++) {
      ctx.rotate(TAU / 12);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(150, -22); ctx.lineTo(150, 22); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    drawLotl(cx, cy, 44, l, { t: G.t, seed: 9, trident: true, tilt: Math.sin(G.t * 0.04) * 0.12 });
    ctx.textAlign = 'center';
    ctx.font = '900 30px system-ui,sans-serif';
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#20141f'; ctx.lineWidth = 7;
    const msg = 'NEW LOTL:  ' + l.name.toUpperCase() + '!';
    ctx.strokeText(msg, cx, cy + 78); ctx.fillStyle = '#ffd166'; ctx.fillText(msg, cx, cy + 78);
    ctx.font = '700 18px system-ui,sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(l.powerIcon + ' ' + l.tip, cx, cy + 106);
  }

  if (G.stage > 1) {
    // jump straight back to the level that got you — the exciting part
    btn({ id: 'retrylevel', x: W / 2 - 200, y: H * 0.755, w: 400, h: 78, label: '⏩ TRY LEVEL ' + G.stage + ' AGAIN', bg: '#8e44e8',
          font: '800 30px system-ui,sans-serif', onTap: () => startRun(G.coop, false, G.stage) });
    btn({ id: 'fromstart', x: W / 2 - 210, y: H * 0.755 + 92, w: 200, h: 52, label: '🔁 LEVEL 1', bg: '#3aa0ff',
          font: '700 24px system-ui,sans-serif', onTap: () => startRun(G.coop) });
    btn({ id: 'overmenu', x: W / 2 + 10, y: H * 0.755 + 92, w: 200, h: 52, label: '🏠 MENU', bg: '#6b5b8f',
          font: '700 24px system-ui,sans-serif', onTap: leaveRun });
  } else {
    btn({ x: W / 2 - 160, y: H * 0.755, w: 320, h: 78, label: '🔁 PLAY AGAIN', bg: '#8e44e8',
          onTap: () => startRun(G.coop) });
    btn({ id: 'overmenu', x: W / 2 - 100, y: H * 0.755 + 92, w: 200, h: 52, label: '🏠 MENU', bg: '#6b5b8f', font: '700 26px system-ui,sans-serif',
          onTap: leaveRun });
  }
}

/* ============================================================
   LOOP
   ============================================================ */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 16.667;
  last = now;
  if (dt > 3) dt = 3;      // tab was backgrounded — don't teleport everything

  if (G.freeze > 0) G.freeze -= dt;   // hit-stop: hold the frame, keep drawing
  else update(dt);

  buttons.length = 0;
  ctx.save();
  if (G.shake > 0.4) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  drawBackground();
  if (G.screen === 'play' || G.screen === 'paused' || G.screen === 'over' || G.screen === 'help') drawEntities();
  ctx.restore();

  if (G.screen === 'title') drawTitle();
  else if (G.screen === 'select') drawSelect();
  else if (G.screen === 'play') drawHUD();
  else if (G.screen === 'paused') { drawHUD(); drawPaused(); }
  else if (G.screen === 'over') drawOver();
  else if (G.screen === 'help') drawHelp();
  else if (G.screen === 'levels') drawLevels();

  requestAnimationFrame(frame);
}

/* ============================================================
   MULTIPLAYER SEAM  (see README)
   Everything above already treats G.players as a list, and each
   player's motion comes from {tx,ty} + a power tap. That is the
   whole network payload for a future online mode:
     -> send   {slot, tx, ty, firedPower}
     -> apply  onto the matching player each tick
   Local co-op (two fingers, one tablet) uses exactly that path.
   ============================================================ */
const Net = {
  enabled: false,
  applyRemoteInput(slot, tx, ty, firedPower) {
    const p = G.players[slot]; if (!p) return;
    p.tx = tx; p.ty = ty;
    if (firedPower) firePower(p);
  },
  localInputSnapshot() {
    return G.players.map(p => ({ slot: p.slot, tx: p.tx, ty: p.ty }));
  }
};
window.LotlNet = Net;
// Tuning/debug hook: poke at the live game from the console, e.g.
//   LotlGame.stageTimer = 99999   -> summon the boss right now
//   LotlGame.players[0].power = 100
window.LotlGame = G;
window.LotlKeys = keys;   // handy when a key appears stuck

resize();
requestAnimationFrame(frame);
</script>
