<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6e7ff">
<title>Lotl Quest</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🦎</text></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1b1030;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;}
  #game{display:block;width:100%;height:100%;touch-action:none;}
  #rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;
    background:#f6e7ff;color:#4a2d6b;font:700 24px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;z-index:9}
  @media (orientation:portrait) and (max-width:900px){ #rotate{display:grid} }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">🔄<br>Turn your tablet sideways<br>to play Lotl Quest!</div>
<script>
"use strict";
/* ============================================================
   LOTL QUEST  —  first draft
   Art direction + characters by the 8-year-old boss.
   Single file, no dependencies. Runs from file:// or any host.
   ============================================================ */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha: false });

/* ---------- world / viewport ---------- */
const H = 720;                 // logical height, always
let W = 1280;                  // logical width, from aspect
let scale = 1, offX = 0, offY = 0;

function resize() {
  const cw = window.innerWidth, ch = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(880, Math.min(1700, Math.round(H * (cw / ch))));
  cvs.width = Math.round(cw * dpr);
  cvs.height = Math.round(ch * dpr);
  cvs.style.width = cw + 'px';
  cvs.style.height = ch + 'px';
  scale = Math.min(cw / W, ch / H);
  offX = (cw - W * scale) / 2;
  offY = (ch - H * scale) / 2;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

const toWorld = (cx, cy) => ({ x: (cx - offX) / scale, y: (cy - offY) / scale });

/* ---------- tiny helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const TAU = Math.PI * 2;

/* ---------- save data ---------- */
const SAVE_KEY = 'lotlquest.save.v1';
let save = { best: 0, orbsAll: 0, plays: 0, mute: false, bestStage: 1, seen: [] };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

/* ---------- sound (tiny WebAudio blips) ---------- */
const Snd = {
  ac: null,
  boot() { if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
           if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  blip(freq, dur, type, vol) {
    if (save.mute || !this.ac) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol == null ? 0.16 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  slide(f1, f2, dur, type, vol) {
    if (save.mute || !this.ac) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
    g.gain.setValueAtTime(vol == null ? 0.18 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  orb(combo) {
    // pitch climbs with the chain — the whole point of chaining
    const step = Math.min(combo || 0, 24);
    this.blip(560 * Math.pow(1.055, step), 0.09, 'sine', 0.10);
  },
  combo(n) { this.blip(300 + n * 12, 0.16, 'triangle', 0.12); },
  shoot() { this.blip(rnd(300, 340), 0.06, 'square', 0.04); },
  pop()   { this.slide(360, 90, 0.16, 'sawtooth', 0.10); },
  hurt()  { this.slide(220, 60, 0.35, 'sawtooth', 0.18); },
  power() { this.slide(200, 1200, 0.45, 'triangle', 0.20); },
  heal()  { this.slide(500, 1000, 0.30, 'sine', 0.16); },
  boss()  { this.slide(120, 55, 0.9, 'sawtooth', 0.22); },
  win()   { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.blip(f, 0.22, 'triangle', 0.16), i * 110)); },
  ui()    { this.blip(700, 0.07, 'triangle', 0.10); }
};

/* ============================================================
   CHARACTERS — straight off the drawn cards
   ============================================================ */
const LOTLS = [
  { id: 'mochi', name: 'Mochi', body: '#fff3f5', fin: '#ff4d4d', gill: '#ff2d55', trail: '#ffb3c1',
    blurb: 'Squishy + kind. Heals the team.',
    powerName: 'MOCHI BOUNCE', powerIcon: '💗',
    tip: "Restores everyone's health and blasts nearby danger away." },
  { id: 'coal', name: 'Coal', body: '#5f5f6d', fin: '#141419', gill: '#26262e',
    eye: '#f6f4ff', shot: '#b98cff',
    trail: '#c9a6ff', blurb: 'Cool and clever. Bubble machine.',
    powerName: 'BUBBLE STORM', powerIcon: '🫧',
    tip: 'Fires bubbles in every direction at once.' },
  { id: 'matcha', name: 'Matcha', body: '#c8f08a', fin: '#3faa3f', gill: '#1f7a1f', trail: '#9be36b',
    blurb: 'Fast and brave. Vine puncher.',
    powerName: 'VINE BEAM', powerIcon: '🌿',
    tip: 'A giant green beam in the direction you face.',
    unlock: { kind: 'orbs', n: 75, label: 'Collect 75 orbs' } },
  { id: 'storm', name: 'Storm', body: '#2a2a3a', fin: '#5b5bff', gill: '#9b7bff', trail: '#8f8fff',
    blurb: 'Mysterious. Made of thunder.',
    powerName: 'THUNDER', powerIcon: '⚡',
    tip: 'Lightning zaps every nearby enemy.',
    unlock: { kind: 'stage', n: 2, label: 'Reach stage 2' } },
  // the last four are earned by playing — a ladder that alternates orbs and stages
  { id: 'blaze', name: 'Blaze', body: '#ffe14d', fin: '#ff8a1f', gill: '#ff5e00', trail: '#ffc46b',
    blurb: 'Loud, hot, always first into the fight.',
    powerName: 'FIRE BLAST', powerIcon: '🔥',
    tip: 'A huge spray of fireballs in the direction you face.',
    unlock: { kind: 'orbs', n: 300, label: 'Collect 300 orbs' } },
  { id: 'splash', name: 'Splash', body: '#8fd4ff', fin: '#ffe14d', gill: '#2f8fd6', trail: '#bfe9ff',
    blurb: 'Makes the whole sea come to you.',
    powerName: 'WHIRLPOOL', powerIcon: '🌀',
    tip: 'Sucks every nearby orb right into you.',
    unlock: { kind: 'stage', n: 4, label: 'Reach stage 4' } }
];

// bullets and bursts use `shot` when the fin is too dark to see in the water
const shotColor = l => l.shot || l.fin;

const isUnlocked = l => !l.unlock ||
  (l.unlock.kind === 'orbs' ? save.orbsAll >= l.unlock.n : save.bestStage >= l.unlock.n);
const unlockProgress = l => l.unlock
  ? clamp((l.unlock.kind === 'orbs' ? save.orbsAll : save.bestStage) / l.unlock.n, 0, 1) : 1;
const unlockNow = l => l.unlock
  ? (l.unlock.kind === 'orbs' ? save.orbsAll : save.bestStage) : 0;

/* ============================================================
   GAME STATE
   ============================================================ */
const G = {
  screen: 'title',     // title | select | play | paused | over
  t: 0,                // frames
  players: [],         // supports N — multiplayer-ready
  bullets: [], ebullets: [], orbs: [], foes: [], fx: [], pickups: [],
  boss: null,
  stage: 1,
  stageTimer: 0,
  score: 0, orbCount: 0,
  combo: 0, comboTimer: 0, bestCombo: 0,
  freeze: 0, rushT: 0,
  tick: 0,
  shake: 0,
  coop: false,
  training: false,     // practice run: lessons on screen, nobody can be beaten
  coach: null,         // {step, t, base, swum, hits, powers} while training
  bgBubbles: [],
  banner: null,        // {text, sub, t}
  selIndex: 0,
  selP2: 1
};

const STAGE_LEN = 60 * 42;   // ~42s of swimming, then a boss
const PLAYER_MAX_HEALTH = 100;
const HIT_DAMAGE = 34;
const HEAL_AMOUNT = 30;
const AUTO_AIM_TIME = 60 * 7;
const TRAINING_FLOOR = 25;    // in training you can be hurt, never beaten
const TRAINING_REGEN = 0.10;  // HP per frame, so the bar visibly climbs back

// Training lessons. Each one watches a single number and waits for it to climb
// by `need`; `auto` moves things along for the ones you can pass by doing nothing.
const TRAINING_STEPS = [
  { title: 'SWIM WITH ME',
    text: 'Put a finger anywhere and drag — your lotl follows it. Arrow keys work too.',
    need: 1500, got: (p, c) => c.swum },
  { title: 'GRAB THE PURPLE ORBS',
    text: 'Orbs are your points. Swim through them! Grab a few in a row to start a chain.',
    need: 8, got: p => p.orbs },
  { title: 'YOUR TRIDENT FIRES ITSELF',
    text: 'It always shoots forward, to the right. Line the enemies up on your right side.',
    need: 4, got: p => p.kills },
  { title: 'WATCH YOUR HEALTH',
    text: 'Enemies hurt, and the bar up top shows it. In training you always heal back up — try dodging!',
    need: 1, got: (p, c) => c.hits, auto: 60 * 12 },
  { title: 'YOUR BIG POWER',
    text: 'The round button is full. Tap it — or press SPACE — to let your power go!',
    need: 1, got: (p, c) => c.powers, setup: p => { p.power = p.powerMax; } },
  { title: "YOU'RE READY!",
    text: 'Practise as long as you like. In the real game every stage ends with the Magma Lotl boss — beat it and a new world begins.',
    need: Infinity, got: () => 0 }
];

/* ---------- player ---------- */
function makePlayer(lotlIndex, slot) {
  const l = LOTLS[lotlIndex];
  return {
    lotl: l, lotlIndex, slot,
    x: 190 + slot * 90, y: H / 2 + slot * 90,
    tx: 190 + slot * 90, ty: H / 2 + slot * 90,
    vx: 0, vy: 0,
    r: 30, health: PLAYER_MAX_HEALTH, maxHealth: PLAYER_MAX_HEALTH,
    inv: 90, cool: 0, power: 0, powerMax: 100,
    alive: true, downTimer: 0,
    pointerId: null, tail: 0, bob: rnd(0, TAU),
    facing: 1,           // lotls always face — and fire — right
    aimTimer: 0, aimTarget: null,
    kills: 0, orbs: 0
  };
}

function startRun(coop, training) {
  G.coop = !!coop;
  G.training = !!training;
  G.coach = training ? { step: 0, t: 0, base: 0, swum: 0, hits: 0, powers: 0 } : null;
  G.players = [makePlayer(G.selIndex, 0)];
  if (coop) G.players.push(makePlayer(G.selP2, 1));
  G.bullets.length = 0; G.ebullets.length = 0; G.orbs.length = 0;
  G.foes.length = 0; G.fx.length = 0; G.pickups.length = 0;
  G.boss = null; G.stage = 1; G.stageTimer = 0;
  G.score = 0; G.orbCount = 0; G.shake = 0; G.t = 0; G.tick = 0;
  G.combo = 0; G.comboTimer = 0; G.bestCombo = 0; G.freeze = 0; G.newUnlocks = [];
  G.screen = 'play';
  if (training) {
    banner('TRAINING', "Nothing can beat you here — take your time!");
    return;                                  // practice runs stay out of the save file
  }
  banner('STAGE 1: ' + stageTheme(1).name, 'Swim! Grab the purple orbs!');
  save.plays++; persist();
}

function coachStep() { return G.coach ? TRAINING_STEPS[G.coach.step] : null; }

// Advance the lesson as soon as its number has moved far enough.
function updateCoach(dt) {
  const c = G.coach, p = G.players[0];
  if (!c || !p) return;
  c.t += dt;
  c.swum += Math.hypot(p.vx, p.vy) * dt;
  if (c.step >= TRAINING_STEPS.length - 1) return;   // the last card is the finish line
  if (c.t < 130) return;                             // leave every card up long enough to read
  const step = TRAINING_STEPS[c.step];
  if (step.got(p, c) - c.base < step.need && !(step.auto && c.t > step.auto)) return;

  c.step++; c.t = 0;
  const next = TRAINING_STEPS[c.step];
  c.base = next.got(p, c);
  if (next.setup) for (const pl of G.players) next.setup(pl);
  Snd.win();
  floatText(p.x, p.y - 80, 'Nice!', '#ffd166');
  ring(p.x, p.y, '#ffd166', 170);
}

const banner = (text, sub) => { G.banner = { text, sub: sub || '', t: 0 }; };

/* ============================================================
   INPUT — pointers drive players (slot 0, then slot 1 in co-op)
   ============================================================ */
const buttons = [];   // rebuilt every frame by the UI drawing code, so never compare
const heldIds = new Set();   // button objects across frames — compare their ids
const pointers = new Map();

function hitButton(wx, wy) {
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (b.shape === 'circle') { if (dist2(wx, wy, b.x, b.y) <= b.r * b.r) return b; }
    else if (wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h) return b;
  }
  return null;
}

function claimPlayer(pid, wx, wy) {
  if (G.screen !== 'play') return null;
  // already-claimed check
  for (const p of G.players) if (p.pointerId === pid) return p;
  // co-op: nearest free player wins the finger; solo: player 0 always
  let best = null, bd = Infinity;
  for (const p of G.players) {
    if (p.pointerId !== null) continue;
    const d = dist2(wx, wy, p.x, p.y);
    if (d < bd) { bd = d; best = p; }
  }
  if (best) { best.pointerId = pid; best.tx = wx; best.ty = wy; best.kbIdle = true; }
  return best;
}

function onDown(pid, cx, cy) {
  Snd.boot();
  const w = toWorld(cx, cy);
  const b = hitButton(w.x, w.y);
  if (b) { pointers.set(pid, { btnId: b.id }); heldIds.add(b.id); return; }
  const p = claimPlayer(pid, w.x, w.y);
  pointers.set(pid, { player: p || null, x: w.x, y: w.y });
}

function onMove(pid, cx, cy) {
  const rec = pointers.get(pid);
  if (!rec) return;
  const w = toWorld(cx, cy);
  if (rec.btnId) return;
  if (rec.player) { rec.player.tx = w.x; rec.player.ty = w.y; }
  rec.x = w.x; rec.y = w.y;
}

function onUp(pid, cx, cy) {
  const rec = pointers.get(pid);
  pointers.delete(pid);
  if (!rec) return;
  if (rec.btnId) {
    heldIds.delete(rec.btnId);
    const w = toWorld(cx, cy);
    const b = hitButton(w.x, w.y);
    // same id => the finger came up on the button it went down on
    if (b && b.id === rec.btnId && b.onTap) { Snd.ui(); b.onTap(); }
    return;
  }
  if (rec.player) rec.player.pointerId = null;
}

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cvs.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety, not a requirement */ }
  onDown(e.pointerId, e.clientX, e.clientY);
});
cvs.addEventListener('pointermove', e => { e.preventDefault(); onMove(e.pointerId, e.clientX, e.clientY); });
cvs.addEventListener('pointerup', e => { e.preventDefault(); onUp(e.pointerId, e.clientX, e.clientY); });
cvs.addEventListener('pointercancel', e => {
  const rec = pointers.get(e.pointerId);
  if (rec && rec.btnId) heldIds.delete(rec.btnId);
  onUp(e.pointerId, -9999, -9999);       // cancelled: release, never fire the tap
});
cvs.addEventListener('contextmenu', e => e.preventDefault());

/* keyboard, for grown-ups testing on a laptop */
const keys = new Set();
// move the highlight along the roster, skipping the ones still locked
function navSelect(dir) {
  const n = LOTLS.length;
  const cur = (G.coop && G.pickingP2) ? G.selP2 : G.selIndex;
  for (let step = 1; step <= n; step++) {
    const i = (cur + dir * step + n * step) % n;
    if (!isUnlocked(LOTLS[i])) continue;
    if (G.coop && G.pickingP2) G.selP2 = i; else G.selIndex = i;
    Snd.ui();
    return;
  }
}

window.addEventListener('keydown', e => {
  Snd.boot();
  const k = e.key.toLowerCase();
  keys.add(k);
  const enter = (k === 'enter' || k === ' ');
  const left = (k === 'arrowleft' || k === 'a');
  const right = (k === 'arrowright' || k === 'd');

  if (G.screen === 'title') {
    if (enter) { G.screen = 'select'; Snd.ui(); e.preventDefault(); }
    else if (k === 'h' || k === '?' || k === '/') { G.helpFrom = 'title'; G.screen = 'help'; Snd.ui(); }
    else if (k === 'm') { save.mute = !save.mute; persist(); }
  } else if (G.screen === 'select') {
    if (left) { navSelect(-1); e.preventDefault(); }
    else if (right) { navSelect(1); e.preventDefault(); }
    else if (k === '2') {                       // toggle two-player mode
      G.coop = !G.coop; G.pickingP2 = G.coop;
      if (G.coop && (G.selP2 === G.selIndex || !isUnlocked(LOTLS[G.selP2]))) {
        const other = LOTLS.findIndex((l, i) => i !== G.selIndex && isUnlocked(l));
        G.selP2 = other < 0 ? G.selIndex : other;
      }
      Snd.ui();
    }
    else if (k === '1') { G.coop = false; G.pickingP2 = false; Snd.ui(); }
    else if (enter) { G.pickingP2 = false; startRun(G.coop); e.preventDefault(); }
    else if (k === 't') { G.pickingP2 = false; startRun(G.coop, true); }
    else if (k === 'h' || k === '?' || k === '/') { G.helpFrom = 'select'; G.screen = 'help'; }
    else if (k === 'escape') { G.coop = false; G.pickingP2 = false; G.screen = 'title'; }
  } else if (G.screen === 'play') {
    if (enter) { firePower(G.players[0]); e.preventDefault(); }
    else if (k === 'q' || k === 'shift' || k === 'tab') {   // player 2's power, near WASD
      if (G.players[1]) firePower(G.players[1]);
      e.preventDefault();
    }
    else if (k === 'escape' || k === 'p') G.screen = 'paused';
    else if (k === 'h' || k === '?' || k === '/') { G.helpFrom = 'play'; G.screen = 'help'; }
  } else if (G.screen === 'paused') {
    if (enter || k === 'escape' || k === 'p') { G.screen = 'play'; e.preventDefault(); }
    else if (k === 'h' || k === '?' || k === '/') { G.helpFrom = 'paused'; G.screen = 'help'; }
    else if (k === 'm') { save.mute = !save.mute; persist(); }
  } else if (G.screen === 'over') {
    if (enter) { startRun(G.coop); e.preventDefault(); }
    else if (k === 'escape') { G.screen = 'title'; G.coop = false; }
  } else if (G.screen === 'help') {
    if (enter || k === 'escape' || k === 'h' || k === '?' || k === '/') {
      G.screen = G.helpFrom || 'title';
      e.preventDefault();
    }
  }
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

const KB_SPEED = 6.2;   // world px per frame (~370/sec) — steady, not a slingshot

function keyboardDrive(p, dt) {
  // solo: both key sets drive you. two players on one keyboard: P1 = arrows, P2 = WASD.
  const shared = G.players.length < 2;
  const arrows = shared || p.slot === 0;
  const wasd   = shared || p.slot === 1;
  let dx = 0, dy = 0;
  if (arrows) {
    if (keys.has('arrowleft')) dx -= 1;
    if (keys.has('arrowright')) dx += 1;
    if (keys.has('arrowup')) dy -= 1;
    if (keys.has('arrowdown')) dy += 1;
  }
  if (wasd) {
    if (keys.has('a')) dx -= 1;
    if (keys.has('d')) dx += 1;
    if (keys.has('w')) dy -= 1;
    if (keys.has('s')) dy += 1;
  }
  if (!dx && !dy) return;
  // walk the target point along at a fixed rate instead of throwing it far ahead,
  // so holding a key glides rather than launching
  const m = Math.hypot(dx, dy) || 1;
  if (p.kbIdle !== false) { p.tx = p.x; p.ty = p.y; p.kbIdle = false; }
  p.tx = clamp(p.tx + (dx / m) * KB_SPEED * dt, 40, W - 40);
  p.ty = clamp(p.ty + (dy / m) * KB_SPEED * dt, 46, H - 120);
}

/* ============================================================
   SPAWNING
   ============================================================ */
const FOE_KINDS = {
  blob:   { hp: 2, r: 30, speed: 2.2, score: 20, color: '#ff5a36', dark: '#c1290b' },
  spiker: { hp: 3, r: 28, speed: 3.4, score: 35, color: '#7b3fd6', dark: '#3d1a70' },
  puffer: { hp: 4, r: 36, speed: 1.5, score: 45, color: '#4a4a5c', dark: '#22222e' }
};

function spawnFoe(kind, y) {
  const k = FOE_KINDS[kind];
  const lvl = 1 + (G.stage - 1) * 0.16;
  G.foes.push({
    kind, x: W + 60, y: y == null ? rnd(90, H - 190) : y,
    r: k.r, hp: Math.round(k.hp * lvl), maxHp: Math.round(k.hp * lvl),
    speed: k.speed * (1 + (G.stage - 1) * 0.05),
    phase: rnd(0, TAU), amp: rnd(20, 70), t: 0, fireAt: rnd(60, 140), flash: 0, baseY: 0
  });
}

function spawnOrb(x, y, vx, vy) {
  G.orbs.push({ x, y, vx: vx == null ? -2.2 : vx, vy: vy || 0, r: 15, phase: rnd(0, TAU), t: 0 });
}

function spawnPickup(x, y, type) {
  G.pickups.push({ x, y, type, r: 20, phase: rnd(0, TAU), t: 0 });
}

function director() {
  const s = G.stage;
  const t = G.tick;
  if (G.boss) return;
  // training introduces one thing at a time — nothing arrives before its lesson
  const lesson = G.coach ? G.coach.step : 99;

  // orb ribbons — the main "yum" of the game
  if (lesson >= 1 && t % 44 === 0) {
    const y0 = rnd(120, H - 220);
    const n = 5 + ((Math.random() * 4) | 0);
    const wave = rnd(-1, 1) * 40;
    for (let i = 0; i < n; i++) {
      setTimeout(() => { if (G.screen === 'play') spawnOrb(W + 30, clamp(y0 + Math.sin(i * 0.7) * wave, 80, H - 190)); }, i * 90);
    }
  }
  // foes
  const rate = Math.max(34, 96 - s * 7);
  if (lesson >= 2 && t > 90 && t % rate === 0) {
    const roll = Math.random();
    if (s >= 3 && roll > 0.82) spawnFoe('puffer');
    else if (s >= 2 && roll > 0.55) spawnFoe('spiker');
    else spawnFoe('blob');
  }
  // occasional health refill and temporary auto-aim power-up
  if (lesson >= 3 && t % 900 === 400) spawnPickup(W + 30, rnd(120, H - 220), 'heart');
  if (lesson >= 3 && t > 180 && t % 1250 === 700) spawnPickup(W + 30, rnd(120, H - 220), 'target');

  // ORB RUSH — a big shimmering river of orbs to chain through
  if (lesson >= 5 && t > 300 && t % 1150 === 0) {
    banner('ORB RUSH!', 'Chain them all!');
    Snd.win();
    const y0 = rnd(200, H - 260), amp = rnd(70, 140);
    for (let i = 0; i < 42; i++) {
      setTimeout(() => {
        if (G.screen === 'play') spawnOrb(W + 30, clamp(y0 + Math.sin(i * 0.42) * amp, 80, H - 180), -3.0);
      }, i * 55);
    }
  }
}

/* ============================================================
   BOSS — the big one from the red sea
   ============================================================ */
function spawnBoss() {
  const hp = 60 + (G.stage - 1) * 28;
  G.boss = {
    x: W + 220, y: H / 2 - 40, r: 92, hp, maxHp: hp,
    t: 0, phase: 0, mode: 'enter', flash: 0, atk: 0, angry: false
  };
  banner('BOSS!', 'The Magma Lotl!');
  Snd.boss();
  G.shake = 22;
}

function updateBoss(dt) {
  const b = G.boss; if (!b) return;
  b.t += dt; b.flash = Math.max(0, b.flash - dt);
  if (b.mode === 'enter') {
    b.x += (W - 270 - b.x) * 0.03 * dt;   // ease past the threshold, not exactly onto it
    if (b.x < W - 240) b.mode = 'fight';
  } else if (b.mode === 'fight') {
    b.y = H / 2 - 40 + Math.sin(b.t * 0.017) * (H * 0.26);
    b.x = W - 230 + Math.sin(b.t * 0.009) * 60;
    b.atk += dt;
    const fast = b.hp < b.maxHp * 0.4;
    if (fast && !b.angry) { b.angry = true; banner('IT IS ANGRY!', 'Keep swimming!'); }
    const every = fast ? 34 : 56;
    if (b.atk >= every) {
      b.atk = 0;
      const target = livingPlayers()[0];
      // How far to lean off straight-left (PI) to point at the player. atan2 returns
      // near -PI above the boss and near +PI below it, so the raw difference is a
      // whole turn out on one side — wrap it, or half the volleys fly backwards.
      let lead = target ? Math.atan2(target.y - b.y, target.x - b.x) - Math.PI : 0;
      lead = Math.atan2(Math.sin(lead), Math.cos(lead));
      const spread = fast ? 5 : 3;
      for (let i = 0; i < spread; i++) {
        const ang = Math.PI + lead * 0.55 + (i - (spread - 1) / 2) * 0.22;
        G.ebullets.push({ x: b.x - 60, y: b.y + 10, vx: Math.cos(ang) * 5.2, vy: Math.sin(ang) * 5.2, r: 14, kind: 'fire' });
      }
      Snd.blip(160, 0.12, 'sawtooth', 0.08);
    }
    if (b.t % 150 < dt) spawnFoe('blob', clamp(b.y + rnd(-90, 90), 80, H - 200));
  } else if (b.mode === 'dying') {
    b.x += 1.2 * dt; b.y += 0.6 * dt;
    if (b.t % 6 < dt) { boom(b.x + rnd(-70, 70), b.y + rnd(-70, 70), '#ff7a3d', 14); Snd.pop(); }
    if (b.deadT == null) b.deadT = 0;
    b.deadT += dt;
    if (b.deadT > 90) {
      for (let i = 0; i < 24; i++) spawnOrb(b.x + rnd(-60, 60), b.y + rnd(-60, 60), rnd(-4, -1), rnd(-2, 2));
      G.boss = null; G.stage++; G.stageTimer = 0;
      G.score += 500;
      banner('STAGE ' + G.stage + ': ' + stageTheme().name, 'You beat it! Keep going!');
      Snd.win();
      for (const p of G.players) if (p.alive) p.health = Math.min(p.maxHealth, p.health + HEAL_AMOUNT);
    }
  }
}

/* ============================================================
   FX
   ============================================================ */
function boom(x, y, color, n) {
  for (let i = 0; i < (n || 10); i++) {
    const a = rnd(0, TAU), s = rnd(1.5, 6);
    G.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rnd(3, 9), life: rnd(18, 38), t: 0, color, kind: 'dot' });
  }
}
function ring(x, y, color, max) {
  G.fx.push({ x, y, r: 10, max: max || 260, life: 30, t: 0, color, kind: 'ring' });
}
function floatText(x, y, text, color) {
  G.fx.push({ x, y, text, color, life: 46, t: 0, kind: 'text' });
}

/* ============================================================
   POWERS
   ============================================================ */
const POWER_RANGE = 460;

function inPowerRange(p, target, range) {
  return !!target && dist2(p.x, p.y, target.x, target.y) <= (range || POWER_RANGE) ** 2;
}

function firePower(p) {
  if (!p || !p.alive || p.power < p.powerMax) return;
  if (G.coach) G.coach.powers++;
  p.power = 0;
  Snd.power();
  G.shake = 14;
  const id = p.lotl.id;

  if (id === 'mochi') {
    let healed = false;
    for (const teammate of G.players) {
      if (!teammate.alive || teammate.health >= teammate.maxHealth) continue;
      teammate.health = Math.min(teammate.maxHealth, teammate.health + HEAL_AMOUNT);
      healed = true;
      floatText(teammate.x, teammate.y - 60, '+' + HEAL_AMOUNT + ' HP', '#ff4d6d');
    }
    if (healed) Snd.heal();
    ring(p.x, p.y, '#ff9ec4', 520);
    G.ebullets = G.ebullets.filter(b => !inPowerRange(p, b));
    for (const f of G.foes) if (inPowerRange(p, f)) hurtFoe(f, 4, p);
  } else if (id === 'coal') {
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * TAU;
      G.bullets.push({ x: p.x, y: p.y, startX: p.x, startY: p.y, maxDist: POWER_RANGE,
        vx: Math.cos(a) * 9, vy: Math.sin(a) * 9, r: 12, dmg: 2, owner: p, kind: 'bubble', life: 120 });
    }
    ring(p.x, p.y, '#c9a6ff', 300);
  } else if (id === 'matcha') {
    G.fx.push({ x: p.x, y: p.y, dir: p.facing, max: POWER_RANGE, kind: 'beam', life: 40, t: 0, color: '#8ef06a' });
    for (const f of G.foes) {
      const ahead = (f.x - p.x) * p.facing > 0;
      if (ahead && Math.abs(f.y - p.y) < 90 && inPowerRange(p, f)) hurtFoe(f, 10, p);
    }
    if (G.boss && (G.boss.x - p.x) * p.facing > 0 && Math.abs(G.boss.y - p.y) < 150 && inPowerRange(p, G.boss)) hurtBoss(14, p);
    ring(p.x, p.y, '#9be36b', 220);
  } else if (id === 'blaze') {
    for (let i = 0; i < 16; i++) {
      const a = (p.facing < 0 ? Math.PI : 0) + (i - 7.5) * 0.075;
      G.bullets.push({ x: p.x, y: p.y, startX: p.x, startY: p.y, maxDist: POWER_RANGE,
        vx: Math.cos(a) * 13, vy: Math.sin(a) * 13,
        r: 15, dmg: 3, owner: p, kind: 'bubble', life: 110 });
    }
    ring(p.x, p.y, '#ff8a1f', 260);
    G.shake = 18;
  } else if (id === 'splash') {
    // nearby orbs come to you — save it for the densest part of an Orb Rush
    let n = 0;
    for (const o of G.orbs) {
      if (!inPowerRange(p, o)) continue;
      o.vx = (p.x - o.x) * 0.09; o.vy = (p.y - o.y) * 0.09;   // yanked in, collected on arrival
      n++;
    }
    for (const f of G.foes) if (inPowerRange(p, f)) hurtFoe(f, 3, p);
    ring(p.x, p.y, '#8fd4ff', POWER_RANGE);
    floatText(p.x, p.y - 70, n + ' orbs!', '#2f8fd6');
  } else if (id === 'storm') {
    for (const f of G.foes) if (inPowerRange(p, f)) {
      G.fx.push({ x: f.x, y: f.y, kind: 'bolt', life: 22, t: 0, color: '#a9a9ff' });
      hurtFoe(f, 8, p);
    }
    if (G.boss && inPowerRange(p, G.boss)) {
      hurtBoss(12, p);
      G.fx.push({ x: G.boss.x, y: G.boss.y, kind: 'bolt', life: 26, t: 0, color: '#a9a9ff' });
    }
    ring(p.x, p.y, '#8f8fff', 460);
    G.shake = 20;
  }
}

/* ============================================================
   DAMAGE
   ============================================================ */
function hurtFoe(f, dmg, by) {
  if (f.dead) return false;              // already gone this frame — don't pay out twice
  f.hp -= dmg; f.flash = 8;
  if (f.hp <= 0) {
    f.dead = true;                       // the foes loop sweeps it up
    const k = FOE_KINDS[f.kind];
    boom(f.x, f.y, k.color, 14);
    G.score += k.score * comboMult();
    if (by) { by.kills++; addPower(by, 6); }
    if (Math.random() < 0.55) spawnOrb(f.x, f.y, rnd(-3, -0.5), rnd(-1.5, 1.5));
    Snd.pop();
    return true;
  }
  return false;
}

function hurtBoss(dmg, by) {
  const b = G.boss; if (!b || b.mode === 'dying') return;
  b.hp -= dmg; b.flash = 6;
  if (by) addPower(by, 2);
  if (b.hp <= 0) { b.mode = 'dying'; b.t = 0; G.shake = 26; G.freeze = 14; Snd.boss(); }
}

function addPower(p, n) { p.power = Math.min(p.powerMax, p.power + n); }

/* The chain: keep grabbing orbs without a gap and every orb is worth more,
   the pitch climbs, and the screen gets louder about it. */
const comboMult = () => 1 + Math.floor(G.combo / 8);

function collectOrb(p, x, y) {
  G.combo++;
  G.comboTimer = 105;
  if (G.combo > G.bestCombo) G.bestCombo = G.combo;
  const mult = comboMult();
  G.score += 10 * mult;
  G.orbCount++; p.orbs++;
  addPower(p, 4);
  Snd.orb(G.combo);
  G.fx.push({ x, y, kind: 'spark', life: 16, t: 0, color: mult > 1 ? '#ffd166' : '#c9a6ff' });
  if (G.combo % 8 === 0) {                       // every new multiplier step is an event
    Snd.combo(G.combo);
    floatText(p.x, p.y - 70, 'x' + comboMult() + '!', '#ffd166');
    ring(p.x, p.y, '#ffd166', 160);
    G.shake = Math.max(G.shake, 6);
  }
}

function hurtPlayer(p) {
  if (p.inv > 0 || !p.alive) return;
  if (G.coach) G.coach.hits++;
  p.health = Math.max(G.training ? TRAINING_FLOOR : 0, p.health - HIT_DAMAGE);
  p.inv = 110;
  G.shake = 16;
  G.freeze = 7;          // hit-stop: the moment lands harder
  G.combo = 0; G.comboTimer = 0;
  Snd.hurt();
  boom(p.x, p.y, shotColor(p.lotl), 16);
  if (p.health <= 0) {
    p.alive = false; p.downTimer = 0; p.pointerId = null;
    boom(p.x, p.y, '#ffffff', 24);
    if (livingPlayers().length === 0) gameOver();
    else floatText(p.x, p.y - 50, 'Help!', '#ffffff');
  }
}

const livingPlayers = () => G.players.filter(p => p.alive);

function findAutoTarget(p) {
  let target = null, best = Infinity;
  for (const f of G.foes) {
    if (f.dead) continue;
    const d = dist2(p.x, p.y, f.x, f.y);
    if (d < best) { best = d; target = f; }
  }
  if (G.boss && G.boss.mode === 'fight') {
    const d = dist2(p.x, p.y, G.boss.x, G.boss.y);
    if (d < best) target = G.boss;
  }
  return target;
}

function gameOver() {
  G.screen = 'over';
  if (G.score > save.best) { save.best = G.score; }
  if (G.stage > (save.bestStage || 1)) save.bestStage = G.stage;
  save.orbsAll += G.orbCount;
  // anything that just crossed its unlock line, and hasn't been celebrated yet
  if (!save.seen) save.seen = [];
  G.newUnlocks = LOTLS.filter(l => l.unlock && isUnlocked(l) && save.seen.indexOf(l.id) < 0);
  for (const l of G.newUnlocks) save.seen.push(l.id);
  persist();
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt) {
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 0.8);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > 130) G.banner = null; }

  // background bubbles everywhere, always
  if (G.bgBubbles.length < 40) {
    G.bgBubbles.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(4, 16), s: rnd(0.3, 1.1), a: rnd(0.08, 0.3), ph: rnd(0, TAU) });
  }
  for (const b of G.bgBubbles) {
    b.y -= b.s * dt; b.x += Math.sin((G.t + b.ph) * 0.02) * 0.3 * dt;
    if (b.y < -20) { b.y = H + 20; b.x = rnd(0, W); }
  }

  if (G.screen !== 'play') return;

  G.tick++;
  if (!G.training) G.stageTimer += dt;   // no stage clock in training, so no boss

  // combo only survives if you keep the chain going
  if (G.combo > 0) {
    G.comboTimer -= dt;
    if (G.comboTimer <= 0) { G.combo = 0; G.comboTimer = 0; }
  }
  if (!G.boss && G.stageTimer > STAGE_LEN) spawnBoss();
  director();
  updateBoss(dt);

  /* players */
  for (const p of G.players) {
    if (!p.alive) {
      // co-op revive: a downed lotl floats back after a bit
      if (G.players.length > 1) {
        p.downTimer += dt;
        if (p.downTimer > 60 * 8) { p.alive = true; p.health = 35; p.inv = 140; p.x = 150; p.y = H / 2; p.tx = p.x; p.ty = p.y; floatText(p.x, p.y - 60, "I'm back!", '#fff'); }
      }
      continue;
    }
    keyboardDrive(p, dt);
    if (G.training) p.health = Math.min(p.maxHealth, p.health + TRAINING_REGEN * dt);
    p.inv = Math.max(0, p.inv - dt);
    p.bob += 0.06 * dt;

    // swim toward the finger
    const ease = 0.16;
    p.vx = (p.tx - p.x) * ease;
    p.vy = (p.ty - p.y) * ease;
    const sp = Math.hypot(p.vx, p.vy), MAX = 15;
    if (sp > MAX) { p.vx = p.vx / sp * MAX; p.vy = p.vy / sp * MAX; }
    p.x = clamp(p.x + p.vx * dt, 40, W - 40);
    p.y = clamp(p.y + p.vy * dt, 46, H - 120);
    p.tail = sp;
    p.aimTimer = Math.max(0, p.aimTimer - dt);
    p.aimTarget = p.aimTimer > 0 ? findAutoTarget(p) : null;

    // Shots always go forward — one rule small hands can hold on to.
    // The target pickup is the only thing that ever aims for you.
    p.cool -= dt;
    if (p.cool <= 0) {
      p.cool = 15;
      const c = p.lotl;
      let dx = 1, dy = 0;
      if (p.aimTarget) {
        dx = p.aimTarget.x - p.x;
        dy = p.aimTarget.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        dx /= d; dy /= d;
      }
      G.bullets.push({ x: p.x + dx * 34, y: p.y + dy * 34, vx: dx * 15, vy: dy * 15,
        r: 10, dmg: 1, owner: p, kind: 'trident', life: 140, color: shotColor(c) });
      Snd.shoot();
    }

    // orbs / pickups
    for (let i = G.orbs.length - 1; i >= 0; i--) {
      const o = G.orbs[i];
      if (dist2(o.x, o.y, p.x, p.y) < (o.r + p.r + 14) ** 2) {
        G.orbs.splice(i, 1);
        collectOrb(p, o.x, o.y);
      }
    }
    for (let i = G.pickups.length - 1; i >= 0; i--) {
      const k = G.pickups[i];
      if (dist2(k.x, k.y, p.x, p.y) < (k.r + p.r + 10) ** 2) {
        G.pickups.splice(i, 1);
        if (k.type === 'heart') {
          if (p.health < p.maxHealth) {
            p.health = Math.min(p.maxHealth, p.health + HEAL_AMOUNT);
            floatText(p.x, p.y - 60, '+' + HEAL_AMOUNT + ' HP', '#ff4d6d');
          }
          else { G.score += 100; floatText(p.x, p.y - 60, '+100', '#ffd166'); }
          Snd.heal();
        } else if (k.type === 'target') {
          p.aimTimer = AUTO_AIM_TIME;
          floatText(p.x, p.y - 60, 'AUTO-AIM!', '#3aa0ff');
          ring(p.x, p.y, '#3aa0ff', 150);
          Snd.power();
        }
      }
    }

    // touching a foe
    for (const f of G.foes) {
      if (f.dead) continue;
      if (dist2(f.x, f.y, p.x, p.y) < (f.r + p.r - 8) ** 2) { hurtPlayer(p); hurtFoe(f, 2, p); }
    }
    if (G.boss && G.boss.mode === 'fight' && dist2(G.boss.x, G.boss.y, p.x, p.y) < (G.boss.r + p.r - 20) ** 2) hurtPlayer(p);
  }

  // the hit that ended the run also ends this tick — nothing should score after it
  if (G.screen !== 'play') return;

  /* magnet: orbs drift toward the nearest lotl */
  for (const o of G.orbs) {
    let best = null, bd = 190 * 190;
    for (const p of G.players) {
      if (!p.alive) continue;
      const d = dist2(o.x, o.y, p.x, p.y);
      if (d < bd) { bd = d; best = p; }
    }
    if (best) {
      const d = Math.sqrt(bd) || 1;
      o.vx += ((best.x - o.x) / d) * 0.55 * dt;
      o.vy += ((best.y - o.y) / d) * 0.55 * dt;
    }
  }

  /* bullets */
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let gone = b.life <= 0 || b.x > W + 60 || b.x < -60 || b.y < -60 || b.y > H + 60;
    if (!gone && b.maxDist && dist2(b.x, b.y, b.startX, b.startY) > b.maxDist ** 2) gone = true;
    if (!gone) {
      for (const f of G.foes) {
        if (f.dead) continue;
        if (dist2(b.x, b.y, f.x, f.y) < (b.r + f.r) ** 2) { hurtFoe(f, b.dmg, b.owner); gone = true; break; }
      }
    }
    if (!gone && G.boss && G.boss.mode === 'fight' && dist2(b.x, b.y, G.boss.x, G.boss.y) < (b.r + G.boss.r * 0.8) ** 2) {
      hurtBoss(b.dmg, b.owner);
      boom(b.x, b.y, '#ffd166', 3);
      gone = true;
    }
    if (gone) G.bullets.splice(i, 1);
  }

  /* enemy bullets */
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    let gone = b.x < -60 || b.x > W + 90 || b.y < -60 || b.y > H + 60;
    if (!gone) for (const p of G.players) {
      if (p.alive && dist2(b.x, b.y, p.x, p.y) < (b.r + p.r - 6) ** 2) { hurtPlayer(p); gone = true; break; }
    }
    if (gone) G.ebullets.splice(i, 1);
  }

  /* foes */
  for (let i = G.foes.length - 1; i >= 0; i--) {
    const f = G.foes[i];
    f.t += dt; f.flash = Math.max(0, f.flash - dt);
    f.x -= f.speed * dt;
    if (!f.baseY) f.baseY = f.y;
    if (f.kind === 'blob') f.y = f.baseY + Math.sin((f.t + f.phase * 30) * 0.04) * f.amp;
    else if (f.kind === 'spiker') {
      const tgt = livingPlayers()[0];
      if (tgt) f.y += clamp((tgt.y - f.y) * 0.012, -2.2, 2.2) * dt;
    } else if (f.kind === 'puffer') {
      f.y = f.baseY + Math.sin(f.t * 0.02) * 40;
      f.fireAt -= dt;
      if (f.fireAt <= 0 && f.x < W - 40) {
        f.fireAt = 110;
        const tgt = livingPlayers()[0];
        const a = tgt ? Math.atan2(tgt.y - f.y, tgt.x - f.x) : Math.PI;
        G.ebullets.push({ x: f.x - 20, y: f.y, vx: Math.cos(a) * 4.4, vy: Math.sin(a) * 4.4, r: 12, kind: 'ink' });
        Snd.blip(200, 0.08, 'square', 0.05);
      }
    }
    f.y = clamp(f.y, 60, H - 150);
    if (f.dead || f.x < -80) G.foes.splice(i, 1);
  }

  /* orbs move */
  for (let i = G.orbs.length - 1; i >= 0; i--) {
    const o = G.orbs[i];
    o.t += dt;
    o.x += o.vx * dt; o.y += o.vy * dt + Math.sin((o.t + o.phase * 20) * 0.05) * 0.5 * dt;
    o.vx *= 0.995; o.vy *= 0.98;
    if (o.x < -50) G.orbs.splice(i, 1);
  }
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const k = G.pickups[i]; k.t += dt; k.x -= 1.8 * dt;
    k.y += Math.sin((k.t + k.phase * 20) * 0.05) * 0.6 * dt;
    if (k.x < -50) G.pickups.splice(i, 1);
  }

  /* fx */
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const e = G.fx[i]; e.t += dt;
    if (e.kind === 'dot') { e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= 0.94; e.vy = e.vy * 0.94 + 0.12 * dt; }
    if (e.kind === 'text') e.y -= 0.9 * dt;
    if (e.t >= e.life) G.fx.splice(i, 1);
  }

  if (G.training) updateCoach(dt);
}

/* ============================================================
   DRAWING — crayon-ish, on purpose
   ============================================================ */
function wobbleCircle(x, y, r, seed) {
  ctx.beginPath();
  const steps = 18;
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + Math.sin(a * 3 + seed) * 0.035 + Math.sin(a * 5 - seed) * 0.025;
    const px = x + Math.cos(a) * r * w, py = y + Math.sin(a) * r * w;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawLotl(x, y, r, c, opts) {
  const o = opts || {};
  const t = o.t || 0;
  const flip = o.flip ? -1 : 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip, 1);
  if (o.tilt) ctx.rotate(o.tilt);

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const ink = '#20141f';

  // tail
  const wag = Math.sin(t * 0.12) * 0.35;
  ctx.save(); ctx.rotate(wag * 0.25);
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(-r * 0.5, -r * 0.15);
  ctx.quadraticCurveTo(-r * 1.7, -r * 0.9, -r * 2.05, -r * 0.1);
  ctx.quadraticCurveTo(-r * 1.7, r * 0.85, -r * 0.5, r * 0.25);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = r * 0.09; ctx.stroke();
  ctx.restore();

  // gill fronds (the frilly bits — most important part of a lotl)
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      // fronds fan off the top and bottom of the head, like the drawing
      const base = side * (Math.PI / 2) + (i - 1) * 0.46 * side;
      const wig = Math.sin(t * 0.11 + i * 1.3 + (side > 0 ? 1 : 0)) * 0.12;
      const bx = Math.cos(base) * r * 0.7, by = Math.sin(base) * r * 0.7;
      const len = r * (0.9 - Math.abs(i - 1) * 0.12);
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(base + wig);
      ctx.strokeStyle = c.gill; ctx.lineWidth = r * 0.14; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.55, len * 0.22, len, 0); ctx.stroke();
      ctx.fillStyle = c.gill;
      ctx.beginPath(); ctx.arc(len, 0, r * 0.16, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  // legs
  ctx.strokeStyle = ink; ctx.lineWidth = r * 0.11;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(-r * 0.1, s * r * 0.55);
    ctx.lineTo(-r * 0.35, s * r * 0.95 + Math.sin(t * 0.1 + s) * 2);
    ctx.stroke();
  }

  // body
  ctx.fillStyle = c.body;
  wobbleCircle(0, 0, r, o.seed || 1);
  ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = r * 0.1; ctx.stroke();

  // cheek blush
  ctx.fillStyle = 'rgba(255,120,160,0.35)';
  ctx.beginPath(); ctx.ellipse(r * 0.15, r * 0.3, r * 0.22, r * 0.14, 0, 0, TAU); ctx.fill();

  // eyes — the little square eyes from the drawing.
  // A dark-faced lotl carries its own light `eye` colour so the face still reads.
  const eyeInk = c.eye || ink;
  ctx.fillStyle = eyeInk;
  for (const s of [-1, 1]) {
    const ey = s * r * 0.3, ex = r * 0.32;
    ctx.save(); ctx.translate(ex, ey);
    ctx.beginPath();
    const ew = r * 0.24, eh = r * 0.2;
    ctx.roundRect ? ctx.roundRect(-ew / 2, -eh / 2, ew, eh, r * 0.05) : ctx.rect(-ew / 2, -eh / 2, ew, eh);
    ctx.fill();
    ctx.fillStyle = c.eye ? ink : '#fff';
    ctx.beginPath(); ctx.arc(ew * 0.18, -eh * 0.18, r * 0.05, 0, TAU); ctx.fill();
    ctx.fillStyle = eyeInk;
    ctx.restore();
  }
  // smile
  ctx.strokeStyle = eyeInk; ctx.lineWidth = r * 0.07;
  ctx.beginPath(); ctx.arc(r * 0.5, 0, r * 0.24, -0.7, 0.7); ctx.stroke();

  // trident
  if (o.trident) {
    ctx.save();
    ctx.translate(r * 0.95, r * 0.5); ctx.rotate(-0.35 + Math.sin(t * 0.08) * 0.05);
    ctx.strokeStyle = '#6b5b4a'; ctx.lineWidth = r * 0.11;
    ctx.beginPath(); ctx.moveTo(-r * 0.4, r * 0.5); ctx.lineTo(r * 0.75, -r * 0.35); ctx.stroke();
    ctx.strokeStyle = '#d9d2c7'; ctx.lineWidth = r * 0.1;
    for (const k of [-1, 0, 1]) {
      ctx.beginPath();
      ctx.moveTo(r * 0.6, -r * 0.2);
      ctx.lineTo(r * 0.6 + r * 0.36 + k * r * 0.05, -r * 0.25 + k * r * 0.32);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

const STAGE_THEMES = [
  { name: 'VOLCANO', top: '#41235f', mid: '#d85b55', bottom: '#ffd08a', ink: '#76283b', bubble: '#ffd0a8', ground: ['#ff6b57', '#a41f2e'] },
  { name: 'JUNGLE', top: '#0d684f', mid: '#65bd65', bottom: '#cce98a', ink: '#165c3a', bubble: '#b7ffd2', ground: ['#3b9952', '#174f36'] },
  { name: 'DESERT', top: '#58b9d4', mid: '#f4c978', bottom: '#ffe9ad', ink: '#a96032', bubble: '#fff1bd', ground: ['#e7a75e', '#a85d38'] },
  { name: 'ICE CAVE', top: '#183f78', mid: '#72c7df', bottom: '#dffaff', ink: '#296f9b', bubble: '#e8ffff', ground: ['#8fe2ee', '#3978ad'] }
];

function stageTheme(stage) {
  return STAGE_THEMES[((stage || G.stage) - 1) % STAGE_THEMES.length];
}

function drawThemeGround(theme, top) {
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, top);
  for (let x = 0; x <= W; x += 24) {
    ctx.lineTo(x, top + Math.sin(x * 0.014 + G.t * 0.025) * 9 + Math.sin(x * 0.031 - G.t * 0.018) * 4);
  }
  ctx.lineTo(W, H); ctx.closePath();
  const gg = ctx.createLinearGradient(0, top - 20, 0, H);
  gg.addColorStop(0, theme.ground[0]); gg.addColorStop(1, theme.ground[1]);
  ctx.fillStyle = gg; ctx.fill(); ctx.clip();
  ctx.globalAlpha = 0.22; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const y = top + 14 + i * 14, off = (G.t * (0.5 + i * 0.06)) % (W + 260) - 130;
    ctx.beginPath(); ctx.moveTo(off - 150, y); ctx.lineTo(off + 150, y + Math.sin(i) * 4); ctx.stroke();
  }
  ctx.restore();
}

function drawBackground() {
  const theme = stageTheme();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, theme.top); g.addColorStop(0.52, theme.mid); g.addColorStop(1, theme.bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (theme.name === 'VOLCANO') {
    // distant volcano, crater glow, and drifting smoke
    ctx.fillStyle = '#5a263d';
    ctx.beginPath(); ctx.moveTo(W * 0.54, H - 108); ctx.lineTo(W * 0.73, 205); ctx.lineTo(W * 0.91, H - 108); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff9d3d'; ctx.beginPath(); ctx.ellipse(W * 0.73, 215, 48, 13, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ff713d'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(W * 0.73, 230); ctx.lineTo(W * 0.68, 390); ctx.lineTo(W * 0.64, H - 108); ctx.stroke();
    for (let i = 0; i < 5; i++) {
      ctx.globalAlpha = 0.22 - i * 0.025; ctx.fillStyle = '#ead8df';
      ctx.beginPath(); ctx.arc(W * 0.73 + Math.sin(G.t * 0.01 + i) * 20, 170 - i * 30, 24 + i * 7, 0, TAU); ctx.fill();
    }
  } else if (theme.name === 'JUNGLE') {
    // leafy canopy, trunks, and dangling vines
    ctx.fillStyle = 'rgba(17,75,44,0.58)';
    for (let x = -40; x < W + 60; x += 95) {
      ctx.beginPath(); ctx.arc(x, 25 + Math.sin(x) * 15, 72, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(69,66,38,0.45)';
    for (let x = 80; x < W; x += 310) ctx.fillRect(x, 0, 28, H - 105);
    ctx.strokeStyle = '#236b3b'; ctx.lineWidth = 10; ctx.lineCap = 'round';
    for (let x = 150; x < W; x += 260) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.bezierCurveTo(x - 30, 100, x + 55, 150, x + Math.sin(G.t * 0.02 + x) * 30, 260); ctx.stroke();
    }
  } else if (theme.name === 'DESERT') {
    // sun, pyramids, and rolling dunes
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff1a8'; ctx.beginPath(); ctx.arc(W * 0.18, 130, 70, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.32; ctx.fillStyle = '#b86f43';
    for (const [x, size] of [[W * 0.58, 170], [W * 0.77, 125]]) {
      ctx.beginPath(); ctx.moveTo(x - size, H - 105); ctx.lineTo(x, H - 105 - size); ctx.lineTo(x + size, H - 105); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 0.35; ctx.strokeStyle = '#aa6539'; ctx.lineWidth = 7;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(-80, 390 + i * 55); ctx.quadraticCurveTo(W * 0.35, 320 + i * 65, W + 80, 400 + i * 45); ctx.stroke();
    }
  } else {
    // icy ceiling and crystal pillars
    ctx.fillStyle = 'rgba(216,251,255,0.70)';
    for (let x = 0; x < W; x += 90) {
      const len = 55 + (x * 17 % 95);
      ctx.beginPath(); ctx.moveTo(x - 32, 0); ctx.lineTo(x, len); ctx.lineTo(x + 35, 0); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(181,244,255,0.42)';
    for (let x = 120; x < W; x += 260) {
      ctx.beginPath(); ctx.moveTo(x - 38, H - 105); ctx.lineTo(x, H - 270); ctx.lineTo(x + 46, H - 105); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore(); ctx.globalAlpha = 1;

  // common crayon texture and stage-colored bubbles
  ctx.save(); ctx.globalAlpha = 0.07; ctx.strokeStyle = theme.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    const y = (i * 57 + (G.t * 0.12) % 57) % (H * 0.68);
    ctx.beginPath(); ctx.moveTo(0, y);
    for (let x = 0; x <= W; x += 90) ctx.lineTo(x, y + Math.sin((x + i * 40 + G.t * 0.4) * 0.01) * 7);
    ctx.stroke();
  }
  ctx.restore();
  for (const b of G.bgBubbles) {
    ctx.globalAlpha = b.a; ctx.fillStyle = theme.bubble;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawThemeGround(theme, H - 108);
}

function drawFoe(f) {
  const k = FOE_KINDS[f.kind];
  ctx.save();
  ctx.translate(f.x, f.y);
  if (f.flash > 0) ctx.globalAlpha = 0.6;
  ctx.lineJoin = 'round';
  if (f.kind === 'spiker') {
    ctx.fillStyle = k.color;
    ctx.beginPath();
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * TAU, rr = f.r * (i % 2 ? 1.32 : 0.86);
      const px = Math.cos(a + f.t * 0.02) * rr, py = Math.sin(a + f.t * 0.02) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = k.dark; ctx.lineWidth = 4; ctx.stroke();
  } else {
    ctx.fillStyle = f.flash > 0 ? '#fff' : k.color;
    wobbleCircle(0, 0, f.r, f.phase);
    ctx.fill();
    ctx.strokeStyle = k.dark; ctx.lineWidth = 5; ctx.stroke();
    if (f.kind === 'blob') {
      ctx.fillStyle = 'rgba(255,220,120,0.55)';
      ctx.beginPath(); ctx.arc(-f.r * 0.2, -f.r * 0.25, f.r * 0.32, 0, TAU); ctx.fill();
    }
  }
  // angry face
  ctx.fillStyle = '#1a0f1a';
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(-f.r * 0.28, s * f.r * 0.26); ctx.rotate(s * 0.4);
    ctx.fillRect(-6, -4, 13, 8);
    ctx.restore();
  }
  ctx.strokeStyle = '#1a0f1a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-f.r * 0.45, f.r * 0.02, f.r * 0.3, 2.5, 3.9); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBoss(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  const t = b.t;
  if (b.mode === 'dying') ctx.globalAlpha = 0.5 + Math.sin(t * 0.6) * 0.4;
  // glow
  ctx.fillStyle = 'rgba(255,90,54,0.22)';
  ctx.beginPath(); ctx.arc(0, 0, b.r * 1.45 + Math.sin(t * 0.05) * 8, 0, TAU); ctx.fill();
  const colors = { body: b.flash > 0 ? '#ffffff' : '#c0392b', fin: '#ff7a3d', gill: '#ffcc4d' };
  drawLotl(0, 0, b.r, colors, { t, flip: true, seed: 7, trident: false });
  // crown of spikes
  ctx.strokeStyle = '#ffcc4d'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 26, -b.r * 0.85);
    ctx.lineTo(i * 30, -b.r * 1.3 - Math.abs(i) * -6 + Math.sin(t * 0.08 + i) * 4);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // hp bar — the label sits centred inside the bar, whatever baseline we inherited
  const bw = Math.min(W * 0.6, 620), bx = (W - bw) / 2, by = 22, bh = 26;
  ctx.fillStyle = 'rgba(30,16,40,0.35)';
  roundRect(bx - 5, by - 5, bw + 10, bh + 10, 16); ctx.fill();
  ctx.fillStyle = '#3b1f2e';
  roundRect(bx, by, bw, bh, 13); ctx.fill();
  ctx.fillStyle = '#ff5a36';
  roundRect(bx, by, bw * clamp(b.hp / b.maxHp, 0, 1), bh, 13); ctx.fill();
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 17px system-ui,sans-serif';
  ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,16,40,0.55)';
  ctx.strokeText('MAGMA LOTL', W / 2, by + bh / 2 + 1);
  ctx.fillStyle = '#fff';
  ctx.fillText('MAGMA LOTL', W / 2, by + bh / 2 + 1);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  const rr = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawEntities() {
  // orbs
  for (const o of G.orbs) {
    const pulse = 1 + Math.sin((o.t + o.phase * 20) * 0.12) * 0.12;
    ctx.fillStyle = 'rgba(155,107,255,0.28)';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 2.0 * pulse, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8e44e8';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * pulse, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#4b1e8c'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(o.x - o.r * 0.3, o.y - o.r * 0.35, o.r * 0.26, 0, TAU); ctx.fill();
  }
  // pickups
  for (const k of G.pickups) {
    const s = 1 + Math.sin(k.t * 0.1) * 0.1;
    ctx.save(); ctx.translate(k.x, k.y); ctx.scale(s, s);
    ctx.font = '40px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(k.type === 'target' ? '🎯' : '❤️', 0, 0);
    ctx.restore();
  }
  // foes
  for (const f of G.foes) drawFoe(f);
  if (G.boss) drawBoss(G.boss);

  // a small crosshair shows what each auto-firing trident is aiming at
  for (const p of G.players) {
    const target = p.aimTarget;
    if (!p.alive || !target || target.dead || target.hp <= 0) continue;
    const rr = target.r * 0.72 + Math.sin(G.t * 0.12 + p.slot) * 3;
    ctx.save();
    ctx.strokeStyle = p.slot === 0 ? 'rgba(58,160,255,0.78)' : 'rgba(255,176,32,0.78)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(target.x, target.y, rr, 0, TAU); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(target.x + Math.cos(a) * (rr - 8), target.y + Math.sin(a) * (rr - 8));
      ctx.lineTo(target.x + Math.cos(a) * (rr + 8), target.y + Math.sin(a) * (rr + 8));
      ctx.stroke();
    }
    ctx.restore();
  }

  // bullets
  for (const b of G.bullets) {
    if (b.kind === 'bubble') {
      ctx.fillStyle = 'rgba(201,166,255,0.85)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#6a35c9'; ctx.lineWidth = 2.5; ctx.stroke();
    } else {
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.strokeStyle = b.color || '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(10, 0); ctx.stroke();
      ctx.lineWidth = 4;
      for (const s of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(16, s * 7); ctx.stroke(); }
      ctx.restore();
    }
  }
  // enemy bullets
  for (const b of G.ebullets) {
    ctx.fillStyle = b.kind === 'ink' ? '#3a3a4a' : '#ff7a3d';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = b.kind === 'ink' ? '#15151f' : '#a8320f'; ctx.lineWidth = 3; ctx.stroke();
  }

  // players
  for (const p of G.players) {
    if (!p.alive) continue;
    if (p.inv > 0 && ((p.inv | 0) % 10) < 5) continue;
    // swim trail
    ctx.globalAlpha = 0.25; ctx.fillStyle = p.lotl.trail;
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath(); ctx.arc(p.x - p.facing * i * 16, p.y + Math.sin(p.bob - i) * 4, p.r * (1 - i * 0.22), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawLotl(p.x, p.y + Math.sin(p.bob) * 4, p.r, p.lotl, {
      t: G.t, seed: p.slot + 2, trident: true, flip: p.facing < 0,
      tilt: p.facing * clamp(p.vy * 0.02, -0.35, 0.35)
    });
    if (G.players.length > 1) {
      ctx.fillStyle = p.slot === 0 ? '#3aa0ff' : '#ffb020';
      ctx.font = '700 16px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('P' + (p.slot + 1), p.x, p.y - p.r - 14);
    }
  }
  // downed lotls
  for (const p of G.players) {
    if (p.alive) continue;
    ctx.save(); ctx.globalAlpha = 0.4;
    ctx.font = '700 20px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#4a2d6b';
    if (G.players.length > 1) ctx.fillText('P' + (p.slot + 1) + ' back in ' + Math.max(0, Math.ceil((480 - p.downTimer) / 60)) + 's', W / 2, H - 150);
    ctx.restore();
  }

  // fx
  for (const e of G.fx) {
    const k = 1 - e.t / e.life;
    ctx.globalAlpha = clamp(k, 0, 1);
    if (e.kind === 'dot') {
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * k, 0, TAU); ctx.fill();
    } else if (e.kind === 'ring') {
      ctx.strokeStyle = e.color; ctx.lineWidth = 12 * k;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + (e.max - e.r) * (1 - k), 0, TAU); ctx.stroke();
    } else if (e.kind === 'spark') {
      ctx.strokeStyle = e.color; ctx.lineWidth = 4;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU;
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10);
        ctx.lineTo(e.x + Math.cos(a) * (10 + 24 * (1 - k)), e.y + Math.sin(a) * (10 + 24 * (1 - k)));
        ctx.stroke();
      }
    } else if (e.kind === 'text') {
      ctx.fillStyle = e.color; ctx.font = '800 30px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 6;
      ctx.strokeText(e.text, e.x, e.y); ctx.fillText(e.text, e.x, e.y);
    } else if (e.kind === 'beam') {
      ctx.fillStyle = e.color;
      const h = 90 * (k * 0.6 + 0.4);
      const beamW = (e.max || POWER_RANGE) * (e.dir || 1);
      ctx.fillRect(e.x, e.y - h / 2, beamW, h);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(e.x, e.y - h / 6, beamW, h / 3);
    } else if (e.kind === 'bolt') {
      ctx.strokeStyle = e.color; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(e.x + rnd(-8, 8), 0);
      for (let y = 0; y < e.y; y += 40) ctx.lineTo(e.x + rnd(-22, 22), y);
      ctx.lineTo(e.x, e.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

/* ============================================================
   UI
   ============================================================ */
function btn(o) {
  // id must be stable frame to frame — fall back to position, since some labels animate
  o.id = o.id || (o.label + '@' + Math.round(o.x) + ',' + Math.round(o.y));
  buttons.push(o);
  const held = heldIds.has(o.id);
  ctx.save();
  const sc = held ? 0.95 : 1;
  if (o.shape === 'circle') {
    ctx.translate(o.x, o.y); ctx.scale(sc, sc);
    ctx.fillStyle = o.bg || '#8e44e8';
    ctx.beginPath(); ctx.arc(0, 0, o.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = o.stroke || 'rgba(0,0,0,0.35)'; ctx.lineWidth = 5; ctx.stroke();
    ctx.fillStyle = o.fg || '#fff';
    ctx.font = o.font || ('700 ' + Math.round(o.r * 0.7) + 'px system-ui,sans-serif');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.label, 0, 2);
  } else {
    ctx.translate(o.x + o.w / 2, o.y + o.h / 2); ctx.scale(sc, sc); ctx.translate(-o.w / 2, -o.h / 2);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    roundRect(4, 8, o.w, o.h, 20); ctx.fill();
    ctx.fillStyle = o.bg || '#8e44e8';
    roundRect(0, 0, o.w, o.h, 20); ctx.fill();
    ctx.strokeStyle = o.stroke || 'rgba(0,0,0,0.3)'; ctx.lineWidth = 4;
    roundRect(0, 0, o.w, o.h, 20); ctx.stroke();
    ctx.fillStyle = o.fg || '#fff';
    ctx.font = o.font || '800 34px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.label, o.w / 2, o.h / 2 + 2);
  }
  ctx.restore();
}

function bigTitle(text, y, size, color) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + size + 'px system-ui,-apple-system,sans-serif';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#20141f'; ctx.lineWidth = size * 0.17;
  ctx.strokeText(text, W / 2, y);
  ctx.fillStyle = color || '#ffd166';
  ctx.fillText(text, W / 2, y);
  ctx.restore();
}

function drawHUD() {
  const p = G.players[0];
  // health bars
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (const pl of G.players) {
    // below the top strip, so a health bar never runs into the boss bar
    const yy = 62 + pl.slot * 42;
    const bx = G.players.length > 1 ? 58 : 20, bw = 210, bh = 22;
    if (G.players.length > 1) {
      ctx.fillStyle = pl.slot === 0 ? '#3aa0ff' : '#ffb020';
      ctx.font = '800 20px system-ui,sans-serif';
      ctx.fillText('P' + (pl.slot + 1), 20, yy);
    }
    const ratio = clamp(pl.health / pl.maxHealth, 0, 1);
    ctx.fillStyle = 'rgba(32,20,31,0.28)'; roundRect(bx - 4, yy - bh / 2 - 4, bw + 8, bh + 8, 10); ctx.fill();
    ctx.fillStyle = '#fff'; roundRect(bx, yy - bh / 2, bw, bh, 7); ctx.fill();
    ctx.fillStyle = ratio > 0.55 ? '#45c46b' : ratio > 0.25 ? '#ffd166' : '#ff5a5f';
    if (ratio > 0) { roundRect(bx, yy - bh / 2, bw * ratio, bh, 7); ctx.fill(); }
    ctx.fillStyle = '#20141f'; ctx.font = '800 14px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(pl.health) + ' HP', bx + bw / 2, yy + 1);
    if (pl.aimTimer > 0) {
      ctx.textAlign = 'left'; ctx.font = '800 16px system-ui,sans-serif'; ctx.fillStyle = '#267fc5';
      ctx.fillText('🎯 ' + Math.ceil(pl.aimTimer / 60) + 's', bx + bw + 12, yy);
    }
  }

  // score + orbs
  ctx.textAlign = 'right';
  ctx.font = '800 30px system-ui,sans-serif';
  ctx.fillStyle = '#4a2d6b';
  ctx.fillText(G.score.toLocaleString(), W - 22, 34);
  ctx.font = '700 22px system-ui,sans-serif';
  ctx.fillStyle = '#7b3fd6';
  ctx.fillText('🟣 ' + G.orbCount + '   ⭐ ' + save.best.toLocaleString(), W - 22, 66);

  // stage progress — training has no clock, so it says so instead
  if (G.training) {
    const bw = 200, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.72)'; roundRect(bx, 20, bw, 28, 14); ctx.fill();
    ctx.fillStyle = '#4a2d6b'; ctx.font = '800 17px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🎓 TRAINING', W / 2, 35);
  } else if (!G.boss) {
    const bw = 260, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; roundRect(bx, 20, bw, 16, 8); ctx.fill();
    ctx.fillStyle = '#7b3fd6'; roundRect(bx, 20, bw * clamp(G.stageTimer / STAGE_LEN, 0, 1), 16, 8); ctx.fill();
    ctx.fillStyle = '#4a2d6b'; ctx.font = '700 16px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('STAGE ' + G.stage, W / 2, 50);
  }

  // pause
  btn({ id: 'pause', shape: 'circle', x: W - 46, y: H - 46, r: 34, label: '⏸', bg: 'rgba(255,255,255,0.85)', fg: '#4a2d6b',
        onTap: () => { G.screen = 'paused'; } });

  // power buttons — one per player, big and thumb-friendly
  for (const pl of G.players) {
    const ready = pl.power >= pl.powerMax && pl.alive;
    const bx = pl.slot === 0 ? 92 : 92 + 190;
    const by = H - 92;
    const pulse = ready ? 1 + Math.sin(G.t * 0.15) * 0.05 : 1;
    ctx.save();
    ctx.translate(bx, by); ctx.scale(pulse, pulse); ctx.translate(-bx, -by);
    // meter ring
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(bx, by, 58, 0, TAU); ctx.stroke();
    ctx.strokeStyle = ready ? '#ffd166' : shotColor(pl.lotl); ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(bx, by, 58, -Math.PI / 2, -Math.PI / 2 + TAU * (pl.power / pl.powerMax)); ctx.stroke();
    ctx.restore();
    btn({
      id: 'power' + pl.slot,
      shape: 'circle', x: bx, y: by, r: 48,
      label: ready ? pl.lotl.powerIcon : Math.floor(pl.power / pl.powerMax * 100) + '%',
      bg: ready ? '#ffd166' : 'rgba(255,255,255,0.75)',
      fg: ready ? '#4a2d6b' : '#8a7aa8',
      font: ready ? '40px system-ui,sans-serif' : '800 22px system-ui,sans-serif',
      onTap: () => firePower(pl)
    });
  }

  // the chain counter — front and centre while it's alive
  if (G.combo >= 3) {
    const m = comboMult();
    const pop = 1 + Math.max(0, (105 - G.comboTimer) < 8 ? 0 : 0) + Math.sin(G.t * 0.3) * 0.02;
    ctx.save();
    ctx.translate(W / 2, 108); ctx.scale(pop, pop);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 46px system-ui,sans-serif';
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#20141f'; ctx.lineWidth = 9;
    const txt = G.combo + ' CHAIN' + (m > 1 ? '  x' + m : '');
    ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = m > 1 ? '#ffd166' : '#fff';
    ctx.fillText(txt, 0, 0);
    // draining timer bar
    ctx.restore();
    const bw = 150, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; roundRect(bx, 132, bw, 8, 4); ctx.fill();
    ctx.fillStyle = '#ffd166';
    roundRect(bx, 132, bw * clamp(G.comboTimer / 105, 0, 1), 8, 4); ctx.fill();
  }

  if (G.coach) drawCoach();

  // banner
  if (G.banner) {
    const k = G.banner.t;
    const a = k < 15 ? k / 15 : k > 105 ? (130 - k) / 25 : 1;
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
    bigTitle(G.banner.text, H * 0.33, 76, '#ffd166');
    if (G.banner.sub) {
      ctx.textAlign = 'center'; ctx.font = '700 26px system-ui,sans-serif';
      ctx.strokeStyle = '#20141f'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
      ctx.strokeText(G.banner.sub, W / 2, H * 0.33 + 58);
      ctx.fillStyle = '#fff'; ctx.fillText(G.banner.sub, W / 2, H * 0.33 + 58);
    }
    ctx.restore();
  }
}

function drawCoach() {
  const c = G.coach, step = TRAINING_STEPS[c.step];
  const last = c.step === TRAINING_STEPS.length - 1;
  const cw = Math.min(660, W - 360), cx = W / 2, cy = H - 152, ch = 96;

  ctx.save();

  ctx.strokeStyle = last ? '#ffd166' : 'rgba(255,255,255,0.4)'; ctx.lineWidth = 4;
  roundRect(x, cy, cw, ch, 22); ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffd166';
  fitOne(step.title, cx, cy + 30, cw - 48, 22, '900');
  ctx.fillStyle = '#efe6ff';
  fitText(step.text, cx, cy + 56, cw - 44, 2, [17, 16, 15, 14], '600');

        onTap: () => startRun(G.coop) });

function splitLines(text, maxW) {
  const lines = [];
  let line = '';
  for (const w of text.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function wrapText(text, cx, y, maxW, lh) {
  splitLines(text, maxW).forEach((l, i) => ctx.fillText(l, cx, y + i * lh));
}

// One line that must not clip: shrink until it fits the box it was given.
function fitOne(text, cx, y, maxW, size, weight) {
  let s = size;
  do {
    ctx.font = weight + ' ' + s + 'px system-ui,sans-serif';
    s -= 1;
  } while (ctx.measureText(text).width > maxW && s > 8);
  ctx.fillText(text, cx, y);
}

// Card blurbs vary in length, so pick the biggest size that still fits the
// space we have. Anything that refuses to fit gets clipped with an ellipsis
// rather than sliding under whatever is drawn below it.
function fitText(text, cx, y, maxW, maxLines, sizes, weight) {
  let lines = [], size = sizes[0];
  for (size of sizes) {
    ctx.font = weight + ' ' + size + 'px system-ui,sans-serif';
    lines = splitLines(text, maxW);
    if (lines.length <= maxLines) break;
  }
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[maxLines - 1] += '…';
  }
  const lh = size + 4;
  lines.forEach((l, i) => ctx.fillText(l, cx, y + i * lh));
  return y + lines.length * lh;
}

  const heading = (text, x, yy, icon) => {
    ctx.textAlign = 'left'; ctx.font = '900 24px system-ui,sans-serif'; ctx.fillStyle = '#ffd166';
    ctx.fillText((icon ? icon + '  ' : '') + text, x, yy);
  };
  const line = (text, x, yy, color) => {
    ctx.textAlign = 'left'; ctx.font = '600 17px system-ui,sans-serif';
    ctx.fillStyle = color || '#e8dcff';
    return wrapLeft(text, x, yy, colW, 23);
  };

  // left column — the goal and the controls
  heading('WHAT TO DO', lx, y, '🎯'); y += 30;
  y = line('Swim around and grab the purple orbs. Your trident always fires forward, to the right — so line the enemies up on your right side.', lx, y); y += 12;
  y = line('Grab a floating target for 7 seconds of auto-aim. Every stage ends with the Magma Lotl boss. Beat it, restore some health, and enter a new world.', lx, y); y += 12;
  y = line('New to it? Tap 🎓 TRAINING on the lotl screen. Same game, with a hint card at the bottom, and nothing can beat you — play until you feel ready.', lx, y, '#ffd166'); y += 26;

  heading('CONTROLS', lx, y, '🎮'); y += 30;
  y = line('On a tablet:  put a finger anywhere and drag. Your lotl follows it.', lx, y, '#8fd4ff'); y += 8;
  y = line('On a computer:  arrow keys or WASD to swim.', lx, y, '#8fd4ff'); y += 8;
  y = line('Big round button (or the SPACE bar) fires your special power once it glows. Powers only reach nearby enemies.', lx, y, '#8fd4ff'); y += 8;
  y = line('Two players, one keyboard:  P1 uses the ARROW KEYS + SPACE, P2 uses W A S D + Q.', lx, y, '#ffd166'); y += 8;
  y = line('Two players, one tablet:  each of you drags with one finger, and each has your own round power button.', lx, y, '#ffd166'); y += 8;
  y = line('In menus:  ← → to pick a lotl, ENTER to start, T for training, 2 for two players, ESC to go back.', lx, y, '#8fd4ff');

  // right column — the scoring and the collection
  let y2 = 118;
  heading('CHAINS = BIG POINTS', rx, y2, '🔗'); y2 += 30;
  y2 = line('Grab orbs one after another without stopping and your chain climbs — the sound goes up a note each time.', rx, y2); y2 += 8;
  y2 = line('Every 8 orbs your multiplier goes up: x2, x3, x4... Getting hit breaks the chain, so stay safe!', rx, y2); y2 += 8;
  y2 = line('Watch for ORB RUSH — a huge river of orbs. That is your chance at a giant chain.', rx, y2, '#ffd166'); y2 += 26;

  heading('COLLECT THE LOTLS', rx, y2, '🃏'); y2 += 30;
  y2 = line('There are 6 lotls. Mochi and Coal are yours from the start; the other four are locked.', rx, y2); y2 += 8;
  y2 = line('Collect orbs and reach new stages to unlock them — your progress is saved between games.', rx, y2); y2 += 26;

  heading('HEALTH', rx, y2, '❤️'); y2 += 30;
  y2 = line('Watch your health bar. Hits take away 34 HP. Floating hearts restore 30 HP, and Mochi can heal the whole team.', rx, y2);

  btn({ id: 'helpback', x: W / 2 - 130, y: H - 92, w: 260, h: 64, label: '↩  GOT IT', bg: '#8e44e8',
        font: '800 28px system-ui,sans-serif',
        onTap: () => { G.screen = G.helpFrom || 'title'; } });
}

// left-aligned wrap that reports where it finished, so sections can stack
function wrapLeft(text, x, y, maxW, lh) {
  const words = text.split(' ');
  let lineStr = '', yy = y;
  for (const w of words) {
    const test = lineStr ? lineStr + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && lineStr) { ctx.fillText(lineStr, x, yy); lineStr = w; yy += lh; }
    else lineStr = test;
  }
  if (lineStr) { ctx.fillText(lineStr, x, yy); yy += lh; }
  return yy;
}

function drawPaused() {
  ctx.fillStyle = 'rgba(30,16,48,0.55)'; ctx.fillRect(0, 0, W, H);
  bigTitle('PAUSED', H * 0.32, 72, '#ffd166');
  btn({ x: W / 2 - 150, y: H * 0.48, w: 300, h: 78, label: '▶  KEEP GOING', bg: '#8e44e8',
        onTap: () => { G.screen = 'play'; } });
  btn({ id: 'pausehelp', x: W / 2 - 150, y: H * 0.48 + 96, w: 300, h: 64, label: '?  HOW TO PLAY', bg: '#ffd166',
        fg: '#4a2d6b', font: '800 26px system-ui,sans-serif',
        onTap: () => { G.helpFrom = 'paused'; G.screen = 'help'; } });
  btn({ id: 'pausemenu', x: W / 2 - 150, y: H * 0.48 + 168, w: 300, h: 60, label: '🏠 MENU', bg: '#6b5b8f',
        font: '800 26px system-ui,sans-serif',
        onTap: () => { G.screen = 'title'; G.coop = false; G.training = false; G.coach = null; } });
  // sound sits beside the column, not on top of it — MENU owns that row
  btn({ id: 'mute2', shape: 'circle', x: W / 2 + 194, y: H * 0.48 + 198, r: 34, label: save.mute ? '🔇' : '🔊',
        bg: 'rgba(255,255,255,0.85)', fg: '#4a2d6b', font: '28px system-ui,sans-serif',
        onTap: () => { save.mute = !save.mute; persist(); } });
}

function drawOver() {
  ctx.fillStyle = 'rgba(30,16,48,0.6)'; ctx.fillRect(0, 0, W, H);
  const isBest = G.score >= save.best && G.score > 0;
  bigTitle(isBest ? 'NEW BEST!' : 'GOOD SWIM!', H * 0.24, 68, isBest ? '#ffd166' : '#fff');
  ctx.textAlign = 'center';
  ctx.font = '900 62px system-ui,sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(G.score.toLocaleString(), W / 2, H * 0.24 + 92);
  ctx.font = '700 24px system-ui,sans-serif'; ctx.fillStyle = '#e0cfff';
  ctx.fillText('🟣 ' + G.orbCount + ' orbs   ·   🌊 stage ' + G.stage + '   ·   ⭐ best ' + save.best.toLocaleString(),
    W / 2, H * 0.24 + 140);

  // best chain of the run
  if (G.bestCombo >= 3) {
    ctx.font = '800 22px system-ui,sans-serif'; ctx.fillStyle = '#ffd166';
    ctx.fillText('🔗 best chain: ' + G.bestCombo, W / 2, H * 0.24 + 174);
  }

  // stars for the run — the unlock card takes this space when there is one
  const hasUnlock = G.newUnlocks && G.newUnlocks.length;
  if (!hasUnlock) {
    const stars = clamp(Math.floor(G.score / 900), 0, 5);
    ctx.font = '40px system-ui,sans-serif';
    let s = '';
    for (let i = 0; i < 5; i++) s += i < stars ? '⭐' : '☆';
    ctx.fillText(s, W / 2, H * 0.24 + 218);
  }

  // a new lotl joined the team
  if (hasUnlock) {
    const l = G.newUnlocks[0];
    const cx = W / 2, cy = H * 0.565;
    ctx.save();
    ctx.globalAlpha = 0.95;
    // sunburst
    ctx.translate(cx, cy);
    ctx.rotate(G.t * 0.006);
    ctx.fillStyle = 'rgba(255,209,102,0.30)';
    for (let i = 0; i < 12; i++) {
      ctx.rotate(TAU / 12);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(150, -22); ctx.lineTo(150, 22); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    drawLotl(cx, cy, 44, l, { t: G.t, seed: 9, trident: true, tilt: Math.sin(G.t * 0.04) * 0.12 });
    ctx.textAlign = 'center';
    ctx.font = '900 30px system-ui,sans-serif';
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#20141f'; ctx.lineWidth = 7;
    const msg = 'NEW LOTL:  ' + l.name.toUpperCase() + '!';
    ctx.strokeText(msg, cx, cy + 78); ctx.fillStyle = '#ffd166'; ctx.fillText(msg, cx, cy + 78);
    ctx.font = '700 18px system-ui,sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(l.powerIcon + ' ' + l.tip, cx, cy + 106);
  }

  btn({ x: W / 2 - 160, y: H * 0.755, w: 320, h: 78, label: '🔁 PLAY AGAIN', bg: '#8e44e8',
        onTap: () => startRun(G.coop) });
  btn({ x: W / 2 - 100, y: H * 0.755 + 92, w: 200, h: 52, label: '🏠 MENU', bg: '#6b5b8f', font: '700 26px system-ui,sans-serif',
        onTap: () => { G.screen = 'title'; G.coop = false; G.training = false; G.coach = null; } });
}

/* ============================================================
   LOOP
   ============================================================ */
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 16.667;
  last = now;
  if (dt > 3) dt = 3;      // tab was backgrounded — don't teleport everything

  if (G.freeze > 0) G.freeze -= dt;   // hit-stop: hold the frame, keep drawing
  else update(dt);

  buttons.length = 0;
  ctx.save();
  if (G.shake > 0.4) ctx.translate(rnd(-G.shake, G.shake), rnd(-G.shake, G.shake));
  drawBackground();
  if (G.screen === 'play' || G.screen === 'paused' || G.screen === 'over' || G.screen === 'help') drawEntities();
  ctx.restore();

  if (G.screen === 'title') drawTitle();
  else if (G.screen === 'select') drawSelect();
  else if (G.screen === 'play') drawHUD();
  else if (G.screen === 'paused') { drawHUD(); drawPaused(); }
  else if (G.screen === 'over') drawOver();
  else if (G.screen === 'help') drawHelp();

  requestAnimationFrame(frame);
}

/* ============================================================
   MULTIPLAYER SEAM  (see README)
   Everything above already treats G.players as a list, and each
   player's motion comes from {tx,ty} + a power tap. That is the
   whole network payload for a future online mode:
     -> send   {slot, tx, ty, firedPower}
     -> apply  onto the matching player each tick
   Local co-op (two fingers, one tablet) uses exactly that path.
   ============================================================ */
const Net = {
  enabled: false,
  applyRemoteInput(slot, tx, ty, firedPower) {
    const p = G.players[slot]; if (!p) return;
    p.tx = tx; p.ty = ty;
    if (firedPower) firePower(p);
  },
  localInputSnapshot() {
    return G.players.map(p => ({ slot: p.slot, tx: p.tx, ty: p.ty }));
  }
};
window.LotlNet = Net;
// Tuning/debug hook: poke at the live game from the console, e.g.
//   LotlGame.stageTimer = 99999   -> summon the boss right now
//   LotlGame.players[0].power = 100
window.LotlGame = G;
window.LotlKeys = keys;   // handy when a key appears stuck

resize();
requestAnimationFrame(frame);
</script>
