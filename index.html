const bossFor = stage => BOSSES[((stage || G.stage) - 1) % BOSSES.length];

function spawnBoss() {
  const def = bossFor(G.stage);
  // gentler than before per level, since the later bosses hit in more ways
  const hp = 60 + (G.stage - 1) * 13;
  G.boss = {
    def, x: W + 220, y: H / 2 - 40, r: def.r, hp, maxHp: hp, homeX: W - 240,
    t: 0, mode: 'enter', flash: 0, atk: 0, angry: false, solid: true, alpha: 1, s: {}
  };
  if (def.init) def.init(G.boss);
  banner(def.title || 'BOSS!', def.intro);
  Snd.boss();
  G.shake = 22;
}

function updateBoss(dt) {
  const b = G.boss; if (!b) return;
  b.t += dt; b.flash = Math.max(0, b.flash - dt);
  if (b.mode === 'enter') {
    b.x += (b.homeX - 30 - b.x) * 0.03 * dt;   // ease past the threshold, not exactly onto it
    if (b.x < b.homeX) b.mode = 'fight';
  } else if (b.mode === 'fight') {
    if (!b.angry && b.hp < b.maxHp * 0.4) { b.angry = true; banner(b.def.angryText || 'IT IS ANGRY!', 'Keep swimming!'); }
    b.def.update(b, dt);
    const m = b.def.minion;
    if (m && b.t % m.every < dt) spawnFoe(m.kind, clamp(b.y + rnd(-90, 90), 80, H - 200));
  } else if (b.mode === 'dying') {
    b.x += 1.2 * dt; b.y += 0.6 * dt;
    if (b.t % 6 < dt) { boom(b.x + rnd(-70, 70), b.y + rnd(-70, 70), b.def.bar, 14); Snd.pop(); }
    if (b.deadT == null) b.deadT = 0;
    b.deadT += dt;
    if (b.deadT > 90) {
      const beatAll = G.stage % BOSSES.length === 0;
      for (let i = 0; i < (beatAll ? 60 : 24); i++) spawnOrb(b.x + rnd(-60, 60), b.y + rnd(-60, 60), rnd(-4, -1), rnd(-2, 2));
      G.boss = null; G.stage++; G.stageTimer = 0; G.hazards.length = 0;
      G.score += beatAll ? 2000 : 500;
      // the level picker remembers right away, even if this run is quit later
      if (G.stage > (save.bestStage || 1)) save.bestStage = G.stage;
      if (beatAll) {
        save.champion = true;
        banner('YOU BEAT ALL 8!', 'Round ' + (Math.floor((G.stage - 1) / BOSSES.length) + 1) + ': every boss is back, and tougher!');
        for (const c of ['#ffd166', '#ff6fb5', '#5ec8ff', '#9be36b', '#b07bff']) boom(W / 2 + rnd(-300, 300), H / 3 + rnd(-80, 80), c, 30);
      } else {
        banner('LEVEL ' + G.stage + ': ' + stageTheme().name, 'You beat it! Next boss: ' + bossFor().name);
      }
      persist();
      Snd.win();
      for (const p of G.players) if (p.alive) p.health = Math.min(p.maxHealth, p.health + HEAL_AMOUNT);
    }
  }
}

/* ============================================================
   FX
   ============================================================ */
function boom(x, y, color, n) {
  for (let i = 0; i < (n || 10); i++) {
    const a = rnd(0, TAU), s = rnd(1.5, 6);
    G.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rnd(3, 9), life: rnd(18, 38), t: 0, color, kind: 'dot' });
  }
}
function ring(x, y, color, max) {
  G.fx.push({ x, y, r: 10, max: max || 260, life: 30, t: 0, color, kind: 'ring' });
}
function floatText(x, y, text, color) {
  G.fx.push({ x, y, text, color, life: 46, t: 0, kind: 'text' });
}

/* ============================================================
   POWERS
   ============================================================ */
const POWER_RANGE = 460;

function inPowerRange(p, target, range) {
  return !!target && dist2(p.x, p.y, target.x, target.y) <= (range || POWER_RANGE) ** 2;
}

function firePower(p) {
  if (!p || !p.alive || p.power < p.powerMax) return;
  if (G.coach) G.coach.powers++;
  p.power = 0;
  Snd.power();
  G.shake = 14;
  const id = p.lotl.id;

  if (id === 'mochi') {
    let healed = false;
    for (const teammate of G.players) {
      if (!teammate.alive || teammate.health >= teammate.maxHealth) continue;
      teammate.health = Math.min(teammate.maxHealth, teammate.health + HEAL_AMOUNT);
      healed = true;
      floatText(teammate.x, teammate.y - 60, '+' + HEAL_AMOUNT + ' HP', '#ff4d6d');
    }
    if (healed) Snd.heal();
    ring(p.x, p.y, '#ff9ec4', 520);
    G.ebullets = G.ebullets.filter(b => !inPowerRange(p, b));
    for (const f of G.foes) if (inPowerRange(p, f)) hurtFoe(f, 4, p);
  } else if (id === 'coal') {
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * TAU;
      G.bullets.push({ x: p.x, y: p.y, startX: p.x, startY: p.y, maxDist: POWER_RANGE,
        vx: Math.cos(a) * 9, vy: Math.sin(a) * 9, r: 12, dmg: 2, owner: p, kind: 'bubble', life: 120 });
    }
    ring(p.x, p.y, '#c9a6ff', 300);
  } else if (id === 'matcha') {
    G.fx.push({ x: p.x, y: p.y, dir: p.facing, max: POWER_RANGE, kind: 'beam', life: 40, t: 0, color: '#8ef06a' });
    for (const f of G.foes) {
      const ahead = (f.x - p.x) * p.facing > 0;
      if (ahead && Math.abs(f.y - p.y) < 90 && inPowerRange(p, f)) hurtFoe(f, 10, p);
    }
    if (G.boss && (G.boss.x - p.x) * p.facing > 0 && Math.abs(G.boss.y - p.y) < 150 && inPowerRange(p, G.boss)) hurtBoss(14, p);
    ring(p.x, p.y, '#9be36b', 220);
  } else if (id === 'blaze') {
    for (let i = 0; i < 16; i++) {
      const a = (p.facing < 0 ? Math.PI : 0) + (i - 7.5) * 0.075;
      G.bullets.push({ x: p.x, y: p.y, startX: p.x, startY: p.y, maxDist: POWER_RANGE,
        vx: Math.cos(a) * 13, vy: Math.sin(a) * 13,
        r: 15, dmg: 3, owner: p, kind: 'bubble', life: 110 });
    }
    ring(p.x, p.y, '#ff8a1f', 260);
    G.shake = 18;
  } else if (id === 'splash') {
    // nearby orbs come to you — save it for the densest part of an Orb Rush
    let n = 0;
    for (const o of G.orbs) {
      if (!inPowerRange(p, o)) continue;
      o.vx = (p.x - o.x) * 0.09; o.vy = (p.y - o.y) * 0.09;   // yanked in, collected on arrival
      n++;
    }
    for (const f of G.foes) if (inPowerRange(p, f)) hurtFoe(f, 3, p);
    ring(p.x, p.y, '#8fd4ff', POWER_RANGE);
    floatText(p.x, p.y - 70, n + ' orbs!', '#2f8fd6');
  } else if (id === 'storm') {
    for (const f of G.foes) if (inPowerRange(p, f)) {
      G.fx.push({ x: f.x, y: f.y, kind: 'bolt', life: 22, t: 0, color: '#a9a9ff' });
      hurtFoe(f, 8, p);
    }
    if (G.boss && inPowerRange(p, G.boss)) {
      hurtBoss(12, p);
      G.fx.push({ x: G.boss.x, y: G.boss.y, kind: 'bolt', life: 26, t: 0, color: '#a9a9ff' });
    }
    ring(p.x, p.y, '#8f8fff', 460);
    G.shake = 20;
  }
}

/* ============================================================
   DAMAGE
   ============================================================ */
function hurtFoe(f, dmg, by) {
  if (f.dead) return false;              // already gone this frame — don't pay out twice
  f.hp -= dmg; f.flash = 8;
  if (f.hp <= 0) {
    f.dead = true;                       // the foes loop sweeps it up
    const k = FOE_KINDS[f.kind];
    boom(f.x, f.y, k.color, 14);
    G.score += k.score * comboMult();
    if (by) { by.kills++; addPower(by, 6); }
    if (Math.random() < 0.55) spawnOrb(f.x, f.y, rnd(-3, -0.5), rnd(-1.5, 1.5));
    Snd.pop();
    return true;
  }
  return false;
}

function hurtBoss(dmg, by) {
  const b = G.boss; if (!b || b.mode !== 'fight' || !b.solid) return;
  b.hp -= dmg; b.flash = 6;
  if (by) addPower(by, 2);
  if (b.hp <= 0) {
    b.mode = 'dying'; b.t = 0; b.alpha = 1; G.shake = 26; G.freeze = 14; Snd.boss();
    G.hazards.length = 0;                 // a beaten boss's stripes go with it
  }
}

function addPower(p, n) { p.power = Math.min(p.powerMax, p.power + n); }

/* The chain: keep grabbing orbs without a gap and every orb is worth more,
   the pitch climbs, and the screen gets louder about it. */
const comboMult = () => 1 + Math.floor(G.combo / 8);

function collectOrb(p, x, y) {
  G.combo++;
  G.comboTimer = 105;
  if (G.combo > G.bestCombo) G.bestCombo = G.combo;
  const mult = comboMult();
  G.score += 10 * mult;
  G.orbCount++; p.orbs++;
  addPower(p, 4);
  Snd.orb(G.combo);
  G.fx.push({ x, y, kind: 'spark', life: 16, t: 0, color: mult > 1 ? '#ffd166' : '#c9a6ff' });
  if (G.combo % 8 === 0) {                       // every new multiplier step is an event
    Snd.combo(G.combo);
    floatText(p.x, p.y - 70, 'x' + comboMult() + '!', '#ffd166');
    ring(p.x, p.y, '#ffd166', 160);
    G.shake = Math.max(G.shake, 6);
  }
}

function hurtPlayer(p) {
  if (p.inv > 0 || !p.alive) return;
  if (G.coach) G.coach.hits++;
  p.health = Math.max(G.training ? TRAINING_FLOOR : 0, p.health - HIT_DAMAGE);
  p.inv = 110;
  G.shake = 16;
  G.freeze = 7;          // hit-stop: the moment lands harder
  G.combo = 0; G.comboTimer = 0;
  Snd.hurt();
  boom(p.x, p.y, shotColor(p.lotl), 16);
  if (p.health <= 0) {
    p.alive = false; p.downTimer = 0; p.pointerId = null;
    boom(p.x, p.y, '#ffffff', 24);
    if (livingPlayers().length === 0) gameOver();
    else floatText(p.x, p.y - 50, 'Help!', '#ffffff');
  }
}

const livingPlayers = () => G.players.filter(p => p.alive);

function findAutoTarget(p) {
  let target = null, best = Infinity;
  for (const f of G.foes) {
    if (f.dead) continue;
    const d = dist2(p.x, p.y, f.x, f.y);
    if (d < best) { best = d; target = f; }
  }
  if (G.boss && G.boss.mode === 'fight' && G.boss.solid) {
    const d = dist2(p.x, p.y, G.boss.x, G.boss.y);
    if (d < best) target = G.boss;
  }
  return target;
}

function gameOver() {
  G.screen = 'over';
  if (G.score > save.best) { save.best = G.score; }
  if (G.stage > (save.bestStage || 1)) save.bestStage = G.stage;
  if (G.stage > 1) save.checkpoint = G.stage;      // "continue" brings you back here
  save.orbsAll += G.orbCount;
  // anything that just crossed its unlock line, and hasn't been celebrated yet
  if (!save.seen) save.seen = [];
  G.newUnlocks = LOTLS.filter(l => l.unlock && isUnlocked(l) && save.seen.indexOf(l.id) < 0);
  for (const l of G.newUnlocks) save.seen.push(l.id);
  persist();
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt) {
  G.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 0.8);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > 130) G.banner = null; }

  // background bubbles everywhere, always
  if (G.bgBubbles.length < 40) {
    G.bgBubbles.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(4, 16), s: rnd(0.3, 1.1), a: rnd(0.08, 0.3), ph: rnd(0, TAU) });
  }
  for (const b of G.bgBubbles) {
    b.y -= b.s * dt; b.x += Math.sin((G.t + b.ph) * 0.02) * 0.3 * dt;
    if (b.y < -20) { b.y = H + 20; b.x = rnd(0, W); }
  }

  if (G.screen !== 'play') return;

  G.tick++;
  if (!G.training) G.stageTimer += dt;   // no stage clock in training, so no boss

  // combo only survives if you keep the chain going
  if (G.combo > 0) {
    G.comboTimer -= dt;
    if (G.comboTimer <= 0) { G.combo = 0; G.comboTimer = 0; }
  }
  if (!G.boss && G.stageTimer > STAGE_LEN) spawnBoss();
  director();
  updateBoss(dt);
  updateHazards(dt);

  /* players */
  for (const p of G.players) {
    if (!p.alive) {
      // co-op revive: a downed lotl floats back after a bit
      if (G.players.length > 1) {
        p.downTimer += dt;
        if (p.downTimer > 60 * 8) { p.alive = true; p.health = 35; p.inv = 140; p.x = 150; p.y = H / 2; p.tx = p.x; p.ty = p.y; floatText(p.x, p.y - 60, "I'm back!", '#fff'); }
      }
      continue;
    }
    keyboardDrive(p, dt);
    if (G.training) p.health = Math.min(p.maxHealth, p.health + TRAINING_REGEN * dt);
    p.inv = Math.max(0, p.inv - dt);
    p.bob += 0.06 * dt;

    // swim toward the finger
    const ease = 0.16;
    p.vx = (p.tx - p.x) * ease;
    p.vy = (p.ty - p.y) * ease;
    const sp = Math.hypot(p.vx, p.vy), MAX = 15;
    if (sp > MAX) { p.vx = p.vx / sp * MAX; p.vy = p.vy / sp * MAX; }
    p.x = clamp(p.x + p.vx * dt, 40, W - 40);
    p.y = clamp(p.y + p.vy * dt, 46, H - 120);
    p.tail = sp;
    p.aimTimer = Math.max(0, p.aimTimer - dt);
    p.aimTarget = p.aimTimer > 0 ? findAutoTarget(p) : null;

    // Shots always go forward — one rule small hands can hold on to.
    // The target pickup is the only thing that ever aims for you.
    p.cool -= dt;
    if (p.cool <= 0) {
      p.cool = 15;
      const c = p.lotl;
      let dx = 1, dy = 0;
      if (p.aimTarget) {
        dx = p.aimTarget.x - p.x;
        dy = p.aimTarget.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        dx /= d; dy /= d;
      }
      G.bullets.push({ x: p.x + dx * 34, y: p.y + dy * 34, vx: dx * 15, vy: dy * 15,
        r: 10, dmg: 1, owner: p, kind: 'trident', life: 140, color: shotColor(c) });
      Snd.shoot();
    }

    // orbs / pickups
    for (let i = G.orbs.length - 1; i >= 0; i--) {
      const o = G.orbs[i];
      if (dist2(o.x, o.y, p.x, p.y) < (o.r + p.r + 14) ** 2) {
        G.orbs.splice(i, 1);
        collectOrb(p, o.x, o.y);
      }
    }
    for (let i = G.pickups.length - 1; i >= 0; i--) {
      const k = G.pickups[i];
      if (dist2(k.x, k.y, p.x, p.y) < (k.r + p.r + 10) ** 2) {
        G.pickups.splice(i, 1);
        if (k.type === 'heart') {
          if (p.health < p.maxHealth) {
            p.health = Math.min(p.maxHealth, p.health + HEAL_AMOUNT);
            floatText(p.x, p.y - 60, '+' + HEAL_AMOUNT + ' HP', '#ff4d6d');
          }
          else { G.score += 100; floatText(p.x, p.y - 60, '+100', '#ffd166'); }
          Snd.heal();
        } else if (k.type === 'target') {
          p.aimTimer = AUTO_AIM_TIME;
          floatText(p.x, p.y - 60, 'AUTO-AIM!', '#3aa0ff');
          ring(p.x, p.y, '#3aa0ff', 150);
          Snd.power();
        }
      }
    }

    // touching a foe
    for (const f of G.foes) {
      if (f.dead) continue;
      if (dist2(f.x, f.y, p.x, p.y) < (f.r + p.r - 8) ** 2) { hurtPlayer(p); hurtFoe(f, 2, p); }
    }
    if (G.boss && G.boss.mode === 'fight' && G.boss.solid && dist2(G.boss.x, G.boss.y, p.x, p.y) < (G.boss.r + p.r - 20) ** 2) hurtPlayer(p);
  }

  // the hit that ended the run also ends this tick — nothing should score after it
  if (G.screen !== 'play') return;

  /* magnet: orbs drift toward the nearest lotl */
  for (const o of G.orbs) {
    let best = null, bd = 190 * 190;
    for (const p of G.players) {
      if (!p.alive) continue;
      const d = dist2(o.x, o.y, p.x, p.y);
      if (d < bd) { bd = d; best = p; }
    }
    if (best) {
      const d = Math.sqrt(bd) || 1;
      o.vx += ((best.x - o.x) / d) * 0.55 * dt;
      o.vy += ((best.y - o.y) / d) * 0.55 * dt;
    }
  }

  /* bullets */
  for (let i = G.bullets.length - 1; i >= 0; i--) {
    const b = G.bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    let gone = b.life <= 0 || b.x > W + 60 || b.x < -60 || b.y < -60 || b.y > H + 60;
    if (!gone && b.maxDist && dist2(b.x, b.y, b.startX, b.startY) > b.maxDist ** 2) gone = true;
    if (!gone) {
      for (const f of G.foes) {
        if (f.dead) continue;
        if (dist2(b.x, b.y, f.x, f.y) < (b.r + f.r) ** 2) { hurtFoe(f, b.dmg, b.owner); gone = true; break; }
      }
    }
    if (!gone && G.boss && G.boss.mode === 'fight' && G.boss.solid && dist2(b.x, b.y, G.boss.x, G.boss.y) < (b.r + G.boss.r * 0.8) ** 2) {
      hurtBoss(b.dmg, b.owner);
      boom(b.x, b.y, '#ffd166', 3);
      gone = true;
    }
    if (gone) G.bullets.splice(i, 1);
  }

  /* enemy bullets */
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const b = G.ebullets[i];
    b.t = (b.t || 0) + dt;
    if (b.ax) b.vx += b.ax * dt;          // boomerang claws, falling icicles
    if (b.ay) b.vy += b.ay * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.wave) b.y += Math.cos(b.t * b.wave) * b.amp * dt;   // wobbly jelly shots
    let gone = b.x < -60 || b.x > W + 90 || b.y < -60 || b.y > H + 60 || (b.life && b.t > b.life);
    if (b.kind === 'icicle' && b.y > H - 112) { boom(b.x, b.y, '#dff8ff', 10); gone = true; }
    if (!gone) for (const p of G.players) {
      if (p.alive && dist2(b.x, b.y, p.x, p.y) < (b.r + p.r - 6) ** 2) { hurtPlayer(p); gone = true; break; }
    }
    if (gone) G.ebullets.splice(i, 1);
  }

  /* foes */
  for (let i = G.foes.length - 1; i >= 0; i--) {
    const f = G.foes[i];
    f.t += dt; f.flash = Math.max(0, f.flash - dt);
    f.x -= f.speed * dt;
    if (!f.baseY) f.baseY = f.y;
    if (f.kind === 'blob' || f.kind === 'jelly') f.y = f.baseY + Math.sin((f.t + f.phase * 30) * 0.04) * f.amp;
    else if (f.kind === 'spiker') {
      const tgt = livingPlayers()[0];
      if (tgt) f.y += clamp((tgt.y - f.y) * 0.012, -2.2, 2.2) * dt;
    } else if (f.kind === 'puffer') {
      f.y = f.baseY + Math.sin(f.t * 0.02) * 40;
      f.fireAt -= dt;
      if (f.fireAt <= 0 && f.x < W - 40) {
        f.fireAt = 110;
        const tgt = livingPlayers()[0];
        const a = tgt ? Math.atan2(tgt.y - f.y, tgt.x - f.x) : Math.PI;
        G.ebullets.push({ x: f.x - 20, y: f.y, vx: Math.cos(a) * 4.4, vy: Math.sin(a) * 4.4, r: 12, kind: 'ink' });
        Snd.blip(200, 0.08, 'square', 0.05);
      }
    }
    f.y = clamp(f.y, 60, H - 150);
    if (f.dead || f.x < -80) G.foes.splice(i, 1);
  }

  /* orbs move */
  for (let i = G.orbs.length - 1; i >= 0; i--) {
    const o = G.orbs[i];
    o.t += dt;
    o.x += o.vx * dt; o.y += o.vy * dt + Math.sin((o.t + o.phase * 20) * 0.05) * 0.5 * dt;
    o.vx *= 0.995; o.vy *= 0.98;
    if (o.x < -50) G.orbs.splice(i, 1);
  }
  for (let i = G.pickups.length - 1; i >= 0; i--) {
    const k = G.pickups[i]; k.t += dt; k.x -= 1.8 * dt;
    k.y += Math.sin((k.t + k.phase * 20) * 0.05) * 0.6 * dt;
    if (k.x < -50) G.pickups.splice(i, 1);
  }

  /* fx */
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const e = G.fx[i]; e.t += dt;
    if (e.kind === 'dot') { e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= 0.94; e.vy = e.vy * 0.94 + 0.12 * dt; }
    if (e.kind === 'text') e.y -= 0.9 * dt;
    if (e.t >= e.life) G.fx.splice(i, 1);
  }

  if (G.training) updateCoach(dt);
}

/* ============================================================
   DRAWING — crayon-ish, on purpose
   ============================================================ */
function wobbleCircle(x, y, r, seed) {
  ctx.beginPath();
  const steps = 18;
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * TAU;
    const w = 1 + Math.sin(a * 3 + seed) * 0.035 + Math.sin(a * 5 - seed) * 0.025;
    const px = x + Math.cos(a) * r * w, py = y + Math.sin(a) * r * w;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawLotl(x, y, r, c, opts) {
  const o = opts || {};
  const t = o.t || 0;
  const flip = o.flip ? -1 : 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip, 1);
  if (o.tilt) ctx.rotate(o.tilt);

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const ink = '#20141f';

  // tail
  const wag = Math.sin(t * 0.12) * 0.35;
  ctx.save(); ctx.rotate(wag * 0.25);
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(-r * 0.5, -r * 0.15);
  ctx.quadraticCurveTo(-r * 1.7, -r * 0.9, -r * 2.05, -r * 0.1);
  ctx.quadraticCurveTo(-r * 1.7, r * 0.85, -r * 0.5, r * 0.25);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = r * 0.09; ctx.stroke();
  ctx.restore();

  // gill fronds (the frilly bits — most important part of a lotl)
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      // fronds fan off the top and bottom of the head, like the drawing
      const base = side * (Math.PI / 2) + (i - 1) * 0.46 * side;
      const wig = Math.sin(t * 0.11 + i * 1.3 + (side > 0 ? 1 : 0)) * 0.12;
      const bx = Math.cos(base) * r * 0.7, by = Math.sin(base) * r * 0.7;
      const len = r * (0.9 - Math.abs(i - 1) * 0.12);
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(base + wig);
      ctx.strokeStyle = c.gill; ctx.lineWidth = r * 0.14; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(len * 0.55, len * 0.22, len, 0); ctx.stroke();
      ctx.fillStyle = c.gill;
      ctx.beginPath(); ctx.arc(len, 0, r * 0.16, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  // legs
  ctx.strokeStyle = ink; ctx.lineWidth = r * 0.11;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(-r * 0.1, s * r * 0.55);
    ctx.lineTo(-r * 0.35, s * r * 0.95 + Math.sin(t * 0.1 + s) * 2);
    ctx.stroke();
  }

  // body
  ctx.fillStyle = c.body;
  wobbleCircle(0, 0, r, o.seed || 1);
  ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = r * 0.1; ctx.stroke();

  // cheek blush
  ctx.fillStyle = 'rgba(255,120,160,0.35)';
  ctx.beginPath(); ctx.ellipse(r * 0.15, r * 0.3, r * 0.22, r * 0.14, 0, 0, TAU); ctx.fill();

  // eyes — the little square eyes from the drawing.
  // A dark-faced lotl carries its own light `eye` colour so the face still reads.
  const eyeInk = c.eye || ink;
  ctx.fillStyle = eyeInk;
  for (const s of [-1, 1]) {
    const ey = s * r * 0.3, ex = r * 0.32;
    ctx.save(); ctx.translate(ex, ey);
    ctx.beginPath();
    const ew = r * 0.24, eh = r * 0.2;
    ctx.roundRect ? ctx.roundRect(-ew / 2, -eh / 2, ew, eh, r * 0.05) : ctx.rect(-ew / 2, -eh / 2, ew, eh);
    ctx.fill();
    ctx.fillStyle = c.eye ? ink : '#fff';
    ctx.beginPath(); ctx.arc(ew * 0.18, -eh * 0.18, r * 0.05, 0, TAU); ctx.fill();
    ctx.fillStyle = eyeInk;
    ctx.restore();
  }
  // smile
  ctx.strokeStyle = eyeInk; ctx.lineWidth = r * 0.07;
  ctx.beginPath(); ctx.arc(r * 0.5, 0, r * 0.24, -0.7, 0.7); ctx.stroke();

  // trident
  if (o.trident) {
    ctx.save();
    ctx.translate(r * 0.95, r * 0.5); ctx.rotate(-0.35 + Math.sin(t * 0.08) * 0.05);
    ctx.strokeStyle = '#6b5b4a'; ctx.lineWidth = r * 0.11;
    ctx.beginPath(); ctx.moveTo(-r * 0.4, r * 0.5); ctx.lineTo(r * 0.75, -r * 0.35); ctx.stroke();
    ctx.strokeStyle = '#d9d2c7'; ctx.lineWidth = r * 0.1;
    for (const k of [-1, 0, 1]) {
      ctx.beginPath();
      ctx.moveTo(r * 0.6, -r * 0.2);
      ctx.lineTo(r * 0.6 + r * 0.36 + k * r * 0.05, -r * 0.25 + k * r * 0.32);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

const STAGE_THEMES = [
  { name: 'VOLCANO', top: '#41235f', mid: '#d85b55', bottom: '#ffd08a', ink: '#76283b', bubble: '#ffd0a8', ground: ['#ff6b57', '#a41f2e'] },
  { name: 'JUNGLE', top: '#0d684f', mid: '#65bd65', bottom: '#cce98a', ink: '#165c3a', bubble: '#b7ffd2', ground: ['#3b9952', '#174f36'] },
  { name: 'DESERT', top: '#58b9d4', mid: '#f4c978', bottom: '#ffe9ad', ink: '#a96032', bubble: '#fff1bd', ground: ['#e7a75e', '#a85d38'] },
  { name: 'ICE CAVE', top: '#183f78', mid: '#72c7df', bottom: '#dffaff', ink: '#296f9b', bubble: '#e8ffff', ground: ['#8fe2ee', '#3978ad'] },
  { name: 'DEEP SEA', top: '#0b1640', mid: '#1f4a86', bottom: '#5b93c4', ink: '#0a1a3a', bubble: '#9fd8ff', ground: ['#2f5a8a', '#0f2244'] },
  { name: 'CANDY REEF', top: '#ff8fc8', mid: '#ffc4e3', bottom: '#fff1f8', ink: '#c2457f', bubble: '#ffffff', ground: ['#ff9ed2', '#d0548f'] },
  { name: 'SHIPWRECK', top: '#15302d', mid: '#2f6b60', bottom: '#9cc9ad', ink: '#0f2a26', bubble: '#cfffe8', ground: ['#c9b37a', '#6b5a32'] },
  { name: 'STORM SEA', top: '#1a1030', mid: '#4b3a7a', bottom: '#a99de0', ink: '#1a1030', bubble: '#d8ccff', ground: ['#5b4a8f', '#231a45'] }
];

function stageTheme(stage) {
  return STAGE_THEMES[((stage || G.stage) - 1) % STAGE_THEMES.length];
}

function drawThemeGround(theme, top) {
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, top);
  for (let x = 0; x <= W; x += 24) {
    ctx.lineTo(x, top + Math.sin(x * 0.014 + G.t * 0.025) * 9 + Math.sin(x * 0.031 - G.t * 0.018) * 4);
  }
  ctx.lineTo(W, H); ctx.closePath();
  const gg = ctx.createLinearGradient(0, top - 20, 0, H);
  gg.addColorStop(0, theme.ground[0]); gg.addColorStop(1, theme.ground[1]);
  ctx.fillStyle = gg; ctx.fill(); ctx.clip();
  ctx.globalAlpha = 0.22; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const y = top + 14 + i * 14, off = (G.t * (0.5 + i * 0.06)) % (W + 260) - 130;
    ctx.beginPath(); ctx.moveTo(off - 150, y); ctx.lineTo(off + 150, y + Math.sin(i) * 4); ctx.stroke();
  }
  ctx.restore();
}

function drawBackground() {
  const theme = stageTheme();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, theme.top); g.addColorStop(0.52, theme.mid); g.addColorStop(1, theme.bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (theme.name === 'VOLCANO') {
    // distant volcano, crater glow, and drifting smoke
    ctx.fillStyle = '#5a263d';
    ctx.beginPath(); ctx.moveTo(W * 0.54, H - 108); ctx.lineTo(W * 0.73, 205); ctx.lineTo(W * 0.91, H - 108); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff9d3d'; ctx.beginPath(); ctx.ellipse(W * 0.73, 215, 48, 13, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ff713d'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(W * 0.73, 230); ctx.lineTo(W * 0.68, 390); ctx.lineTo(W * 0.64, H - 108); ctx.stroke();
    for (let i = 0; i < 5; i++) {
      ctx.globalAlpha = 0.22 - i * 0.025; ctx.fillStyle = '#ead8df';
      ctx.beginPath(); ctx.arc(W * 0.73 + Math.sin(G.t * 0.01 + i) * 20, 170 - i * 30, 24 + i * 7, 0, TAU); ctx.fill();
    }
  } else if (theme.name === 'JUNGLE') {
    // leafy canopy, trunks, and dangling vines
    ctx.fillStyle = 'rgba(17,75,44,0.58)';
    for (let x = -40; x < W + 60; x += 95) {
      ctx.beginPath(); ctx.arc(x, 25 + Math.sin(x) * 15, 72, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(69,66,38,0.45)';
    for (let x = 80; x < W; x += 310) ctx.fillRect(x, 0, 28, H - 105);
    ctx.strokeStyle = '#236b3b'; ctx.lineWidth = 10; ctx.lineCap = 'round';
    for (let x = 150; x < W; x += 260) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.bezierCurveTo(x - 30, 100, x + 55, 150, x + Math.sin(G.t * 0.02 + x) * 30, 260); ctx.stroke();
    }
  } else if (theme.name === 'DESERT') {
    // sun, pyramids, and rolling dunes
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff1a8'; ctx.beginPath(); ctx.arc(W * 0.18, 130, 70, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.32; ctx.fillStyle = '#b86f43';
    for (const [x, size] of [[W * 0.58, 170], [W * 0.77, 125]]) {
      ctx.beginPath(); ctx.moveTo(x - size, H - 105); ctx.lineTo(x, H - 105 - size); ctx.lineTo(x + size, H - 105); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 0.35; ctx.strokeStyle = '#aa6539'; ctx.lineWidth = 7;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(-80, 390 + i * 55); ctx.quadraticCurveTo(W * 0.35, 320 + i * 65, W + 80, 400 + i * 45); ctx.stroke();
    }
  } else if (theme.name === 'DEEP SEA') {
    // light rays from far above, swaying kelp, glowing specks
    ctx.fillStyle = 'rgba(190,230,255,0.08)';
    for (let i = 0; i < 4; i++) {
      const x = W * (0.12 + i * 0.25) + Math.sin(G.t * 0.004 + i) * 30;
      ctx.beginPath(); ctx.moveTo(x - 30, 0); ctx.lineTo(x + 30, 0); ctx.lineTo(x + 150, H - 108); ctx.lineTo(x - 10, H - 108); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(30,110,100,0.75)'; ctx.lineWidth = 14; ctx.lineCap = 'round';
    for (let x = 60; x < W; x += 210) {
      ctx.beginPath(); ctx.moveTo(x, H - 100);
      for (let y = H - 100; y > H - 360 - (x * 7 % 120); y -= 30) ctx.lineTo(x + Math.sin(y * 0.02 + G.t * 0.03 + x) * 18, y);
      ctx.stroke();
    }
    for (let i = 0; i < 28; i++) {
      const x = (i * 157 + G.t * 0.2) % W, y = (i * 89) % (H - 160) + 20;
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(G.t * 0.05 + i);
      ctx.fillStyle = i % 3 ? '#7ff5ff' : '#d9a6ff';
      ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, TAU); ctx.fill();
    }
  } else if (theme.name === 'CANDY REEF') {
    // lollipop corals, candy-cane branches, and sprinkles
    ctx.lineCap = 'round';
    for (const [fx, fy, r, c] of [[0.1, 0.5, 46, '#ff5fa2'], [0.32, 0.62, 34, '#7ad3ff'], [0.6, 0.46, 54, '#ffd166'], [0.85, 0.58, 40, '#b07bff']]) {
      const x = W * fx, y = H * fy;
      ctx.globalAlpha = 0.75; ctx.strokeStyle = '#fff'; ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, H - 100); ctx.stroke();
      ctx.globalAlpha = 0.55; ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 6;
      ctx.beginPath();
      for (let a = 0; a < TAU * 2.2; a += 0.2) {
        const rr = r * a / (TAU * 2.3);
        const px = x + Math.cos(a + G.t * 0.01) * rr, py = y + Math.sin(a + G.t * 0.01) * rr;
        a ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 0.5;
    for (const x of [W * 0.22, W * 0.72]) {
      for (const [col, off] of [['#fff', 0], ['#ff4d6d', 14]]) {
        ctx.strokeStyle = col; ctx.lineWidth = 14; ctx.setLineDash([14, 14]); ctx.lineDashOffset = off;
        ctx.beginPath(); ctx.moveTo(x, H - 100); ctx.lineTo(x, H - 300); ctx.arc(x + 40, H - 300, 40, Math.PI, 0); ctx.stroke();
      }
    }
    ctx.setLineDash([]);
    const sprinkles = ['#ff5fa2', '#7ad3ff', '#ffd166', '#9be36b', '#b07bff'];
    for (let i = 0; i < 30; i++) {
      const x = (i * 211 + G.t * 0.3) % W, y = (i * 67) % (H - 170) + 20, a = i + G.t * 0.02;
      ctx.globalAlpha = 0.6; ctx.strokeStyle = sprinkles[i % 5]; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * 6, y - Math.sin(a) * 6); ctx.lineTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6); ctx.stroke();
    }
  } else if (theme.name === 'SHIPWRECK') {
    // a sunken pirate ship, tilted on the sea floor, and a treasure chest
    ctx.save(); ctx.translate(W * 0.62, H - 130); ctx.rotate(-0.1);
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#3a2a1c';
    ctx.beginPath(); ctx.moveTo(-280, -70); ctx.lineTo(260, -90); ctx.lineTo(200, 40); ctx.lineTo(-220, 40); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(20,12,6,0.6)'; ctx.lineWidth = 4;
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(-260 + k * 15, -40 + k * 28); ctx.lineTo(240 - k * 18, -58 + k * 28); ctx.stroke(); }
    ctx.fillStyle = 'rgba(160,220,200,0.5)';
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(-150 + k * 100, -45 - k * 3, 11, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(-30, -390, 18, 310);
    ctx.fillStyle = 'rgba(230,230,210,0.35)';
    ctx.beginPath(); ctx.moveTo(-12, -370); ctx.lineTo(150, -340); ctx.lineTo(120, -300); ctx.lineTo(150, -260);
    ctx.lineTo(110, -230); ctx.lineTo(130, -190); ctx.lineTo(-12, -170); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(W * 0.18, H - 125);
    ctx.globalAlpha = 0.8; ctx.fillStyle = '#7a4a22'; ctx.fillRect(-40, -34, 80, 40);
    ctx.fillStyle = '#5a3416'; ctx.beginPath(); ctx.ellipse(0, -34, 40, 18, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.fillRect(-6, -30, 12, 14);
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(G.t * 0.07);
    ctx.fillStyle = '#fff6b0'; ctx.beginPath(); ctx.arc(22, -50, 5, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (theme.name === 'STORM SEA') {
    // the Shadow Lotl's castle on the horizon, and lightning now and then
    ctx.fillStyle = 'rgba(20,10,40,0.55)';
    const cx = W * 0.72, base = H - 105;
    ctx.fillRect(cx - 160, base - 170, 320, 170);
    for (const [tx, tw, th] of [[-200, 70, 290], [130, 70, 310], [-35, 70, 360]]) {
      ctx.fillRect(cx + tx, base - th, tw, th);
      ctx.beginPath(); ctx.moveTo(cx + tx - 10, base - th); ctx.lineTo(cx + tx + tw / 2, base - th - 70); ctx.lineTo(cx + tx + tw + 10, base - th); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,92,240,' + (0.5 + 0.3 * Math.sin(G.t * 0.05)) + ')';
    for (const [wx, wy] of [[-170, -220], [160, -240], [0, -300], [-60, -110], [60, -110]]) ctx.fillRect(cx + wx, base + wy, 14, 22);
    const ft = G.t % 300;
    if (ft < 14) {
      ctx.globalAlpha = (14 - ft) / 14 * 0.4; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = (14 - ft) / 14; ctx.strokeStyle = '#fffbe6'; ctx.lineWidth = 5;
      const bx = W * (0.2 + ((G.t / 300 | 0) * 0.37) % 0.6);
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx - 30, 90); ctx.lineTo(bx + 10, 120); ctx.lineTo(bx - 20, 230); ctx.stroke();
    }
  } else {
    // icy ceiling and crystal pillars
    ctx.fillStyle = 'rgba(216,251,255,0.70)';
    for (let x = 0; x < W; x += 90) {
      const len = 55 + (x * 17 % 95);
      ctx.beginPath(); ctx.moveTo(x - 32, 0); ctx.lineTo(x, len); ctx.lineTo(x + 35, 0); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(181,244,255,0.42)';
    for (let x = 120; x < W; x += 260) {
      ctx.beginPath(); ctx.moveTo(x - 38, H - 105); ctx.lineTo(x, H - 270); ctx.lineTo(x + 46, H - 105); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore(); ctx.globalAlpha = 1;

  // common crayon texture and stage-colored bubbles
  ctx.save(); ctx.globalAlpha = 0.07; ctx.strokeStyle = theme.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    const y = (i * 57 + (G.t * 0.12) % 57) % (H * 0.68);
    ctx.beginPath(); ctx.moveTo(0, y);
    for (let x = 0; x <= W; x += 90) ctx.lineTo(x, y + Math.sin((x + i * 40 + G.t * 0.4) * 0.01) * 7);
    ctx.stroke();
  }
  ctx.restore();
  for (const b of G.bgBubbles) {
    ctx.globalAlpha = b.a; ctx.fillStyle = theme.bubble;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawThemeGround(theme, H - 108);
}

function drawFoe(f) {
  const k = FOE_KINDS[f.kind];
  ctx.save();
  ctx.translate(f.x, f.y);
  if (f.flash > 0) ctx.globalAlpha = 0.6;
  ctx.lineJoin = 'round';
  if (f.kind === 'spiker') {
    ctx.fillStyle = k.color;
    ctx.beginPath();
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * TAU, rr = f.r * (i % 2 ? 1.32 : 0.86);
      const px = Math.cos(a + f.t * 0.02) * rr, py = Math.sin(a + f.t * 0.02) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = k.dark; ctx.lineWidth = 4; ctx.stroke();
  } else if (f.kind === 'jelly') {
    ctx.strokeStyle = k.color; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const x0 = -f.r * 0.1 + i * 0.1 * f.r, y0 = -f.r * 0.6 + i * f.r * 0.4;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(f.r * 1.2, y0 + Math.sin(f.t * 0.15 + i) * 8); ctx.stroke();
    }
    ctx.fillStyle = f.flash > 0 ? '#fff' : k.color;
    ctx.beginPath(); ctx.ellipse(0, 0, f.r, f.r * 0.85, 0, Math.PI / 2, Math.PI * 1.5); ctx.lineTo(f.r * 0.25, -f.r * 0.85);
    ctx.quadraticCurveTo(f.r * 0.45, 0, f.r * 0.25, f.r * 0.85); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = k.dark; ctx.lineWidth = 4; ctx.stroke();
  } else {
    ctx.fillStyle = f.flash > 0 ? '#fff' : k.color;
    wobbleCircle(0, 0, f.r, f.phase);
    ctx.fill();
    ctx.strokeStyle = k.dark; ctx.lineWidth = 5; ctx.stroke();
    if (f.kind === 'blob') {
      ctx.fillStyle = 'rgba(255,220,120,0.55)';
      ctx.beginPath(); ctx.arc(-f.r * 0.2, -f.r * 0.25, f.r * 0.32, 0, TAU); ctx.fill();
    }
  }
  // angry face
  ctx.fillStyle = '#1a0f1a';
  for (const s of [-1, 1]) {
    ctx.save(); ctx.translate(-f.r * 0.28, s * f.r * 0.26); ctx.rotate(s * 0.4);
    ctx.fillRect(-6, -4, 13, 8);
    ctx.restore();
  }
  ctx.strokeStyle = '#1a0f1a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-f.r * 0.45, f.r * 0.02, f.r * 0.3, 2.5, 3.9); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- boss art: each draw is called inside save/restore ---------- */
function drawCrown(x, y, w, color) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = color || '#ffd166'; ctx.strokeStyle = '#7a4a00'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  const h = w * 0.55;
  ctx.beginPath();
  ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, -h * 0.65); ctx.lineTo(-w / 4, -h * 0.3); ctx.lineTo(0, -h);
  ctx.lineTo(w / 4, -h * 0.3); ctx.lineTo(w / 2, -h * 0.65); ctx.lineTo(w / 2, 0); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(0, -h * 0.32, w * 0.08, 0, TAU); ctx.fill();
  ctx.restore();
}

// a crab pincer pointing along +x, opening by `open` radians
function drawClaw(x, y, s, ang, open, color, ink) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = color; ctx.strokeStyle = ink; ctx.lineWidth = Math.max(3, s * 0.11); ctx.lineJoin = 'round';
  for (const sd of [-1, 1]) {
    ctx.save(); ctx.rotate(sd * open);
    ctx.beginPath();
    ctx.moveTo(s * 0.1, sd * s * 0.05);
    ctx.quadraticCurveTo(s * 0.7, sd * s * 0.75, s * 1.2, sd * s * 0.1);
    ctx.lineTo(s * 0.5, sd * s * 0.06);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.55, s * 0.45, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawMagma(b) {
  const t = b.t;
  ctx.translate(b.x, b.y);
  ctx.fillStyle = 'rgba(255,90,54,0.22)';
  ctx.beginPath(); ctx.arc(0, 0, b.r * 1.45 + Math.sin(t * 0.05) * 8, 0, TAU); ctx.fill();
  const colors = { body: b.flash > 0 ? '#ffffff' : '#c0392b', fin: '#ff7a3d', gill: '#ffcc4d' };
  drawLotl(0, 0, b.r, colors, { t, flip: true, seed: 7, trident: false });
  // crown of spikes
  ctx.strokeStyle = '#ffcc4d'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 26, -b.r * 0.85);
    ctx.lineTo(i * 30, -b.r * 1.3 - Math.abs(i) * -6 + Math.sin(t * 0.08 + i) * 4);
    ctx.stroke();
  }
}

function drawCroak(b) {
  const r = b.r, t = b.t, hit = b.flash > 0, s = b.s;
  const ink = '#1d3315';
  ctx.translate(b.x, b.y);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const hop = s.phase === 'hop' ? Math.sin(Math.PI * Math.min(1, s.t / 38)) : 0;
  ctx.scale(1 - hop * 0.08, 1 + hop * 0.12);
  // back legs, folded behind (it faces left)
  for (const sd of [-1, 1]) {
    ctx.fillStyle = hit ? '#fff' : '#3f9a3a';
    ctx.beginPath(); ctx.ellipse(r * 0.6, sd * r * 0.55, r * 0.55, r * 0.3, sd * 0.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = 6; ctx.stroke();
  }
  // body + belly
  ctx.fillStyle = hit ? '#fff' : '#58c24f';
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.05, r * 0.82, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = 7; ctx.stroke();
  ctx.fillStyle = hit ? '#fff' : '#d8f59a';
  ctx.beginPath(); ctx.ellipse(-r * 0.2, r * 0.34, r * 0.62, r * 0.38, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(30,90,30,0.5)';
  for (const [sx, sy, sr] of [[0.35, -0.3, 0.14], [0.65, 0.05, 0.1], [0.12, -0.5, 0.08], [0.5, -0.55, 0.07]]) {
    ctx.beginPath(); ctx.arc(sx * r, sy * r, sr * r, 0, TAU); ctx.fill();
  }
  // front feet
  ctx.fillStyle = hit ? '#fff' : '#3f9a3a';
  for (const fx of [-0.6, -0.15]) { ctx.beginPath(); ctx.ellipse(fx * r, r * 0.8, r * 0.2, r * 0.1, 0, 0, TAU); ctx.fill(); ctx.stroke(); }
  // big eyes on top, looking at you
  for (const ex of [-0.6, -0.08]) {
    ctx.fillStyle = hit ? '#fff' : '#58c24f';
    ctx.beginPath(); ctx.arc(ex * r, -r * 0.7, r * 0.28, 0, TAU); ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = 6; ctx.stroke();
    ctx.fillStyle = '#fff8d6'; ctx.beginPath(); ctx.arc(ex * r, -r * 0.72, r * 0.19, 0, TAU); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex * r - r * 0.07, -r * 0.7, r * 0.09, 0, TAU); ctx.fill();
    if (b.angry) {
      ctx.strokeStyle = ink; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(ex * r - r * 0.24, -r * 1.02); ctx.lineTo(ex * r + r * 0.2, -r * 0.9); ctx.stroke();
    }
  }
  // mouth: a wide grin, wide open while the tongue is out
  ctx.strokeStyle = ink; ctx.lineWidth = 6;
  if (s.phase === 'lick') {
    ctx.fillStyle = '#7a1630';
    ctx.beginPath(); ctx.ellipse(-r * 0.66, r * 0.18, r * 0.22, r * 0.2, 0, 0, TAU); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-r * 0.98, r * 0.06); ctx.quadraticCurveTo(-r * 0.45, r * 0.36, r * 0.1, r * 0.1); ctx.stroke();
  }
}

function drawPinch(b) {
  const r = b.r, t = b.t, hit = b.flash > 0, out = b.s.clawsOut > 0;
  const ink = '#4a1a0a', shell = hit ? '#fff' : '#e8552f', light = hit ? '#fff' : '#ff9a6b';
  ctx.translate(b.x, b.y);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // legs, scuttling
  for (const sd of [-1, 1]) for (let i = 0; i < 3; i++) {
    const lx = sd * r * (0.35 + i * 0.22), w = Math.sin(t * 0.3 + i * 1.7 + sd) * 7;
    ctx.strokeStyle = ink; ctx.lineWidth = 15;
    ctx.beginPath(); ctx.moveTo(lx, r * 0.3); ctx.lineTo(lx + sd * r * 0.25, r * 0.62 + w); ctx.lineTo(lx + sd * r * 0.32, r * 0.95); ctx.stroke();
    ctx.strokeStyle = shell; ctx.lineWidth = 9; ctx.stroke();
  }
  // arms up, claws on top (stubs while they are out flying)
  for (const sd of [-1, 1]) {
    ctx.strokeStyle = ink; ctx.lineWidth = 19;
    ctx.beginPath(); ctx.moveTo(sd * r * 0.7, -r * 0.1); ctx.lineTo(sd * r * 1.0, -r * 0.55); ctx.stroke();
    ctx.strokeStyle = shell; ctx.lineWidth = 12; ctx.stroke();
    if (!out) drawClaw(sd * r * 1.02, -r * 0.7, r * 0.45, -Math.PI / 2 - sd * 0.35, 0.25 + Math.sin(t * 0.12 + sd) * 0.2, shell, ink);
  }
  // shell
  ctx.fillStyle = shell;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.95, r * 0.6, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = 7; ctx.stroke();
  ctx.fillStyle = light;
  ctx.beginPath(); ctx.ellipse(-r * 0.2, -r * 0.2, r * 0.42, r * 0.18, -0.2, 0, TAU); ctx.fill();
  // eyes on stalks
  for (const sd of [-1, 1]) {
    ctx.strokeStyle = ink; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(sd * r * 0.25, -r * 0.45); ctx.lineTo(sd * r * 0.32, -r * 0.82); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(sd * r * 0.32, -r * 0.88, r * 0.15, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(sd * r * 0.32 - r * 0.05, -r * 0.88, r * 0.065, 0, TAU); ctx.fill();
  }
  // grumpy mouth
  ctx.strokeStyle = ink; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(0, r * 0.3, r * 0.22, -2.5, -0.64); ctx.stroke();
  drawCrown(0, -r * 1.02, r * 0.5);
}

function drawPuff(b) {
  const r = b.r, t = b.t, hit = b.flash > 0, puff = clamp((r - 70) / 42, 0, 1);
  const ink = '#1d4a6b';
  ctx.translate(b.x + (b.s.phase === 'inflate' ? Math.sin(t * 1.7) * 3 * puff : 0), b.y);
  ctx.lineJoin = 'round';
  // tail fin, on the right
  ctx.fillStyle = hit ? '#fff' : '#7cc8ef'; ctx.strokeStyle = ink; ctx.lineWidth = 5;
  const wag = Math.sin(t * 0.15) * 8;
  ctx.beginPath(); ctx.moveTo(r * 0.85, 0); ctx.lineTo(r * 1.4, -r * 0.42 + wag); ctx.lineTo(r * 1.4, r * 0.42 + wag); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // spikes grow as it puffs
  ctx.fillStyle = hit ? '#fff' : '#e8fbff'; ctx.lineWidth = 3;
  const n = 22, len = 8 + puff * 26;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.1) * r * 0.96, Math.sin(a - 0.1) * r * 0.96);
    ctx.lineTo(Math.cos(a) * (r + len), Math.sin(a) * (r + len));
    ctx.lineTo(Math.cos(a + 0.1) * r * 0.96, Math.sin(a + 0.1) * r * 0.96);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // body
  ctx.fillStyle = hit ? '#fff' : '#a8dcf5';
  wobbleCircle(0, 0, r, 4); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = hit ? '#fff' : '#e3f7ff';
  ctx.beginPath(); ctx.ellipse(-r * 0.1, r * 0.4, r * 0.6, r * 0.38, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(40,110,160,0.35)';
  for (const [sx, sy] of [[0.2, -0.5], [0.5, -0.2], [0.05, -0.15], [0.55, 0.3]]) {
    ctx.beginPath(); ctx.arc(sx * r, sy * r, r * 0.08, 0, TAU); ctx.fill();
  }
  // side fin
  ctx.fillStyle = hit ? '#fff' : '#7cc8ef'; ctx.strokeStyle = ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(r * 0.2, r * 0.15, r * 0.24, r * 0.12, 0.6 + Math.sin(t * 0.2) * 0.3, 0, TAU); ctx.fill(); ctx.stroke();
  // eye and pouty mouth, facing left
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r * 0.42, -r * 0.3, r * 0.22, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-r * 0.5, -r * 0.28, r * 0.1, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-r * 0.47, -r * 0.33, r * 0.035, 0, TAU); ctx.fill();
  if (b.angry) {
    ctx.strokeStyle = ink; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-r * 0.68, -r * 0.6); ctx.lineTo(-r * 0.25, -r * 0.48); ctx.stroke();
  }
  ctx.fillStyle = '#ff7aa0'; ctx.strokeStyle = ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(-r * 0.88, r * 0.05, r * 0.1, r * (0.08 + puff * 0.05), 0, 0, TAU); ctx.fill(); ctx.stroke();
  // cheeks go red when it's about to pop
  ctx.fillStyle = 'rgba(255,90,120,' + (0.15 + puff * 0.45) + ')';
  ctx.beginPath(); ctx.ellipse(-r * 0.55, r * 0.05, r * 0.14, r * 0.09, 0, 0, TAU); ctx.fill();
  // a frosty little ice crown
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#7cc8ef'; ctx.lineWidth = 3;
  for (let i = -2; i <= 2; i++) {
    const cx = i * r * 0.16, top = -r * (1.05 + (2 - Math.abs(i)) * 0.12) - puff * 20;
    ctx.beginPath(); ctx.moveTo(cx - 8, -r * 0.92 - puff * 18); ctx.lineTo(cx, top); ctx.lineTo(cx + 8, -r * 0.92 - puff * 18); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function drawKraken(b) {
  const r = b.r, t = b.t, hit = b.flash > 0;
  const body = hit ? '#fff' : '#9c3fd0', ink = '#2a0c40';
  ctx.translate(b.x, b.y);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // tentacles, curling below
  for (let i = 0; i < 6; i++) {
    const bx = -r * 0.62 + i * r * 0.25;
    const sw = Math.sin(t * 0.05 + i * 1.1) * 30;
    for (const [col, lw] of [[ink, 24], [body, 16]]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(bx, r * 0.35);
      ctx.bezierCurveTo(bx - 20 + sw, r * 0.9, bx - 50 - sw, r * 1.2, bx - 40 + sw * 0.6, r * 1.6);
      ctx.stroke();
    }
  }
  // mantle
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.25, r * 0.82, r * 0.92, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = 7; ctx.stroke();
  ctx.fillStyle = hit ? '#fff' : '#c77dff';
  for (const [sx, sy, sr] of [[0.3, -0.75, 0.13], [-0.3, -0.85, 0.09], [0.5, -0.3, 0.1], [0.05, -1.0, 0.07]]) {
    ctx.beginPath(); ctx.arc(sx * r, sy * r, sr * r, 0, TAU); ctx.fill();
  }
  // big yellow eyes with slit pupils
  for (const ex of [-0.42, 0.12]) {
    ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = ink; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(ex * r, -r * 0.05, r * 0.2, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(ex * r - r * 0.05, -r * 0.05, r * 0.05, r * 0.15, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = 7;
    const tilt = b.angry ? 0.14 : 0.06;
    ctx.beginPath(); ctx.moveTo(ex * r - r * 0.22, -r * (0.3 + tilt)); ctx.lineTo(ex * r + r * 0.2, -r * (0.3 - tilt)); ctx.stroke();
  }
}

function drawJelly(b) {
  const r = b.r, t = b.t, hit = b.flash > 0, s = b.s;
  // sparkles where she is about to pop back in
  if (s.phase === 'appear') {
    ctx.save();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + t * 0.08, d = 30 + (1 - s.t / 36) * 70;
      const x = s.hx + Math.cos(a) * d, y = s.hy + Math.sin(a) * d;
      ctx.beginPath(); ctx.moveTo(x - 8, y); ctx.lineTo(x + 8, y); ctx.moveTo(x, y - 8); ctx.lineTo(x, y + 8); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha *= b.alpha;
  ctx.translate(b.x, b.y + r * 0.35);
  const pulse = Math.sin(t * 0.08);
  // tentacles
  ctx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const x0 = -r * 0.72 + i * r * 0.24;
    ctx.strokeStyle = i % 2 ? 'rgba(255,190,225,0.9)' : 'rgba(255,120,190,0.9)'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(x0, r * 0.15);
    for (let k = 1; k <= 6; k++) ctx.lineTo(x0 + Math.sin(t * 0.09 + i + k * 0.9) * 10, r * 0.15 + k * r * 0.2);
    ctx.stroke();
  }
  // the bell, with a scalloped edge
  const top = -r * (1.1 + pulse * 0.05), wide = r * (1 - pulse * 0.04);
  ctx.fillStyle = hit ? '#fff' : 'rgba(255,120,190,0.92)';
  ctx.beginPath(); ctx.moveTo(-wide, r * 0.15);
  ctx.bezierCurveTo(-wide, top, wide, top, wide, r * 0.15);
  for (let i = 5; i >= 0; i--) {
    const x1 = -wide + (i / 6) * 2 * wide, xm = x1 + wide / 6;
    ctx.quadraticCurveTo(xm, r * 0.38, x1, r * 0.15);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#a3236a'; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.55, r * 0.22, r * 0.12, -0.5, 0, TAU); ctx.fill();
  // face
  ctx.fillStyle = '#3a0f2a';
  for (const ex of [-0.38, 0.12]) {
    ctx.beginPath(); ctx.ellipse(ex * r, -r * 0.25, r * 0.08, r * 0.12, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex * r + 3, -r * 0.3, r * 0.03, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3a0f2a';
  }
  ctx.strokeStyle = '#3a0f2a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  if (b.angry) { ctx.beginPath(); ctx.arc(-r * 0.13, r * 0.05, r * 0.12, -2.6, -0.5); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(-r * 0.13, -r * 0.08, r * 0.12, 0.5, 2.6); ctx.stroke(); }
  drawCrown(-r * 0.05, top + r * 0.15, r * 0.6);
}

function drawShark(b) {
  const r = b.r, t = b.t, hit = b.flash > 0, dash = b.s.phase === 'dash';
  const body = hit ? '#fff' : '#a9d8d0', dark = hit ? '#fff' : '#5f9f98', ink = '#163634';
  ctx.translate(b.x, b.y);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (dash) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 6;
    for (let i = 0; i < 5; i++) {
      const y = (i - 2) * r * 0.25, x = r * 1.3 + (i % 2) * 40;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 120 + i * 20, y); ctx.stroke();
    }
  }
  ctx.globalAlpha *= 0.82 + Math.sin(t * 0.1) * 0.1;   // a ghost — a little see-through
  // ghostly wisps trailing off the tail
  ctx.fillStyle = 'rgba(200,255,240,0.25)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.arc(r * (1.6 + i * 0.35), Math.sin(t * 0.08 + i) * 12, r * (0.22 - i * 0.05), 0, TAU); ctx.fill();
  }
  const wag = Math.sin(t * (dash ? 0.5 : 0.12)) * 10;
  ctx.fillStyle = dark; ctx.strokeStyle = ink; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(r * 0.85, 0); ctx.lineTo(r * 1.55, -r * 0.6 + wag); ctx.lineTo(r * 1.3, 0); ctx.lineTo(r * 1.5, r * 0.5 + wag); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r * 0.1, -r * 0.5); ctx.lineTo(r * 0.3, -r * 1.12); ctx.lineTo(r * 0.5, -r * 0.42); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // body, nose to the left
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(-r * 1.3, r * 0.05);
  ctx.quadraticCurveTo(-r * 1.0, -r * 0.68, r * 0.2, -r * 0.58);
  ctx.quadraticCurveTo(r * 1.05, -r * 0.4, r * 1.0, 0);
  ctx.quadraticCurveTo(r * 1.0, r * 0.5, 0, r * 0.55);
  ctx.quadraticCurveTo(-r * 0.95, r * 0.55, -r * 1.3, r * 0.05);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = hit ? '#fff' : '#e6fff8';
  ctx.beginPath(); ctx.ellipse(-r * 0.3, r * 0.3, r * 0.7, r * 0.2, 0.05, 0, TAU); ctx.fill();
  // gills + fin
  ctx.strokeStyle = ink; ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-r * 0.25 + i * 14, -r * 0.2); ctx.lineTo(-r * 0.3 + i * 14, r * 0.15); ctx.stroke(); }
  ctx.fillStyle = dark; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, r * 0.35); ctx.lineTo(r * 0.35, r * 0.85); ctx.lineTo(r * 0.4, r * 0.35); ctx.closePath(); ctx.fill(); ctx.stroke();
  // toothy grin
  ctx.fillStyle = '#2a1a1a';
  ctx.beginPath(); ctx.moveTo(-r * 1.15, r * 0.12); ctx.quadraticCurveTo(-r * 0.75, r * 0.42, -r * 0.4, r * 0.18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 5; i++) {
    const x = -r * 1.08 + i * r * 0.14;
    ctx.beginPath(); ctx.moveTo(x, r * 0.15); ctx.lineTo(x + r * 0.06, r * 0.27); ctx.lineTo(x + r * 0.12, r * 0.17); ctx.closePath(); ctx.fill();
  }
  // glowing ghost eye
  ctx.fillStyle = 'rgba(120,255,160,0.35)'; ctx.beginPath(); ctx.arc(-r * 0.75, -r * 0.18, r * 0.2, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7dffa0'; ctx.beginPath(); ctx.arc(-r * 0.75, -r * 0.18, r * 0.1, 0, TAU); ctx.fill();
  ctx.fillStyle = '#0d2a1a'; ctx.beginPath(); ctx.arc(-r * 0.78, -r * 0.18, r * 0.045, 0, TAU); ctx.fill();
  // pirate hat
  ctx.save(); ctx.translate(-r * 0.45, -r * 0.62); ctx.rotate(-0.15);
  ctx.fillStyle = '#1d1a24'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-r * 0.55, 0); ctx.quadraticCurveTo(0, -r * 0.75, r * 0.55, 0); ctx.quadraticCurveTo(0, -r * 0.15, -r * 0.55, 0);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, -r * 0.26, r * 0.09, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-r * 0.13, -r * 0.1); ctx.lineTo(r * 0.13, -r * 0.2); ctx.moveTo(r * 0.13, -r * 0.1); ctx.lineTo(-r * 0.13, -r * 0.2); ctx.stroke();
  ctx.restore();
}

function drawShadow(b) {
  const t = b.t, r = b.r;
  ctx.translate(b.x, b.y);
  // dark aura with crackles
  ctx.fillStyle = 'rgba(110,40,200,0.25)';
  ctx.beginPath(); ctx.arc(0, 0, r * 1.5 + Math.sin(t * 0.06) * 10, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(220,180,255,0.7)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const a = t * 0.03 + i * 2.1, d = r * 1.35;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * d, Math.sin(a) * d);
    ctx.lineTo(Math.cos(a + 0.12) * (d + 18), Math.sin(a + 0.12) * (d + 18) - 8);
    ctx.lineTo(Math.cos(a + 0.2) * d, Math.sin(a + 0.2) * d);
    ctx.stroke();
  }
  const colors = { body: b.flash > 0 ? '#ffffff' : '#2b1740', fin: '#6b2fd6', gill: '#c04dff', eye: '#ff5cf0' };
  drawLotl(0, 0, r, colors, { t, flip: true, seed: 11, trident: false });
  // angry brows over the glowing eyes (it faces left, so mirror x)
  ctx.strokeStyle = '#ff5cf0'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (const sd of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(-r * 0.14, sd * r * 0.5); ctx.lineTo(-r * 0.5, sd * r * (b.angry ? 0.36 : 0.42)); ctx.stroke();
  }
  // horns
  ctx.fillStyle = '#c04dff'; ctx.strokeStyle = '#1a0a2a'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  for (const sd of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(sd * r * 0.3 - 14, -r * 0.82); ctx.quadraticCurveTo(sd * r * 0.55, -r * 1.2, sd * r * 0.4, -r * 1.5);
    ctx.quadraticCurveTo(sd * r * 0.3, -r * 1.15, sd * r * 0.3 + 14, -r * 0.8); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
}

// Warning stripes, then whatever the stripe was warning about.
function drawHazards() {
  for (const hz of G.hazards) {
    ctx.save();
    if (hz.t < hz.warn) {
      const k = hz.t / hz.warn;                       // blinks faster as it gets close
      const blink = 0.5 + 0.5 * Math.sin(hz.t * (0.25 + k * 0.6));
      ctx.fillStyle = 'rgba(255,50,70,' + (0.16 + blink * 0.22) + ')';
      ctx.fillRect(hz.x, hz.y, hz.w, hz.h);
      ctx.setLineDash([18, 12]); ctx.lineDashOffset = -hz.t * 2;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.45 + blink * 0.45) + ')'; ctx.lineWidth = 4;
      ctx.strokeRect(hz.x + 2, hz.y + 2, hz.w - 4, hz.h - 4);
      ctx.setLineDash([]);
      // a big "!" reads as danger even to someone who can't read yet
      const ex = clamp(hz.x + hz.w / 2, 30, W - 30);
      const ey = hz.style === 'icicle' ? 150 : clamp(hz.y + hz.h / 2, 60, H - 160);
      ctx.globalAlpha = 0.7 + blink * 0.3;
      const br = 24 + blink * 4;
      ctx.fillStyle = '#ffd166'; ctx.strokeStyle = '#20141f'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(ex, ey, br, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.font = '900 34px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#20141f'; ctx.fillText('!', ex, ey + 2);
      if (hz.style === 'icicle') {                      // the icicle wobbling in the roof
        ctx.globalAlpha = 1;
        ctx.translate(hz.x + hz.w / 2 + Math.sin(hz.t * 1.2) * 3 * k, 0);
        drawIcicle(0, 82, 1);   // just under the boss bar, so it's never hidden
      }
    } else {
      const at = hz.t - hz.warn, left = hz.active - at;
      const ext = Math.min(1, at / 5) * Math.min(1, left / 5);
      if (hz.style === 'tongue') {
        const x1 = hz.x + hz.w, len = hz.w * ext, cy = hz.y + hz.h / 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#8f1f45'; ctx.lineWidth = hz.h * 0.7 + 8;
        ctx.beginPath(); ctx.moveTo(x1, cy); ctx.lineTo(x1 - len, cy); ctx.stroke();
        ctx.strokeStyle = '#ff6f91'; ctx.lineWidth = hz.h * 0.7;
        ctx.stroke();
        ctx.fillStyle = '#ff6f91'; ctx.strokeStyle = '#8f1f45'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(x1 - len, cy, hz.h * 0.55, 0, TAU); ctx.fill(); ctx.stroke();
      } else if (hz.style === 'tentacle') {
        const cx = hz.x + hz.w / 2, len = hz.h * ext;
        const y0 = hz.fromTop ? hz.y : hz.y + hz.h, dir = hz.fromTop ? 1 : -1;
        const pts = [];
        for (let d = 0; d <= len; d += 20) pts.push([cx + Math.sin(d * 0.02 + hz.t * 0.2) * 12 * (d / (len || 1)), y0 + dir * d]);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (const [col, lw] of [['#2a0c40', hz.w], ['#9c3fd0', hz.w - 12]]) {
          ctx.strokeStyle = col; ctx.lineWidth = lw;
          ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
        }
        ctx.fillStyle = '#e6b8ff';
        for (let i = 2; i < pts.length; i += 2) {
          ctx.beginPath(); ctx.arc(pts[i][0] - hz.w * 0.18, pts[i][1], 7, 0, TAU); ctx.fill();
        }
      } else if (hz.style === 'zap') {
        const cx = hz.x + hz.w / 2;
        ctx.fillStyle = 'rgba(255,250,200,' + (0.35 * ext) + ')';
        ctx.fillRect(hz.x, hz.y, hz.w, hz.h);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (const [col, lw] of [['rgba(255,214,102,0.8)', 26], ['#fffbe6', 9]]) {
          ctx.strokeStyle = col; ctx.lineWidth = lw;
          ctx.beginPath(); ctx.moveTo(cx, 0);
          for (let y = 40; y < H; y += 40) ctx.lineTo(cx + ((y * 7 + (hz.t | 0) * 13) % 44) - 22, y);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }
}

function drawIcicle(x, y, s) {
  ctx.fillStyle = '#e8fbff'; ctx.strokeStyle = '#3a8fc2'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - 14 * s, y - 18 * s); ctx.lineTo(x + 14 * s, y - 18 * s); ctx.lineTo(x, y + 26 * s); ctx.closePath();
  ctx.fill(); ctx.stroke();
}

const EB_STYLE = {
  fire:   ['#ff7a3d', '#a8320f'],
  ink:    ['#3a3a4a', '#15151f'],
  seed:   ['#9be36b', '#2f6b1f'],
  sand:   ['#e7b56e', '#8a5a2b'],
  ice:    ['#d8f6ff', '#3a8fc2'],
  jelly:  ['#ff8fcf', '#b0307a'],
  bone:   ['#f4f1e6', '#6b6250'],
  shadow: ['#b36bff', '#3a0f6b']
};

function drawEBullet(b) {
  if (b.kind === 'claw') {
    drawClaw(b.x, b.y, b.r * 1.3, b.t * 0.3, 0.3, '#e8552f', '#4a1a0a');
    return;
  }
  if (b.kind === 'icicle') { drawIcicle(b.x, b.y, 1); return; }
  const st = EB_STYLE[b.kind] || EB_STYLE.fire;
  if (b.kind === 'shadow') {
    ctx.fillStyle = 'rgba(179,107,255,0.3)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.6, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = st[0]; ctx.strokeStyle = st[1]; ctx.lineWidth = 3;
  if (b.kind === 'ice') {             // a little shard pointing where it flies
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.beginPath(); ctx.moveTo(b.r * 1.4, 0); ctx.lineTo(0, -b.r * 0.7); ctx.lineTo(-b.r, 0); ctx.lineTo(0, b.r * 0.7); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
    return;
  }
  if (b.kind === 'bone') {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.t * 0.2);
    ctx.lineCap = 'round'; ctx.strokeStyle = st[1]; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(-b.r, 0); ctx.lineTo(b.r, 0); ctx.stroke();
    ctx.strokeStyle = st[0]; ctx.lineWidth = 6; ctx.stroke();
    ctx.fillStyle = st[0];
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * b.r, sy * 5, 6, 0, TAU); ctx.fill(); }
    ctx.restore();
    return;
  }
  // a pale halo keeps dark shots (ink) visible on the dark worlds
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, TAU); ctx.fill();
  ctx.fillStyle = st[0];
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
  if (b.kind === 'seed' || b.kind === 'jelly') {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, TAU); ctx.fill();
  }
}

function drawBoss(b) {
  ctx.save();
  if (b.mode === 'dying') ctx.globalAlpha = 0.5 + Math.sin(b.t * 0.6) * 0.4;
  b.def.draw(b);
  ctx.restore();
  ctx.globalAlpha = 1;

  // hp bar — the label sits centred inside the bar, whatever baseline we inherited
  const bw = Math.min(W * 0.6, 620), bx = (W - bw) / 2, by = 22, bh = 26;
  ctx.fillStyle = 'rgba(30,16,40,0.35)';
  roundRect(bx - 5, by - 5, bw + 10, bh + 10, 16); ctx.fill();
  ctx.fillStyle = '#3b1f2e';
  roundRect(bx, by, bw, bh, 13); ctx.fill();
  ctx.fillStyle = b.def.bar;
  roundRect(bx, by, bw * clamp(b.hp / b.maxHp, 0, 1), bh, 13); ctx.fill();
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 17px system-ui,sans-serif';
  ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,16,40,0.55)';
  const label = b.def.icon + '  ' + b.def.name + '  ·  LEVEL ' + G.stage;
  ctx.strokeText(label, W / 2, by + bh / 2 + 1);
  ctx.fillStyle = '#fff';
  ctx.fillText(label, W / 2, by + bh / 2 + 1);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  const rr = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawEntities() {
  // orbs
  for (const o of G.orbs) {
    const pulse = 1 + Math.sin((o.t + o.phase * 20) * 0.12) * 0.12;
    ctx.fillStyle = 'rgba(155,107,255,0.28)';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 2.0 * pulse, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8e44e8';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r * pulse, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#4b1e8c'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(o.x - o.r * 0.3, o.y - o.r * 0.35, o.r * 0.26, 0, TAU); ctx.fill();
  }
  // pickups
  for (const k of G.pickups) {
    const s = 1 + Math.sin(k.t * 0.1) * 0.1;
    ctx.save(); ctx.translate(k.x, k.y); ctx.scale(s, s);
    ctx.font = '40px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(k.type === 'target' ? '🎯' : '❤️', 0, 0);
    ctx.restore();
  }
  drawHazards();
  // foes
  for (const f of G.foes) drawFoe(f);
  if (G.boss) drawBoss(G.boss);

  // a small crosshair shows what each auto-firing trident is aiming at
  for (const p of G.players) {
    const target = p.aimTarget;
    if (!p.alive || !target || target.dead || target.hp <= 0) continue;
    const rr = target.r * 0.72 + Math.sin(G.t * 0.12 + p.slot) * 3;
    ctx.save();
    ctx.strokeStyle = p.slot === 0 ? 'rgba(58,160,255,0.78)' : 'rgba(255,176,32,0.78)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(target.x, target.y, rr, 0, TAU); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(target.x + Math.cos(a) * (rr - 8), target.y + Math.sin(a) * (rr - 8));
      ctx.lineTo(target.x + Math.cos(a) * (rr + 8), target.y + Math.sin(a) * (rr + 8));
      ctx.stroke();
    }
    ctx.restore();
  }

  // bullets
  for (const b of G.bullets) {
    if (b.kind === 'bubble') {
      ctx.fillStyle = 'rgba(201,166,255,0.85)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#6a35c9'; ctx.lineWidth = 2.5; ctx.stroke();
    } else {
      ctx.save(); ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.strokeStyle = b.color || '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(10, 0); ctx.stroke();
      ctx.lineWidth = 4;
      for (const s of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(16, s * 7); ctx.stroke(); }
      ctx.restore();
    }
  }
  // enemy bullets
  for (const b of G.ebullets) drawEBullet(b);

  // players
  for (const p of G.players) {
    if (!p.alive) continue;
    if (p.inv > 0 && ((p.inv | 0) % 10) < 5) continue;
    // swim trail
    ctx.globalAlpha = 0.25; ctx.fillStyle = p.lotl.trail;
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath(); ctx.arc(p.x - p.facing * i * 16, p.y + Math.sin(p.bob - i) * 4, p.r * (1 - i * 0.22), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawLotl(p.x, p.y + Math.sin(p.bob) * 4, p.r, p.lotl, {
      t: G.t, seed: p.slot + 2, trident: true, flip: p.facing < 0,
      tilt: p.facing * clamp(p.vy * 0.02, -0.35, 0.35)
    });
    if (G.players.length > 1) {
      ctx.fillStyle = p.slot === 0 ? '#3aa0ff' : '#ffb020';
      ctx.font = '700 16px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('P' + (p.slot + 1), p.x, p.y - p.r - 14);
    }
  }
  // downed lotls
  for (const p of G.players) {
    if (p.alive) continue;
    ctx.save(); ctx.globalAlpha = 0.4;
    ctx.font = '700 20px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#4a2d6b';
    if (G.players.length > 1) ctx.fillText('P' + (p.slot + 1) + ' back in ' + Math.max(0, Math.ceil((480 - p.downTimer) / 60)) + 's', W / 2, H - 150);
    ctx.restore();
  }

  // fx
  for (const e of G.fx) {
    const k = 1 - e.t / e.life;
    ctx.globalAlpha = clamp(k, 0, 1);
    if (e.kind === 'dot') {
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * k, 0, TAU); ctx.fill();
    } else if (e.kind === 'ring') {
      ctx.strokeStyle = e.color; ctx.lineWidth = 12 * k;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + (e.max - e.r) * (1 - k), 0, TAU); ctx.stroke();
    } else if (e.kind === 'spark') {
      ctx.strokeStyle = e.color; ctx.lineWidth = 4;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU;
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10);
        ctx.lineTo(e.x + Math.cos(a) * (10 + 24 * (1 - k)), e.y + Math.sin(a) * (10 + 24 * (1 - k)));
        ctx.stroke();
      }
    } else if (e.kind === 'text') {
      ctx.fillStyle = e.color; ctx.font = '800 30px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 6;
      ctx.strokeText(e.text, e.x, e.y); ctx.fillText(e.text, e.x, e.y);
    } else if (e.kind === 'beam') {
      ctx.fillStyle = e.color;
      const h = 90 * (k * 0.6 + 0.4);
      const beamW = (e.max || POWER_RANGE) * (e.dir || 1);
      ctx.fillRect(e.x, e.y - h / 2, beamW, h);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(e.x, e.y - h / 6, beamW, h / 3);
    } else if (e.kind === 'bolt') {
      ctx.strokeStyle = e.color; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(e.x + rnd(-8, 8), 0);
      for (let y = 0; y < e.y; y += 40) ctx.lineTo(e.x + rnd(-22, 22), y);
      ctx.lineTo(e.x, e.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

/* ============================================================
   UI
   ============================================================ */
function btn(o) {
  // id must be stable frame to frame — fall back to position, since some labels animate
  o.id = o.id || (o.label + '@' + Math.round(o.x) + ',' + Math.round(o.y));
  buttons.push(o);
  const held = heldIds.has(o.id);
  ctx.save();
  const sc = held ? 0.95 : 1;
  if (o.shape === 'circle') {
    ctx.translate(o.x, o.y); ctx.scale(sc, sc);
    ctx.fillStyle = o.bg || '#8e44e8';
    ctx.beginPath(); ctx.arc(0, 0, o.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = o.stroke || 'rgba(0,0,0,0.35)'; ctx.lineWidth = 5; ctx.stroke();
    ctx.fillStyle = o.fg || '#fff';
    ctx.font = o.font || ('700 ' + Math.round(o.r * 0.7) + 'px system-ui,sans-serif');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.label, 0, 2);
  } else {
    ctx.translate(o.x + o.w / 2, o.y + o.h / 2); ctx.scale(sc, sc); ctx.translate(-o.w / 2, -o.h / 2);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    roundRect(4, 8, o.w, o.h, 20); ctx.fill();
    ctx.fillStyle = o.bg || '#8e44e8';
    roundRect(0, 0, o.w, o.h, 20); ctx.fill();
    ctx.strokeStyle = o.stroke || 'rgba(0,0,0,0.3)'; ctx.lineWidth = 4;
    roundRect(0, 0, o.w, o.h, 20); ctx.stroke();
    ctx.fillStyle = o.fg || '#fff';
    ctx.font = o.font || '800 34px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.label, o.w / 2, o.h / 2 + 2);
  }
  ctx.restore();
}

function bigTitle(text, y, size, color) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + size + 'px system-ui,-apple-system,sans-serif';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#20141f'; ctx.lineWidth = size * 0.17;
  ctx.strokeText(text, W / 2, y);
  ctx.fillStyle = color || '#ffd166';
  ctx.fillText(text, W / 2, y);
  ctx.restore();
}

function drawHUD() {
  const p = G.players[0];
  // health bars
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (const pl of G.players) {
    // below the top strip, so a health bar never runs into the boss bar
    const yy = 62 + pl.slot * 42;
    const bx = G.players.length > 1 ? 58 : 20, bw = 210, bh = 22;
    if (G.players.length > 1) {
      ctx.fillStyle = pl.slot === 0 ? '#3aa0ff' : '#ffb020';
      ctx.font = '800 20px system-ui,sans-serif';
      ctx.fillText('P' + (pl.slot + 1), 20, yy);
    }
    const ratio = clamp(pl.health / pl.maxHealth, 0, 1);
    ctx.fillStyle = 'rgba(32,20,31,0.28)'; roundRect(bx - 4, yy - bh / 2 - 4, bw + 8, bh + 8, 10); ctx.fill();
    ctx.fillStyle = '#fff'; roundRect(bx, yy - bh / 2, bw, bh, 7); ctx.fill();
    ctx.fillStyle = ratio > 0.55 ? '#45c46b' : ratio > 0.25 ? '#ffd166' : '#ff5a5f';
    if (ratio > 0) { roundRect(bx, yy - bh / 2, bw * ratio, bh, 7); ctx.fill(); }
    ctx.fillStyle = '#20141f'; ctx.font = '800 14px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(pl.health) + ' HP', bx + bw / 2, yy + 1);
    if (pl.aimTimer > 0) {
      ctx.textAlign = 'left'; ctx.font = '800 16px system-ui,sans-serif'; ctx.fillStyle = '#267fc5';
      ctx.fillText('🎯 ' + Math.ceil(pl.aimTimer / 60) + 's', bx + bw + 12, yy);
    }
  }

  // score + orbs
  // outlined, so it reads on the dark worlds as well as the light ones
  ctx.textAlign = 'right'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 6;
  ctx.font = '800 30px system-ui,sans-serif';
  ctx.strokeText(G.score.toLocaleString(), W - 22, 34);
  ctx.fillStyle = '#4a2d6b';
  ctx.fillText(G.score.toLocaleString(), W - 22, 34);
  ctx.font = '700 22px system-ui,sans-serif';
  const orbLine = '🟣 ' + G.orbCount + '   ⭐ ' + save.best.toLocaleString();
  ctx.strokeText(orbLine, W - 22, 66);
  ctx.fillStyle = '#7b3fd6';
  ctx.fillText(orbLine, W - 22, 66);

  // stage progress — training has no clock, so it says so instead
  if (G.training) {
    const bw = 200, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.72)'; roundRect(bx, 20, bw, 28, 14); ctx.fill();
    ctx.fillStyle = '#4a2d6b'; ctx.font = '800 17px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🎓 TRAINING', W / 2, 35);
  } else if (!G.boss) {
    const bw = 260, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; roundRect(bx, 20, bw, 16, 8); ctx.fill();
    ctx.fillStyle = '#7b3fd6'; roundRect(bx, 20, bw * clamp(G.stageTimer / STAGE_LEN, 0, 1), 16, 8); ctx.fill();
    ctx.font = '800 16px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    const lvl = 'LEVEL ' + G.stage + '  ·  boss: ' + bossFor().icon + ' ' + bossFor().name;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 5; ctx.strokeText(lvl, W / 2, 52);
    ctx.fillStyle = '#4a2d6b'; ctx.fillText(lvl, W / 2, 52);
  }

  // pause
  btn({ id: 'pause', shape: 'circle', x: W - 46, y: H - 46, r: 34, label: '⏸', bg: 'rgba(255,255,255,0.85)', fg: '#4a2d6b',
        onTap: () => { G.screen = 'paused'; } });

  // power buttons — one per player, big and thumb-friendly
  for (const pl of G.players) {
    const ready = pl.power >= pl.powerMax && pl.alive;
    const bx = pl.slot === 0 ? 92 : 92 + 190;
    const by = H - 92;
    const pulse = ready ? 1 + Math.sin(G.t * 0.15) * 0.05 : 1;
    ctx.save();
    ctx.translate(bx, by); ctx.scale(pulse, pulse); ctx.translate(-bx, -by);
    // meter ring
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.arc(bx, by, 58, 0, TAU); ctx.stroke();
    ctx.strokeStyle = ready ? '#ffd166' : shotColor(pl.lotl); ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(bx, by, 58, -Math.PI / 2, -Math.PI / 2 + TAU * (pl.power / pl.powerMax)); ctx.stroke();
    ctx.restore();
    btn({
      id: 'power' + pl.slot,
      shape: 'circle', x: bx, y: by, r: 48,
      label: ready ? pl.lotl.powerIcon : Math.floor(pl.power / pl.powerMax * 100) + '%',
      bg: ready ? '#ffd166' : 'rgba(255,255,255,0.75)',
      fg: ready ? '#4a2d6b' : '#8a7aa8',
      font: ready ? '40px system-ui,sans-serif' : '800 22px system-ui,sans-serif',
      onTap: () => firePower(pl)
    });
  }

  // the chain counter — front and centre while it's alive
  if (G.combo >= 3) {
    const m = comboMult();
    const pop = 1 + Math.max(0, (105 - G.comboTimer) < 8 ? 0 : 0) + Math.sin(G.t * 0.3) * 0.02;
    ctx.save();
    ctx.translate(W / 2, 108); ctx.scale(pop, pop);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 46px system-ui,sans-serif';
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#20141f'; ctx.lineWidth = 9;
    const txt = G.combo + ' CHAIN' + (m > 1 ? '  x' + m : '');
    ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = m > 1 ? '#ffd166' : '#fff';
    ctx.fillText(txt, 0, 0);
    // draining timer bar
    ctx.restore();
    const bw = 150, bx = W / 2 - bw / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; roundRect(bx, 132, bw, 8, 4); ctx.fill();
    ctx.fillStyle = '#ffd166';
    roundRect(bx, 132, bw * clamp(G.comboTimer / 105, 0, 1), 8, 4); ctx.fill();
  }

  if (G.coach) drawCoach();

  // banner
  if (G.banner) {
    const k = G.banner.t;
    const a = k < 15 ? k / 15 : k > 105 ? (130 - k) / 25 : 1;
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
    bigTitle(G.banner.text, H * 0.33, 76, '#ffd166');
    if (G.banner.sub) {

      ctx.fillStyle = '#fff'; ctx.fillText(G.banner.sub, W / 2, H * 0.33 + 58);
    }
    ctx.restore();
  }
}

function splitLines(text, maxW) {
  const lines = [];
  let line = '';
  for (const w of text.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function wrapText(text, cx, y, maxW, lh) {
  splitLines(text, maxW).forEach((l, i) => ctx.fillText(l, cx, y + i * lh));
}

// One line that must not clip: shrink until it fits the box it was given.
function fitOne(text, cx, y, maxW, size, weight) {
  let s = size;
  do {
    ctx.font = weight + ' ' + s + 'px system-ui,sans-serif';
    s -= 1;
  } while (ctx.measureText(text).width > maxW && s > 8);
  ctx.fillText(text, cx, y);
}

// Card blurbs vary in length, so pick the biggest size that still fits the
// space we have. Anything that refuses to fit gets clipped with an ellipsis
// rather than sliding under whatever is drawn below it.
function fitText(text, cx, y, maxW, maxLines, sizes, weight) {
  let lines = [], size = sizes[0];
  for (size of sizes) {
    ctx.font = weight + ' ' + size + 'px system-ui,sans-serif';
    lines = splitLines(text, maxW);
    if (lines.length <= maxLines) break;
  }
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[maxLines - 1] += '…';
  }
  const lh = size + 4;
  lines.forEach((l, i) => ctx.fillText(l, cx, y + i * lh));
  return y + lines.length * lh;
}

// left-aligned wrap that reports where it finished, so sections can stack
function wrapLeft(text, x, y, maxW, lh) {
  const words = text.split(' ');
  let lineStr = '', yy = y;
  for (const w of words) {
    const test = lineStr ? lineStr + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && lineStr) { ctx.fillText(lineStr, x, yy); lineStr = w; yy += lh; }
    else lineStr = test;
  }
  if (lineStr) { ctx.fillText(lineStr, x, yy); yy += lh; }
  return yy;
}

const levelsOpen = () => clamp(save.bestStage || 1, 1, BOSSES.length);
function openLevels() {
  G.pickingP2 = false;
  const cp = checkpoint();
  G.levelSel = cp && cp <= levelsOpen() ? cp : levelsOpen();
